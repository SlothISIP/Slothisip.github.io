<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Two-Tier Execution Funnel</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#64748b">cheap deterministic path first · LLM only when tools alone don't resolve</text>

  <rect x="380" y="85" width="340" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Inspection request</text>
  <text x="550" y="124" text-anchor="middle" font-size="11" fill="#64748b">image + sensor_data (+ optional worker_query)</text>

  <line x1="550" y1="133" x2="550" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="160" width="400" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tier classifier (deterministic)</text>
  <text x="550" y="198" text-anchor="middle" font-size="11" fill="#78350f">routes by input shape: image → goal_driven · query → communication</text>

  <line x1="550" y1="210" x2="550" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="245" width="740" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="550" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Tier 1 — Fast Path  (no LLM call)</text>
  <text x="200" y="290" font-size="11" fill="#065f46">Recognition fast_path: PatchCore score &gt; 0.9 → DEFECT  ·  &lt; 0.2 → NORMAL</text>
  <text x="200" y="306" font-size="11" fill="#065f46">Prediction fast_path: |z-score| &lt; 2 → NORMAL  ·  Learning fast_path: approval_rate cutoff</text>
  <text x="200" y="320" font-size="11" font-style="italic" fill="#065f46">Determines verdict from raw tool output. Skips entire ReAct loop. llm_calls_used = 0.</text>

  <line x1="280" y1="325" x2="280" y2="385" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <text x="195" y="360" font-size="11" font-weight="700" fill="#065f46">resolved →</text>
  <text x="200" y="375" font-size="10" fill="#065f46">return to operator</text>

  <line x1="820" y1="325" x2="820" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="350" font-size="11" font-weight="700" fill="#0f172a">no fast match →</text>

  <rect x="180" y="365" width="740" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Tier 2 — Goal-Driven ReAct  (LLM in the loop)</text>
  <text x="200" y="410" font-size="11" fill="#1e3a8a">LLM picks tools, sequence, stop point  ·  max_iterations = 5</text>
  <text x="200" y="426" font-size="11" fill="#1e3a8a">Plan → Execute(tool) → Observe → Replan, until confidence ≥ 0.70 or max reached</text>
  <text x="200" y="442" font-size="11" fill="#1e3a8a">Tool-failure recovery: agent re-plans with alternate tool (see react_trace.png)</text>
  <text x="200" y="458" font-size="11" font-style="italic" fill="#1e3a8a">Then guardrail validation runs on the result.</text>

  <line x1="280" y1="465" x2="280" y2="525" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <text x="195" y="498" font-size="11" font-weight="700" fill="#065f46">passed →</text>
  <text x="200" y="513" font-size="10" fill="#065f46">return to operator</text>

  <line x1="820" y1="465" x2="820" y2="505" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="835" y="490" font-size="11" font-weight="700" fill="#78350f">guardrail violation →</text>

  <rect x="180" y="505" width="740" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="528" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Tier 3 — Deliberation  (cross-agent contradiction · 2 rounds)</text>
  <text x="550" y="548" text-anchor="middle" font-size="11" fill="#78350f">no tiebreaker — Round 1 claims, Round 2 rebuttals, synthesis decides consensus or escalates</text>

  <line x1="820" y1="565" x2="820" y2="605" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="835" y="590" font-size="11" font-weight="700" fill="#991b1b">no consensus →</text>

  <rect x="180" y="605" width="740" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Tier 4 — HITL escalation</text>
  <text x="550" y="646" text-anchor="middle" font-size="11" fill="#991b1b">operator sees both agent positions + full trace · decision stored for Learning agent</text>

  <rect x="50" y="245" width="120" height="240" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="110" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">Captured run</text>
  <text x="110" y="282" text-anchor="middle" font-size="10" fill="#713f12">N = 10  ·  N=9 quality</text>
  <text x="110" y="295" text-anchor="middle" font-size="9" fill="#713f12">(+ 1 worker query)</text>

  <line x1="60" y1="305" x2="160" y2="305" stroke="#eab308" stroke-width="0.5"/>

  <text x="60" y="325" font-size="10" font-weight="700" fill="#065f46">Fast Path</text>
  <text x="160" y="325" text-anchor="end" font-size="10" font-weight="700" fill="#065f46">1 / 9</text>
  <text x="60" y="338" font-size="9" fill="#065f46">cold start, 113s*</text>

  <text x="60" y="358" font-size="10" font-weight="700" fill="#1e3a8a">ReAct</text>
  <text x="160" y="358" text-anchor="end" font-size="10" font-weight="700" fill="#1e3a8a">4 / 9</text>
  <text x="60" y="371" font-size="9" fill="#1e3a8a">2.3–26 s</text>

  <text x="60" y="391" font-size="10" font-weight="700" fill="#78350f">Deliberation</text>
  <text x="160" y="391" text-anchor="end" font-size="10" font-weight="700" fill="#78350f">4 / 9</text>
  <text x="60" y="404" font-size="9" fill="#78350f">5.3–33 s</text>

  <text x="60" y="424" font-size="10" font-weight="700" fill="#991b1b">→ HITL</text>
  <text x="160" y="424" text-anchor="end" font-size="10" font-weight="700" fill="#991b1b">6 / 10</text>
  <text x="60" y="437" font-size="9" fill="#991b1b">test bias toward</text>
  <text x="60" y="448" font-size="9" fill="#991b1b">edge cases</text>

  <text x="60" y="468" font-size="9" font-style="italic" fill="#713f12">*Warm Fast Path</text>
  <text x="60" y="479" font-size="9" font-style="italic" fill="#713f12">latency not yet</text>
  <text x="60" y="490" font-size="9" font-style="italic" fill="#713f12">benchmarked.</text>

  <rect x="930" y="245" width="155" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1007" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Why two tiers</text>
  <text x="945" y="290" font-size="10" fill="#334155">Fast Path: ms latency,</text>
  <text x="945" y="303" font-size="10" fill="#334155">$0 LLM cost,</text>
  <text x="945" y="316" font-size="10" fill="#334155">deterministic.</text>
  <text x="945" y="338" font-size="10" fill="#334155">ReAct: handles</text>
  <text x="945" y="351" font-size="10" fill="#334155">ambiguity + tool</text>
  <text x="945" y="364" font-size="10" fill="#334155">failures, costs</text>
  <text x="945" y="377" font-size="10" fill="#334155">seconds + tokens.</text>
  <text x="945" y="399" font-size="10" font-style="italic" fill="#334155">The cheap path</text>
  <text x="945" y="412" font-size="10" font-style="italic" fill="#334155">runs first by</text>
  <text x="945" y="425" font-size="10" font-style="italic" fill="#334155">design — not</text>
  <text x="945" y="438" font-size="10" font-style="italic" fill="#334155">as a fallback.</text>
  <text x="945" y="458" font-size="9" fill="#64748b">code: agent.fast_path</text>
  <text x="945" y="470" font-size="9" fill="#64748b">_check() returns</text>
  <text x="945" y="482" font-size="9" fill="#64748b">AgentResult or None</text>
</svg>
