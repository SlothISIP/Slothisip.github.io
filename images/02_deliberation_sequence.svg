<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Deliberation Protocol</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#64748b">2 rounds, no tiebreaker — disagreement is a first-class state</text>

  <rect x="200" y="80" width="700" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="550" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Trigger: cross_agent_contradiction (Recognition DEFECT + Prediction NORMAL)</text>

  <rect x="120" y="145" width="280" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Recognition</text>

  <rect x="700" y="145" width="280" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="840" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Prediction</text>

  <line x1="260" y1="187" x2="260" y2="510" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="840" y1="187" x2="840" y2="510" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <line x1="80" y1="220" x2="1020" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <rect x="478" y="205" width="144" height="30" rx="4" fill="#1e293b"/>
  <text x="550" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Round 1: Claims</text>

  <rect x="120" y="245" width="280" height="68" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">DEFECT · confidence 0.95</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#64748b">evidence: image score 0.95</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#64748b">tool: patchcore_score</text>

  <rect x="700" y="245" width="280" height="68" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="840" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">NORMAL · confidence 0.95</text>
  <text x="840" y="286" text-anchor="middle" font-size="11" fill="#64748b">evidence: z-score = 1.0</text>
  <text x="840" y="302" text-anchor="middle" font-size="11" fill="#64748b">tool: sensor_analyzer</text>

  <line x1="80" y1="335" x2="1020" y2="335" stroke="#94a3b8" stroke-width="1"/>
  <rect x="468" y="320" width="164" height="30" rx="4" fill="#1e293b"/>
  <text x="550" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Round 2: Rebuttals</text>

  <line x1="400" y1="385" x2="700" y2="385" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)"/>
  <line x1="700" y1="405" x2="400" y2="405" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)"/>
  <text x="550" y="378" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">each agent reviews opposing claim</text>

  <rect x="120" y="420" width="280" height="80" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">disagrees_with: Prediction</text>
  <text x="260" y="461" text-anchor="middle" font-size="11" fill="#64748b">agrees_with: none</text>
  <text x="260" y="478" text-anchor="middle" font-size="11" fill="#64748b">evidence unchanged</text>
  <text x="260" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">→ holds DEFECT</text>

  <rect x="700" y="420" width="280" height="80" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="840" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">disagrees_with: Recognition</text>
  <text x="840" y="461" text-anchor="middle" font-size="11" fill="#64748b">agrees_with: none</text>
  <text x="840" y="478" text-anchor="middle" font-size="11" fill="#64748b">evidence unchanged</text>
  <text x="840" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">→ holds NORMAL</text>

  <line x1="260" y1="510" x2="260" y2="535" stroke="#475569" stroke-width="2"/>
  <line x1="840" y1="510" x2="840" y2="535" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="535" x2="840" y2="535" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="535" x2="550" y2="555" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="560" width="300" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Synthesis</text>
  <text x="550" y="600" text-anchor="middle" font-size="11" fill="#1e3a8a">consensus? — if no, escalate</text>

  <line x1="550" y1="610" x2="550" y2="630" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="350" y="635" width="400" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="650" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">NO_CONSENSUS → HITL escalation (full trace visible to operator)</text>
</svg>
