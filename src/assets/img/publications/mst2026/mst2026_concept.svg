<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}
    .t-title{font-size:20px;font-weight:700}.t-sub{font-size:12px}
    .t-head{font-size:15px;font-weight:700}.t-chip{font-size:11.5px;font-weight:700}
    .t-lab{font-size:11px}.t-cap{font-size:12.5px}
  </style>
  <rect x="0.5" y="0.5" width="779" height="339" rx="12" fill="#ffffff" stroke="#e9ecef"/>

  <text class="ink t-title" x="28" y="42">Pool every frequency equally&#160;&#160;vs.&#160;&#160;learn which ones carry shape</text>
  <text class="muted t-sub" x="28" y="62">Amortised neural acoustic tomography &#8212; mst2026</text>

  <!-- Panel A: generic encoder -->
  <rect x="28" y="82" width="353" height="240" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text class="muted t-head" x="46" y="114">Generic encoder</text>
  <rect x="282" y="100" width="81" height="21" rx="10.5" fill="#f8f9fa"/>
  <text class="muted t-chip" x="322.5" y="114.5" text-anchor="middle">IoU 0.426</text>
  <g fill="#61686f" fill-opacity="0.5">
    <rect x="46" y="171" width="13" height="21" rx="2"/><rect x="65" y="171" width="13" height="21" rx="2"/>
    <rect x="84" y="171" width="13" height="21" rx="2"/><rect x="103" y="171" width="13" height="21" rx="2"/>
    <rect x="122" y="171" width="13" height="21" rx="2"/><rect x="141" y="171" width="13" height="21" rx="2"/>
    <rect x="160" y="171" width="13" height="21" rx="2"/><rect x="179" y="171" width="13" height="21" rx="2"/>
  </g>
  <text class="muted t-lab" x="46" y="214">real + imaginary input, mean pooling over F</text>
  <text class="muted t-lab" x="46" y="229">every frequency weighted 1.0&#215;</text>
  <text class="ink t-cap" x="46" y="258">Treats all 50 frequencies as equally informative</text>
  <text class="ink t-cap" x="46" y="276">and averages them, so the resonance band that</text>
  <text class="ink t-cap" x="46" y="294">actually encodes global geometry is diluted by</text>
  <text class="ink t-cap" x="46" y="312">the short-wavelength regime.</text>

  <!-- Panel B: acoustic-specific encoder -->
  <rect x="399" y="82" width="353" height="240" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text class="accent t-head" x="417" y="114">Acoustic-specific</text>
  <rect x="597" y="100" width="137" height="21" rx="10.5" fill="#eaf2fb"/>
  <text class="accent t-chip" x="665.5" y="114.5" text-anchor="middle">IoU 0.644&#160;&#160;+51.0%</text>
  <g fill="#1772d0">
    <rect x="417" y="163.7" width="13" height="28.3" rx="2"/><rect x="436" y="159.5" width="13" height="32.5" rx="2"/>
    <rect x="455" y="150.0" width="13" height="42.0" rx="2"/><rect x="474" y="158.4" width="13" height="33.6" rx="2"/>
    <rect x="493" y="176.3" width="13" height="15.7" rx="2"/><rect x="512" y="186.1" width="13" height="5.9" rx="2"/>
    <rect x="531" y="180.5" width="13" height="11.5" rx="2"/><rect x="550" y="170.0" width="13" height="22.0" rx="2"/>
  </g>
  <text class="muted t-lab" x="417" y="214">magnitude&#8211;phase input (Axis A)</text>
  <text class="muted t-lab" x="417" y="229">&#215; learned frequency attention &#945;(f) (Axis B)</text>
  <text class="ink t-cap" x="417" y="258">Separates scattering strength from propagation</text>
  <text class="ink t-cap" x="417" y="276">delay, then learns which frequencies matter:</text>
  <text class="ink t-cap" x="417" y="294">attention peaks at 2.0&#215; in the resonance band</text>
  <text class="ink t-cap" x="417" y="312">and falls to 0.28&#215; where the wavelength is small.</text>
</svg>
