<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}
    .t-title{font-size:19px;font-weight:700}.t-sub{font-size:12px}
    .t-head{font-size:15px;font-weight:700}.t-val{font-size:13px;font-weight:700}
    .t-lab{font-size:11px}.t-cap{font-size:11.5px}
    .axis{stroke:#cfd6dd;stroke-width:1}.grid{stroke:#eef1f4;stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="779" height="329" rx="12" fill="#ffffff" stroke="#e9ecef"/>

  <text class="ink t-title" x="28" y="42">One forward pass instead of a per-scene optimisation</text>
  <text class="muted t-sub" x="28" y="62">Reconstruction time per scene on an RTX 2080 Super, log scale &#8212; mst2026</text>

  <!-- gridlines (behind bars) -->
  <line class="grid" x1="365.6" y1="100" x2="365.6" y2="250"/>
  <line class="grid" x1="531.3" y1="100" x2="531.3" y2="250"/>
  <line class="grid" x1="696.9" y1="100" x2="696.9" y2="250"/>

  <!-- Row 1: auto-decoder -->
  <text class="muted t-head" x="28" y="128">Auto-decoder</text>
  <text class="muted t-lab" x="28" y="144">per-scene, 800 epochs</text>
  <rect x="200" y="110" width="509.9" height="40" rx="4" fill="#9aa3ab"/>
  <text class="t-val" x="214" y="135" fill="#ffffff">IoU 0.821 &#8212; the ceiling</text>
  <text class="t-val" x="695.9" y="135" fill="#ffffff" text-anchor="end">~120,000 ms</text>

  <!-- speed-up chip, sits in the 36px gap between the two bars -->
  <rect x="401.5" y="156" width="107" height="24" rx="12" fill="#eaf2fb"/>
  <text class="accent t-chip" x="455" y="172.5" text-anchor="middle" font-size="12" font-weight="700">~950&#215; faster</text>

  <!-- Row 2: amortised encoder -->
  <text class="accent t-head" x="28" y="204">Encoder (ours)</text>
  <text class="muted t-lab" x="28" y="220">single forward pass</text>
  <rect x="200" y="186" width="17.2" height="40" rx="3" fill="#1772d0"/>
  <text class="ink t-val" x="229" y="211">~127 ms</text>
  <text class="muted t-cap" x="291" y="211">IoU 0.644 &#8212; 78.4% of the auto-decoder ceiling, no per-scene fitting</text>

  <!-- axis -->
  <line class="axis" x1="200" y1="250" x2="730" y2="250"/>
  <text class="muted t-cap" x="200" y="268" text-anchor="middle">100</text>
  <text class="muted t-cap" x="365.6" y="268" text-anchor="middle">1,000</text>
  <text class="muted t-cap" x="531.3" y="268" text-anchor="middle">10,000</text>
  <text class="muted t-cap" x="696.9" y="268" text-anchor="middle">100,000</text>
  <text class="muted t-cap" x="465" y="292" text-anchor="middle">reconstruction time per scene (ms, log scale)</text>
  <text class="muted t-cap" x="28" y="312">Amortisation trades 0.177 IoU against a ~950&#215; speed-up &#8212; 0.8 ms to map observations to a latent code, ~126 ms to decode the 64&#179; SDF grid.</text>
</svg>
