<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}.white{fill:#ffffff}
    .t-title{font-size:20px;font-weight:700}.t-sub{font-size:12.5px}
    .t-box{font-size:12.5px}.t-box-b{font-size:12.5px;font-weight:700}
    .t-small{font-size:11px}.t-chip{font-size:11.5px;font-weight:700}
    .flow{fill:none;stroke:#9aa3ab;stroke-width:2}
    .box{fill:#ffffff;stroke:#e9ecef}
    .nov{fill:#eaf2fb;stroke:#1772d0;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ab"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="420" rx="12" class="box"/>

  <text class="ink t-title" x="32" y="46">How HNO works — re-weight a fixed basis, no FFT</text>
  <text class="muted t-sub" x="32" y="68">FFT-free branch–trunk operator · applsci2026</text>

  <!-- legend chip -->
  <rect x="992" y="32" width="172" height="26" rx="13" fill="#eaf2fb"/>
  <rect x="1008" y="41.5" width="11" height="11" rx="2.5" fill="#1772d0"/>
  <text class="accent t-chip" x="1027" y="49">highlighted = novelty</text>

  <!-- ============ ARROWS (drawn first, sit under boxes) ============ -->
  <!-- top lane (basis path) -->
  <path class="flow" d="M192,158 H222" marker-end="url(#ah)"/>
  <path class="flow" d="M386,158 H416" marker-end="url(#ah)"/>
  <!-- basis -> reconstruct (upper inlet) -->
  <path class="flow" d="M580,158 C700,158 686,205 800,205" marker-end="url(#ah)"/>
  <!-- bottom lane (medium / branch path) -->
  <path class="flow" d="M192,300 H222" marker-end="url(#ah)"/>
  <path class="flow" d="M386,300 H416" marker-end="url(#ah)"/>
  <path class="flow" d="M580,300 H610" marker-end="url(#ah)"/>
  <!-- gate -> reconstruct (lower inlet) -->
  <path class="flow" d="M774,300 C792,300 788,253 800,253" marker-end="url(#ah)"/>
  <!-- reconstruct -> output -->
  <path class="flow" d="M980,229 H1000" marker-end="url(#ah)"/>

  <!-- ============ TOP LANE ============ -->
  <rect class="box" x="32"  y="128" width="160" height="60" rx="10"/>
  <text class="ink t-box" x="112" y="162" text-anchor="middle">Query coordinates x</text>

  <rect class="box" x="226" y="128" width="160" height="60" rx="10"/>
  <text class="ink t-box-b" x="306" y="153" text-anchor="middle">Hybrid trunk</text>
  <text class="muted t-small" x="306" y="171" text-anchor="middle">SIREN + learn. Fourier (K=64)</text>

  <rect class="box" x="420" y="128" width="160" height="60" rx="10"/>
  <text class="ink t-box" x="500" y="153" text-anchor="middle">Fixed wave-tailored</text>
  <text class="ink t-box" x="500" y="171" text-anchor="middle">basis φ(x)</text>

  <!-- ============ BOTTOM LANE ============ -->
  <rect class="box" x="32"  y="270" width="160" height="60" rx="10"/>
  <text class="ink t-box" x="112" y="304" text-anchor="middle">Input medium n²(x)</text>

  <rect class="box" x="226" y="270" width="160" height="60" rx="10"/>
  <text class="ink t-box" x="306" y="304" text-anchor="middle">Spatial Feature Encoder</text>

  <rect class="nov" x="420" y="270" width="160" height="60" rx="10"/>
  <text class="accent t-box-b" x="500" y="295" text-anchor="middle">Rank-32 hypernetwork</text>
  <text class="accent t-small" x="500" y="313" text-anchor="middle">branch · dual-path</text>

  <rect class="nov" x="610" y="270" width="164" height="60" rx="10"/>
  <text class="accent t-box-b" x="692" y="295" text-anchor="middle">Bounded per-mode gate</text>
  <text class="accent t-small" x="692" y="313" text-anchor="middle">Δφ ∈ [−0.5, 0.5]</text>

  <!-- ============ RECONSTRUCT (focal) ============ -->
  <rect x="800" y="181" width="180" height="96" rx="12" fill="#1772d0"/>
  <text class="white t-box-b" x="890" y="214" text-anchor="middle">Re-weight fixed basis</text>
  <text class="white t-box-b" x="890" y="232" text-anchor="middle">&amp; reconstruct û</text>
  <text class="white t-small" x="890" y="255" text-anchor="middle" fill-opacity="0.9">û = Σ αₖ·φₖ(x)·(1+Δφₖ)</text>

  <!-- ============ OUTPUT ============ -->
  <rect class="box" x="1000" y="199" width="164" height="60" rx="10"/>
  <text class="ink t-box" x="1082" y="224" text-anchor="middle">Predicted wave</text>
  <text class="ink t-box" x="1082" y="242" text-anchor="middle">field û(x)</text>

  <!-- ============ FOOTER STRIP ============ -->
  <rect x="32" y="372" width="1132" height="32" rx="8" fill="#f8f9fa"/>
  <text class="muted t-chip" x="598" y="392" text-anchor="middle">FFT-free  ·  ~1.05M params  ·  4.6–16.4× faster than FNO  ·  OOD gap 19.6% vs 50.6%</text>
</svg>
