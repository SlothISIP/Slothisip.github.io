<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}.white{fill:#ffffff}
    .t-title{font-size:20px;font-weight:700}.t-sub{font-size:12.5px}
    .t-box{font-size:12.5px}.t-box-b{font-size:12.5px;font-weight:700}
    .t-small{font-size:11px}.t-chip{font-size:11.5px;font-weight:700}
    .flow{fill:none;stroke:#9aa3ab;stroke-width:2}
    .box{fill:#ffffff;stroke:#e9ecef}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ab"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="420" rx="12" class="box"/>

  <text class="ink t-title" x="32" y="46">How the system works &#8212; rhythm-preserving augmentation</text>
  <text class="muted t-sub" x="32" y="68">DTW-Enhanced CNN-LSTM &#183; electronics2025</text>

  <!-- legend chip -->
  <rect x="978" y="32" width="186" height="26" rx="13" fill="#eaf2fb"/>
  <rect x="994" y="41.5" width="11" height="11" rx="2.5" fill="#1772d0"/>
  <text class="accent t-chip" x="1013" y="49">highlighted = key idea</text>

  <!-- ===== ARROWS (under boxes) ===== -->
  <path class="flow" d="M200,232 H236" marker-end="url(#ah)"/>
  <path class="flow" d="M408,232 H440" marker-end="url(#ah)"/>
  <path class="flow" d="M648,232 H702" marker-end="url(#ah)"/>
  <path class="flow" d="M874,232 H906" marker-end="url(#ah)"/>

  <!-- n1 -->
  <rect class="box" x="32" y="200" width="168" height="64" rx="10"/>
  <text class="ink t-box-b" x="116" y="227" text-anchor="middle">UWB radar</text>
  <text class="muted t-small" x="116" y="245" text-anchor="middle">Xethru X4M300 &#183; chest motion</text>

  <!-- n2 -->
  <rect class="box" x="240" y="200" width="168" height="64" rx="10"/>
  <text class="ink t-box-b" x="324" y="227" text-anchor="middle">Bandpass filter</text>
  <text class="muted t-small" x="324" y="245" text-anchor="middle">0.1&#8211;1 Hz &#183; isolates respiration</text>

  <!-- focal: DTW-SMOTE-TS -->
  <rect x="448" y="184" width="200" height="96" rx="12" fill="#1772d0"/>
  <text class="white t-box-b" x="548" y="213" text-anchor="middle">DTW-SMOTE-TS</text>
  <text class="white t-small" x="548" y="234" text-anchor="middle">DTW replaces Euclidean SMOTE</text>
  <text class="white t-small" x="548" y="255" text-anchor="middle" fill-opacity="0.9">keeps breathing cadence</text>

  <!-- n4 -->
  <rect class="box" x="706" y="200" width="168" height="64" rx="10"/>
  <text class="ink t-box-b" x="790" y="227" text-anchor="middle">CNN-LSTM</text>
  <text class="muted t-small" x="790" y="245" text-anchor="middle">3&#215;Conv1D + 2&#215;LSTM</text>

  <!-- n5 -->
  <rect class="box" x="910" y="200" width="168" height="64" rx="10"/>
  <text class="ink t-box-b" x="994" y="227" text-anchor="middle">Normal vs apnea</text>
  <text class="muted t-small" x="994" y="245" text-anchor="middle">binary classification</text>

  <!-- footer stat strip -->
  <rect x="32" y="372" width="1132" height="32" rx="8" fill="#f8f9fa"/>
  <text class="muted t-chip" x="598" y="392" text-anchor="middle">94.3% accuracy  &#183;  AUC 0.969  &#183;  104,578 params (~410 KB)  &#183;  +5.2% from DTW vs plain SMOTE</text>
</svg>
