<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}
    .t-title{font-size:19px;font-weight:700}.t-sub{font-size:12px}
    .t-val{font-size:13px;font-weight:700}.t-lab{font-size:12px}.t-cap{font-size:11.5px}
    .axis{stroke:#cfd6dd;stroke-width:1}.grid{stroke:#eef1f4;stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="619" height="359" rx="12" fill="#ffffff" stroke="#e9ecef"/>
  <text class="ink t-title" x="28" y="42">Augmentation rescues a data-scarce model</text>
  <text class="muted t-sub" x="28" y="62">DTW-Enhanced CNN-LSTM &#8212; test accuracy &#8212; electronics2025</text>
  <line class="grid" x1="92" y1="292.0" x2="592" y2="292.0"/>
  <text class="muted t-cap" x="84" y="296.0" text-anchor="end">80%</text>
  <line class="grid" x1="92" y1="237.0" x2="592" y2="237.0"/>
  <text class="muted t-cap" x="84" y="241.0" text-anchor="end">85%</text>
  <line class="grid" x1="92" y1="182.0" x2="592" y2="182.0"/>
  <text class="muted t-cap" x="84" y="186.0" text-anchor="end">90%</text>
  <line class="grid" x1="92" y1="127.0" x2="592" y2="127.0"/>
  <text class="muted t-cap" x="84" y="131.0" text-anchor="end">95%</text>
  <line class="axis" x1="92" y1="116" x2="92" y2="292"/>
  <rect x="137.0" y="266.7" width="86" height="25.3" rx="3" fill="#cfd6dd"/>
  <text class="ink t-val" x="180" y="257.7" text-anchor="middle">82.3%</text>
  <text class="muted t-lab" x="180" y="312" text-anchor="middle">no</text>
  <text class="muted t-lab" x="180" y="327" text-anchor="middle">augmentation</text>
  <rect x="302.0" y="191.9" width="86" height="100.1" rx="3" fill="#cfd6dd"/>
  <text class="ink t-val" x="345" y="182.9" text-anchor="middle">89.1%</text>
  <text class="muted t-lab" x="345" y="312" text-anchor="middle">SMOTE</text>
  <text class="muted t-lab" x="345" y="327" text-anchor="middle">w/o DTW</text>
  <rect x="467.0" y="134.7" width="86" height="157.3" rx="3" fill="#1772d0"/>
  <text class="accent t-val" x="510" y="125.7" text-anchor="middle">94.3%</text>
  <text class="accent t-lab" x="510" y="312" text-anchor="middle" font-weight="700">+ DTW-SMOTE-TS</text>
  <path d="M180,244.70000000000005 L180,114 L510,114 L510,112.70000000000005" fill="none" stroke="#61686f" stroke-width="1.2"/>
  <text class="ink t-val" x="345" y="107" text-anchor="middle">+12 pts over the non-augmented baseline</text>
  <text class="accent t-cap" x="427.5" y="138.70000000000005" text-anchor="middle">DTW adds +5.2</text>
</svg>
