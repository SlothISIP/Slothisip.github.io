<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}.white{fill:#ffffff}
    .t-title{font-size:20px;font-weight:700}.t-sub{font-size:12.5px}
    .t-box{font-size:12.5px}.t-box-b{font-size:12.5px;font-weight:700}
    .t-small{font-size:11px}.t-chip{font-size:11.5px;font-weight:700}
    .t-tag{font-size:11px;font-weight:700}
    .flow{fill:none;stroke:#9aa3ab;stroke-width:2}
    .box{fill:#ffffff;stroke:#e9ecef}
    .nov{fill:#eaf2fb;stroke:#1772d0;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ab"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="440" rx="12" class="box"/>

  <text class="ink t-title" x="32" y="46">How calibration works &#8212; vanishing points replace correspondences</text>
  <text class="muted t-sub" x="32" y="68">Three-Viewpoints Thermal Camera &#183; springer2024</text>

  <!-- legend chip -->
  <rect x="946" y="32" width="218" height="26" rx="13" fill="#eaf2fb"/>
  <rect x="962" y="41.5" width="11" height="11" rx="2.5" fill="#1772d0"/>
  <text class="accent t-chip" x="981" y="49">highlighted = novel constraint</text>

  <!-- ===== ARROWS (under boxes) ===== -->
  <path class="flow" d="M190,245 H206" marker-end="url(#ah)"/>
  <!-- VDSR splits up (intrinsic) and down (extrinsic) -->
  <path class="flow" d="M368,245 C384,245 386,170 400,170" marker-end="url(#ah)"/>
  <path class="flow" d="M368,245 C384,245 386,320 400,320" marker-end="url(#ah)"/>
  <!-- top (intrinsic) lane -->
  <path class="flow" d="M558,170 H768" marker-end="url(#ah)"/>
  <!-- bottom (extrinsic) lane -->
  <path class="flow" d="M558,320 H576" marker-end="url(#ah)"/>
  <path class="flow" d="M750,320 H768" marker-end="url(#ah)"/>
  <!-- recombine into terminal -->
  <path class="flow" d="M930,170 C956,170 958,245 980,245" marker-end="url(#ah)"/>
  <path class="flow" d="M930,320 C956,320 958,245 980,245" marker-end="url(#ah)"/>

  <!-- shared input -->
  <rect class="box" x="32" y="216" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="111" y="241" text-anchor="middle">Capture checkerboard</text>
  <text class="muted t-small" x="111" y="258" text-anchor="middle">low-texture thermal</text>

  <!-- VDSR (shared) -->
  <rect class="box" x="210" y="216" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="289" y="241" text-anchor="middle">VDSR super-res</text>
  <text class="muted t-small" x="289" y="258" text-anchor="middle">sharpens the image</text>

  <!-- ===== TOP LANE: intrinsic ===== -->
  <text class="muted t-tag" x="400" y="128">Intrinsic parameters</text>
  <rect class="box" x="400" y="141" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="479" y="166" text-anchor="middle">Corner detection</text>
  <text class="muted t-small" x="479" y="183" text-anchor="middle">on sharpened board</text>

  <rect class="box" x="772" y="141" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="851" y="166" text-anchor="middle">Estimate intrinsics</text>
  <text class="muted t-small" x="851" y="183" text-anchor="middle">camera matrix K</text>

  <!-- ===== BOTTOM LANE: extrinsic ===== -->
  <text class="muted t-tag" x="400" y="374">Extrinsic parameters</text>
  <rect class="box" x="400" y="291" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="479" y="316" text-anchor="middle">Line detection</text>
  <text class="muted t-small" x="479" y="333" text-anchor="middle">dominant parallel lines</text>

  <!-- focal: vanishing-point extraction (novel constraint) -->
  <rect class="nov" x="580" y="284" width="170" height="72" rx="12"/>
  <text class="accent t-box-b" x="665" y="306" text-anchor="middle">Vanishing-point</text>
  <text class="accent t-box-b" x="665" y="323" text-anchor="middle">extraction</text>
  <text class="accent t-small" x="665" y="341" text-anchor="middle">the novel constraint</text>

  <rect class="box" x="772" y="291" width="158" height="58" rx="10"/>
  <text class="ink t-box-b" x="851" y="316" text-anchor="middle">Estimate extrinsics</text>
  <text class="muted t-small" x="851" y="333" text-anchor="middle">relative pose R, t</text>

  <!-- ===== TERMINAL result ===== -->
  <rect x="980" y="209" width="180" height="72" rx="12" fill="#1772d0"/>
  <text class="white t-box-b" x="1070" y="240" text-anchor="middle">Calibrated 3-view rig</text>
  <text class="white t-small" x="1070" y="259" text-anchor="middle" fill-opacity="0.9">reprojection error &lt; 0.8 px</text>

  <!-- footer stat strip -->
  <rect x="32" y="392" width="1132" height="32" rx="8" fill="#f8f9fa"/>
  <text class="muted t-chip" x="598" y="412" text-anchor="middle">&lt; 0.8 px reprojection (0.58&#8211;0.66 px)  &#183;  ~5 2D&#8211;3D point pairs, no matching  &#183;  &gt;180&#176; (~240&#176;) baseline</text>
</svg>
