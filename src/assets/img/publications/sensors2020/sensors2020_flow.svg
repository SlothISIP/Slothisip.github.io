<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Lato, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .ink{fill:#1a1a1a}.muted{fill:#61686f}.accent{fill:#1772d0}.white{fill:#ffffff}
    .t-title{font-size:20px;font-weight:700}.t-sub{font-size:12.5px}
    .t-box{font-size:12.5px}.t-box-b{font-size:12.5px;font-weight:700}
    .t-small{font-size:11px}.t-chip{font-size:11.5px;font-weight:700}
    .t-tag{font-size:11px;font-weight:700}
    .flow{fill:none;stroke:#9aa3ab;stroke-width:2}
    .box{fill:#ffffff;stroke:#e9ecef}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ab"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1180" height="440" rx="12" class="box"/>

  <text class="ink t-title" x="32" y="46">How detection works &#8212; one decision rule, two input paths</text>
  <text class="muted t-sub" x="32" y="68">UWB-radar apnea detection &#183; sensors2020</text>

  <!-- legend chip -->
  <rect x="964" y="32" width="200" height="26" rx="13" fill="#eaf2fb"/>
  <rect x="980" y="41.5" width="11" height="11" rx="2.5" fill="#1772d0"/>
  <text class="accent t-chip" x="999" y="49">highlighted = decision rule</text>

  <!-- ===== ARROWS (under boxes) ===== -->
  <!-- input split -->
  <path class="flow" d="M190,230 C214,230 216,150 240,150" marker-end="url(#ah)"/>
  <path class="flow" d="M190,230 C214,230 216,310 240,310" marker-end="url(#ah)"/>
  <!-- top lane -->
  <path class="flow" d="M398,150 H426" marker-end="url(#ah)"/>
  <path class="flow" d="M588,150 C700,150 690,200 800,205" marker-end="url(#ah)"/>
  <!-- bottom lane -->
  <path class="flow" d="M398,310 H426" marker-end="url(#ah)"/>
  <path class="flow" d="M588,310 H616" marker-end="url(#ah)"/>
  <path class="flow" d="M778,310 C792,310 788,258 800,255" marker-end="url(#ah)"/>
  <!-- focal -> output -->
  <path class="flow" d="M990,230 H1010" marker-end="url(#ah)"/>

  <!-- shared input -->
  <rect class="box" x="32" y="200" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="111" y="225" text-anchor="middle">UWB radar</text>
  <text class="muted t-small" x="111" y="243" text-anchor="middle">Novelda X4 &#183; 8.2 GHz &#183; 30&#8211;50 cm</text>

  <!-- ===== TOP LANE: single-input path ===== -->
  <text class="muted t-tag" x="240" y="110">single-input path</text>
  <rect class="box" x="240" y="120" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="319" y="145" text-anchor="middle">Single respiration</text>
  <text class="muted t-small" x="319" y="163" text-anchor="middle">one acquisition</text>

  <rect class="box" x="430" y="120" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="509" y="145" text-anchor="middle">Z-transform</text>
  <text class="muted t-small" x="509" y="163" text-anchor="middle">B(z) / A(z) ratio</text>

  <!-- ===== BOTTOM LANE: multi-input fusion path ===== -->
  <text class="muted t-tag" x="240" y="356">multi-input fusion path</text>
  <rect class="box" x="240" y="280" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="319" y="305" text-anchor="middle">Multiple respirations</text>
  <text class="muted t-small" x="319" y="323" text-anchor="middle">sum of 2&#8211;3 acquisitions</text>

  <rect class="box" x="430" y="280" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="509" y="305" text-anchor="middle">Filter bank</text>
  <text class="muted t-small" x="509" y="323" text-anchor="middle">0.1&#8211;0.5 Hz + adaptive HPF</text>

  <rect class="box" x="620" y="280" width="158" height="60" rx="10"/>
  <text class="ink t-box-b" x="699" y="305" text-anchor="middle">Apnea &#8594; bursts</text>
  <text class="muted t-small" x="699" y="323" text-anchor="middle">count grows with apnea</text>

  <!-- ===== FOCAL: Z-domain decision rule ===== -->
  <rect x="800" y="178" width="190" height="104" rx="12" fill="#1772d0"/>
  <text class="white t-box-b" x="895" y="211" text-anchor="middle">Z-domain pole-zero</text>
  <text class="white t-box-b" x="895" y="229" text-anchor="middle">decision rule</text>
  <text class="white t-small" x="895" y="251" text-anchor="middle" fill-opacity="0.9">normal vs apnea =</text>
  <text class="white t-small" x="895" y="267" text-anchor="middle" fill-opacity="0.9">distinct regions</text>

  <!-- output -->
  <rect class="box" x="1014" y="200" width="154" height="60" rx="10"/>
  <text class="ink t-box-b" x="1091" y="225" text-anchor="middle">Normal vs Apnea</text>
  <text class="muted t-small" x="1091" y="243" text-anchor="middle">abnormal detected</text>

  <!-- footer stat strip -->
  <rect x="32" y="392" width="1132" height="32" rx="8" fill="#f8f9fa"/>
  <text class="muted t-chip" x="598" y="412" text-anchor="middle">Accuracy 67% (single input)  &#8594;  93% (triple-input fusion)  &#183;  Z-domain pole-zero decision rule</text>
</svg>
