<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue phrase) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">A detected box becomes an <tspan fill="#1772d0">IPC-A-610</tspan> verdict.</text>

  <!-- ============ INBOUND: gray hairlines converging on the focal ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M242 176 C 372 176, 404 258, 424 258"/>
    <path d="M242 258 C 372 258, 404 258, 424 258"/>
    <path d="M242 340 C 372 340, 404 258, 424 258"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="238" cy="176" r="3"/>
    <circle cx="238" cy="258" r="3"/>
    <circle cx="238" cy="340" r="3"/>
  </g>
  <text x="56" y="170" font-size="18" font-weight="600" fill="#6b7280">PCB input</text>
  <text x="56" y="190" font-size="13" font-weight="600" fill="#6b7280">3034 &#215; 1586 boards</text>
  <text x="56" y="252" font-size="18" font-weight="600" fill="#6b7280">YOLOv8 detection</text>
  <text x="56" y="272" font-size="13" font-weight="600" fill="#6b7280">n / s / m / l / x</text>
  <text x="56" y="340" font-size="13" font-weight="600" fill="#6b7280">boxes + confidence</text>

  <!-- outbound hairlines to the three outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 258 C 668 258, 692 178, 748 178"/>
    <path d="M576 258 C 668 258, 692 258, 748 258"/>
    <path d="M576 258 C 668 258, 692 338, 748 338"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: compliance mapping ============ -->
  <circle cx="500" cy="258" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="258" r="76" fill="#1772d0"/>
  <text x="500" y="250" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="0.2" fill="#ffffff">IPC-A-610</text>
  <text x="500" y="278" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">Class 1 / 2 / 3 mapping</text>

  <!-- ============ THREE OUTCOMES (DEFECT is the lone orange) ============ -->
  <circle cx="750" cy="178" r="5" fill="#6b7280"/>
  <text x="768" y="184" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">ACCEPTABLE</text>

  <circle cx="750" cy="258" r="5" fill="#6b7280"/>
  <text x="768" y="264" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">PROCESS_IND.</text>

  <circle cx="750" cy="338" r="6" fill="#e8833a"/>
  <text x="768" y="344" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">DEFECT</text>

  <!-- ============ QUIET OUTCOME LANE: the verdict ============ -->
  <path d="M242 422 L 470 422" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>
  <circle cx="238" cy="422" r="3" fill="#e6e9ee"/>
  <text x="486" y="427" font-size="15" font-weight="600" fill="#6b7280">three classes collapse to a PASS / FAIL verdict</text>
</svg>
