<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ===== HEADLINE (one blue phrase) ===== -->
  <text x="48" y="64" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.4">The same defect grades <tspan fill="#1772d0">stricter</tspan> by class.</text>

  <!-- ===== THE ONE BLUE FOCAL: the detected defect ===== -->
  <circle cx="170" cy="262" r="100" fill="#1772d0" opacity="0.06"/>
  <circle cx="170" cy="262" r="76" fill="#1772d0"/>
  <text x="170" y="256" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.2" fill="#ffffff">Insufficient</text>
  <text x="170" y="282" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.2" fill="#ffffff">solder</text>

  <!-- ===== GRAY HAIRLINE SCAFFOLD: one defect fans out to three acceptability classes ===== -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M246 220 C 380 150, 470 150, 560 150"/>
    <path d="M246 262 C 380 262, 470 262, 560 262"/>
    <path d="M246 304 C 380 374, 470 374, 560 374"/>
  </g>

  <!-- stricter direction cue -->
  <text x="640" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280" letter-spacing="0.3">stricter acceptability &#8594;</text>

  <!-- ===== CLASS 1 : PROCESS INDICATOR (neutral) ===== -->
  <rect x="560" y="122" width="320" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="588" y="156" font-size="16" font-weight="800" fill="#6b7280">Class 1</text>
  <text x="852" y="156" text-anchor="end" font-size="15" font-weight="700" fill="#6b7280">PROCESS INDICATOR</text>

  <!-- ===== CLASS 2 : DEFECT (neutral) ===== -->
  <rect x="560" y="234" width="320" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="588" y="268" font-size="16" font-weight="800" fill="#6b7280">Class 2</text>
  <text x="852" y="268" text-anchor="end" font-size="15" font-weight="700" fill="#6b7280">DEFECT</text>

  <!-- ===== CLASS 3 : NONCONFORMING (the one orange beat) ===== -->
  <rect x="560" y="346" width="320" height="56" rx="8" fill="#e8833a" opacity="0.10"/>
  <rect x="560" y="346" width="320" height="56" rx="8" fill="none" stroke="#e8833a" stroke-width="2.2"/>
  <text x="588" y="380" font-size="16" font-weight="800" fill="#e8833a">Class 3</text>
  <text x="852" y="380" text-anchor="end" font-size="15" font-weight="800" fill="#e8833a">NONCONFORMING</text>
</svg>
