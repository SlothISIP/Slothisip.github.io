<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">Matching the DCASE 2020 winners</text>
  <rect x="40" y="55" width="318" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="79" font-size="13" fill="#64748b">Per-machine AUC vs the winners ~0.92, on the open benchmark.</text>

  <!-- ===== PLOT FRAME =====
       y-axis: 0.85 (bottom y=360) .. 1.00 (top y=130) ; 230px for 0.15 -->
  <!-- gridlines + y tick labels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">
    <line x1="150" y1="360" x2="980" y2="360" stroke="#e2e8f0" stroke-width="1"/>
    <text x="138" y="364">0.85</text>
    <line x1="150" y1="283.3" x2="980" y2="283.3" stroke="#e2e8f0" stroke-width="1"/>
    <text x="138" y="287.3">0.90</text>
    <line x1="150" y1="206.7" x2="980" y2="206.7" stroke="#e2e8f0" stroke-width="1"/>
    <text x="138" y="210.7">0.95</text>
    <line x1="150" y1="130" x2="980" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <text x="138" y="134">1.00</text>
  </g>
  <!-- axis label -->
  <text x="64" y="245" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" transform="rotate(-90 64 245)" letter-spacing=".5">AUC</text>
  <!-- baseline + y axis -->
  <line x1="150" y1="130" x2="150" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="150" y1="360" x2="980" y2="360" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== BARS ===== bar width 110, centers at 245,420,595,770 -->
  <!-- Fan 0.88 (below winners) honestly muted grey -->
  <rect x="190" y="314" width="110" height="46" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="245" y="305" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">0.88</text>
  <text x="245" y="382" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Fan</text>

  <!-- Pump 0.93 (at/above winners) green -->
  <rect x="365" y="237.3" width="110" height="122.7" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="228.3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">0.93</text>
  <text x="420" y="382" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Pump</text>

  <!-- Slider 0.98 green -->
  <rect x="540" y="160.7" width="110" height="199.3" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="151.7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">0.98</text>
  <text x="595" y="382" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Slider</text>

  <!-- Valve 0.99 green -->
  <rect x="715" y="145.3" width="110" height="214.7" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="770" y="136.3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">0.99</text>
  <text x="770" y="382" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Valve</text>

  <!-- ===== WINNERS REFERENCE LINE (dashed, calm grey) at 0.92 -> y=252.7 ===== -->
  <line x1="150" y1="252.7" x2="980" y2="252.7" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="852" y="240" width="118" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="911" y="257" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">winners ~0.92</text>

  <!-- ===== ORANGE FOCAL: AVS mean ~0.94 -> y=222 ===== -->
  <line x1="150" y1="222" x2="980" y2="222" stroke="#f09228" stroke-width="2.2"/>
  <rect x="852" y="184" width="118" height="30" rx="8" fill="#fef3c7" stroke="#f09228" stroke-width="1.5"/>
  <text x="911" y="204" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">mean ~0.94</text>
  <text x="911" y="178" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing=".5">AVS</text>

  <!-- ===== HONESTY FOOTER ===== -->
  <rect x="40" y="406" width="1020" height="46" rx="8" fill="#f8f9fa"/>
  <text x="56" y="427" font-size="11.5" font-style="italic" fill="#64748b">Open DCASE 2020 Task 2 / MIMII (<tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-style="normal">18,019 wav</tspan>), per-machine-ID protocol.</text>
  <text x="56" y="444" font-size="11.5" font-style="italic" fill="#64748b">Fan sits below the winners line.</text>
</svg>
