<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ===== TITLE (one blue word) ===== -->
  <text x="40" y="52" font-size="25" font-weight="800" fill="#0f172a" letter-spacing="-.3">Matching the DCASE 2020 <tspan fill="#1772d0">winners</tspan>.</text>
  <text x="40" y="78" font-size="13" fill="#6b7280">Per-machine AUC on the open benchmark; the AVS mean meets the 2020 winners.</text>

  <!-- ===== BASELINE (gray hairline) ===== -->
  <line x1="150" y1="350" x2="880" y2="350" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- ===== REFERENCE LINES + left-margin labels ===== -->
  <!-- winners ~0.92 (calm gray dashed) -->
  <line x1="150" y1="242.7" x2="880" y2="242.7" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="142" y="238" text-anchor="end" font-size="12" font-weight="700" fill="#6b7280">winners ~0.92</text>
  <!-- AVS mean ~0.94 (the one orange focal) -->
  <line x1="150" y1="212" x2="880" y2="212" stroke="#e8833a" stroke-width="2.2"/>
  <text x="142" y="208" text-anchor="end" font-size="13" font-weight="800" fill="#e8833a">AVS mean ~0.94</text>

  <!-- ===== BARS (blue = meets/beats winners; Fan honestly muted gray) ===== -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">
    <!-- Fan 0.88 (below winners) -->
    <rect x="200" y="304" width="100" height="46" rx="3" fill="#eef0f3" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="250" y="296" font-size="15" font-weight="700" fill="#6b7280">0.88</text>
    <!-- Pump 0.93 -->
    <rect x="380" y="227.3" width="100" height="122.7" rx="3" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.5"/>
    <text x="430" y="219.3" font-size="15" font-weight="700" fill="#1772d0">0.93</text>
    <!-- Slider 0.98 -->
    <rect x="560" y="150.7" width="100" height="199.3" rx="3" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.5"/>
    <text x="610" y="142.7" font-size="15" font-weight="700" fill="#1772d0">0.98</text>
    <!-- Valve 0.99 -->
    <rect x="740" y="135.3" width="100" height="214.7" rx="3" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.5"/>
    <text x="790" y="127.3" font-size="15" font-weight="700" fill="#1772d0">0.99</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">
    <text x="250" y="374">Fan</text>
    <text x="430" y="374">Pump</text>
    <text x="610" y="374">Slider</text>
    <text x="790" y="374">Valve</text>
  </g>
</svg>
