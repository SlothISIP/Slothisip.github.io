<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="lp-froze" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e6e9ee" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ===== TITLE (one blue phrase) ===== -->
  <text x="40" y="50" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-.3"><tspan fill="#1772d0">0.68%-1.35%</tspan> trainable parameters depending on machine type.</text>
  <text x="40" y="74" font-size="13" fill="#6b7280">LoRA freezes the 87M-parameter AST encoder and trains a compact adapter for each machine type.</text>

  <!-- ===== PROPORTION: big frozen encoder + tiny orange adapter ===== -->
  <rect x="40" y="108" width="776" height="120" rx="10" fill="url(#lp-froze)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="428" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">AST encoder — frozen</text>
  <text x="428" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">≈87M parameters, weights never updated</text>

  <!-- tiny ORANGE focal sliver: LoRA adapter -->
  <rect x="824" y="108" width="96" height="120" rx="10" fill="#e8833a" opacity="0.13"/>
  <rect x="824" y="108" width="96" height="120" rx="10" fill="none" stroke="#e8833a" stroke-width="2.2"/>
  <text x="872" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#e8833a">LoRA</text>
  <text x="872" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#e8833a">≈0.6M-1.18M</text>
  <text x="872" y="200" text-anchor="middle" font-size="10.5" font-weight="800" fill="#e8833a">0.68%-1.35%</text>

  <!-- ===== TRAINABLE-SHARE BARS ===== -->
  <text x="40" y="320" font-size="13" font-weight="700" fill="#0f172a">default rank <tspan font-family="ui-monospace, Menlo, Consolas, monospace">r=16</tspan></text>
  <rect x="320" y="308" width="540" height="18" rx="5" fill="#eef0f3" stroke="#e6e9ee" stroke-width="1"/>
  <rect x="320" y="308" width="54" height="18" rx="5" fill="#e8833a"/>
  <text x="384" y="322" font-size="12.5" font-weight="800" fill="#e8833a">0.68%</text>

  <text x="40" y="360" font-size="13" font-weight="700" fill="#0f172a">higher rank (Fan)</text>
  <rect x="320" y="348" width="540" height="18" rx="5" fill="#eef0f3" stroke="#e6e9ee" stroke-width="1"/>
  <rect x="320" y="348" width="107" height="18" rx="5" fill="#e8833a"/>
  <text x="437" y="362" font-size="12.5" font-weight="800" fill="#e8833a">1.35%</text>

  <!-- payoff -->
  <text x="40" y="402" font-size="12.5" font-weight="700" fill="#6b7280">Swap a fresh adapter per machine type — the encoder is never retrained.</text>
</svg>
