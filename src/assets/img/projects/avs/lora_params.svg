<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="lp-froze" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e2e8f0" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">Adapt under 1% of an 87M-parameter transformer</text>
  <rect x="40" y="55" width="300" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="79" font-size="13" fill="#64748b">LoRA freezes the AST encoder and trains a tiny adapter per machine type.</text>

  <!-- ===== LEGEND CHIP (top-right) ===== -->
  <rect x="772" y="30" width="288" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="788" y="39" width="11" height="11" rx="2.5" fill="#cbd5e1"/><text x="804" y="48" font-size="11.5" font-weight="700" fill="#475569">frozen encoder</text>
  <rect x="916" y="39" width="11" height="11" rx="2.5" fill="#f09228"/><text x="932" y="48" font-size="11.5" font-weight="700" fill="#475569">trainable adapter</text>

  <!-- ===== PROPORTION BLOCKS (hero) ===== -->
  <!-- frozen AST encoder: large calm grey block -->
  <rect x="40" y="116" width="908" height="120" rx="10" fill="url(#lp-froze)" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="40" y="116" width="908" height="120" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="494" y="166" font-size="17" font-weight="800" fill="#475569" text-anchor="middle">AST encoder &#8212; frozen</text>
  <text x="494" y="190" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">&#8776;87M parameters, weights never updated</text>
  <text x="494" y="212" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">87.4M total</text>

  <!-- tiny ORANGE focal sliver: LoRA adapter -->
  <rect x="956" y="116" width="104" height="120" rx="10" fill="#fef3c7" stroke="#f09228" stroke-width="2.2"/>
  <text x="1008" y="150" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">LoRA</text>
  <text x="1008" y="167" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">adapter</text>
  <text x="1008" y="192" font-size="13" font-weight="800" fill="#78350f" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&#8776;0.6M</text>
  <text x="1008" y="209" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">trainable</text>
  <text x="1008" y="226" font-size="11.5" font-weight="800" fill="#78350f" text-anchor="middle">&lt;1%</text>

  <!-- callout connecting sliver to the share bar -->
  <text x="1008" y="256" font-size="11" font-style="italic" fill="#94a3b8" text-anchor="middle">589,824 weights</text>
  <text x="1008" y="272" font-size="11" font-style="italic" fill="#94a3b8" text-anchor="middle">(q / v projections)</text>

  <!-- ===== TRAINABLE-SHARE BAR ===== -->
  <text x="40" y="312" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.4">TRAINABLE SHARE OF THE MODEL</text>

  <!-- default rank row -->
  <text x="40" y="349" font-size="13" font-weight="700" fill="#0f172a">default rank <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#475569">r=16</tspan></text>
  <rect x="300" y="336" width="600" height="18" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="300" y="336" width="60" height="18" rx="5" fill="#fde68a" stroke="#f09228" stroke-width="1.6"/>
  <text x="372" y="350" font-size="12.5" font-weight="800" fill="#78350f">0.68%</text>
  <text x="920" y="350" font-size="11.5" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">589,824 trainable</text>

  <!-- higher rank row (Fan) -->
  <text x="40" y="389" font-size="13" font-weight="700" fill="#0f172a">higher rank (Fan)</text>
  <rect x="300" y="376" width="600" height="18" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="300" y="376" width="119" height="18" rx="5" fill="#fde68a" stroke="#f09228" stroke-width="1.6"/>
  <text x="431" y="390" font-size="12.5" font-weight="800" fill="#78350f">1.35%</text>
  <text x="920" y="390" font-size="11.5" fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace">1.18M trainable</text>

  <!-- payoff line -->
  <text x="40" y="424" font-size="12" font-weight="700" fill="#475569">Swap a fresh adapter per machine type &#8212; the encoder is never retrained.</text>

  <!-- ===== HONESTY FOOTER ===== -->
  <rect x="40" y="436" width="1020" height="26" rx="8" fill="#f8f9fa"/>
  <text x="56" y="453" font-size="11" font-style="italic" fill="#64748b">Base model <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-style="normal">MIT/ast-finetuned-audioset</tspan> &#183; LoRA <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-style="normal">r=16, alpha=32</tspan> on query/value projections.</text>
</svg>
