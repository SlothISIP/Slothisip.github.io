<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.4">From a mic array to a per-machine <tspan fill="#1772d0">verdict</tspan>.</text>

  <!-- ============ ACOUSTIC FRONT-END: gray hairlines converging on the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 168 C 360 168, 392 262, 424 262"/>
    <path d="M214 234 C 360 234, 392 262, 424 262"/>
    <path d="M214 300 C 360 300, 392 262, 424 262"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="168" r="3"/>
    <circle cx="210" cy="234" r="3"/>
    <circle cx="210" cy="300" r="3"/>
  </g>
  <text x="56" y="174" font-size="18" font-weight="600" fill="#6b7280">microphone array</text>
  <text x="56" y="240" font-size="18" font-weight="600" fill="#6b7280">MVDR beamforming</text>
  <text x="56" y="306" font-size="18" font-weight="600" fill="#6b7280">STFT spectrogram</text>

  <!-- outbound hairlines to the two outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 262 C 662 262, 690 214, 752 214"/>
    <path d="M576 262 C 662 262, 690 310, 752 310"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the AST + LoRA core ============ -->
  <circle cx="500" cy="262" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="262" r="76" fill="#1772d0"/>
  <text x="500" y="246" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0.2" fill="#ffffff">AST + LoRA</text>
  <text x="500" y="270" text-anchor="middle" font-size="12.5" letter-spacing="0.1" fill="#cfe2f7">87M encoder frozen</text>
  <text x="500" y="289" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.1" fill="#ffffff">0.68%-1.35% trainable</text>
  <text x="500" y="307" text-anchor="middle" font-size="10.2" letter-spacing="0.05" fill="#cfe2f7">depending on machine type</text>

  <!-- ============ TWO OUTCOMES (Anomaly is the lone orange) ============ -->
  <circle cx="754" cy="214" r="5" fill="#6b7280"/>
  <text x="772" y="220" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">Normal</text>
  <circle cx="754" cy="310" r="6" fill="#e8833a"/>
  <text x="772" y="316" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">Anomaly</text>

  <!-- ============ SECONDARY VISUAL LANE (quiet, gray): fusion localizes ============ -->
  <path d="M214 402 L 470 402" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>
  <circle cx="210" cy="402" r="3" fill="#e6e9ee"/>
  <text x="56" y="407" font-size="15" font-weight="600" fill="#6b7280">camera + YOLOv8</text>
  <text x="486" y="407" font-size="15" font-weight="600" fill="#6b7280">fusion overlay → which machine in view</text>
</svg>
