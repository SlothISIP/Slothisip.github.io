<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-purple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Acoustic Vision System (AVS) &#183; multimodal anomaly-detection pipeline</text>
  <rect x="40" y="56" width="248" height="4" rx="2" fill="#1772d0"/>
  <text x="40" y="82" font-size="13" fill="#64748b">Microphone-array beamforming + computer vision + AST/LoRA deep learning, validated on DCASE 2020 Task 2</text>

  <!-- ============ BAND 1: SENSORS ============ -->
  <rect x="40" y="104" width="1020" height="138" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="126" font-size="11" letter-spacing="1.5" fill="#64748b">SENSING HARDWARE</text>

  <!-- Microphone array -->
  <rect x="64" y="138" width="220" height="88" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="174" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Microphone Array</text>
  <text x="174" y="184" text-anchor="middle" font-size="11" fill="#475569">Default 4-channel config</text>
  <text x="174" y="201" text-anchor="middle" font-size="11" fill="#475569">Multi-channel audio</text>
  <text x="174" y="217" text-anchor="middle" font-size="10.5" fill="#64748b">Array geometric calibration</text>

  <!-- RGB camera -->
  <rect x="304" y="138" width="220" height="88" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="414" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">RGB Camera</text>
  <text x="414" y="184" text-anchor="middle" font-size="11" fill="#475569">Acoustic-visual overlay</text>
  <text x="414" y="201" text-anchor="middle" font-size="11" fill="#475569">Scene imagery</text>
  <text x="414" y="217" text-anchor="middle" font-size="10.5" fill="#64748b">Frame capture</text>

  <!-- Benchmark dataset note -->
  <rect x="700" y="138" width="336" height="88" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="868" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Benchmark Source</text>
  <text x="868" y="184" text-anchor="middle" font-size="11" fill="#475569">Open MIMII / DCASE 2020 Task 2</text>
  <text x="868" y="201" text-anchor="middle" font-size="11" fill="#475569">18,019 wav files</text>
  <text x="868" y="217" text-anchor="middle" font-size="10.5" fill="#64748b">Fan &#183; Pump &#183; Slider &#183; Valve</text>
  <line x1="524" y1="182" x2="694" y2="182" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>

  <!-- ============ BAND 2: SIGNAL PROCESSING / DSP ============ -->
  <rect x="40" y="262" width="608" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="284" font-size="11" letter-spacing="1.5" fill="#64748b">AUDIO PROCESSING &amp; DSP</text>

  <!-- Beamforming -->
  <rect x="64" y="298" width="172" height="124" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Beamforming</text>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#475569">MVDR (adaptive)</text>
  <text x="150" y="361" text-anchor="middle" font-size="10.5" fill="#64748b">Delay-and-Sum &#183; MUSIC</text>
  <text x="150" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">GCC-PHAT / TDOA</text>
  <text x="150" y="397" text-anchor="middle" font-size="10.5" fill="#64748b">Source localization</text>
  <text x="150" y="413" text-anchor="middle" font-size="10.5" fill="#64748b">Spatial null steering</text>

  <!-- Spectrogram front end -->
  <rect x="256" y="298" width="172" height="124" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="342" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Spectrogram</text>
  <text x="342" y="344" text-anchor="middle" font-size="11" fill="#475569">STFT processing</text>
  <text x="342" y="361" text-anchor="middle" font-size="10.5" fill="#64748b">Mel-spectrogram</text>
  <text x="342" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">Time-frequency features</text>
  <text x="342" y="397" text-anchor="middle" font-size="10.5" fill="#64748b">torchaudio / librosa</text>

  <!-- Vision branch -->
  <rect x="448" y="298" width="184" height="124" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Vision Branch</text>
  <text x="540" y="344" text-anchor="middle" font-size="11" fill="#475569">YOLOv8 (yolov8n)</text>
  <text x="540" y="361" text-anchor="middle" font-size="10.5" fill="#64748b">Object detection</text>
  <text x="540" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">Ultralytics</text>
  <text x="540" y="397" text-anchor="middle" font-size="10.5" fill="#64748b">Visual features</text>

  <!-- ============ BAND 3: DEEP LEARNING ============ -->
  <rect x="40" y="462" width="608" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="484" font-size="11" letter-spacing="1.5" fill="#64748b">DEEP LEARNING &amp; FUSION</text>

  <!-- AST + LoRA -->
  <rect x="64" y="498" width="266" height="130" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="197" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">AST + LoRA</text>
  <text x="197" y="544" text-anchor="middle" font-size="11" fill="#475569">Audio Spectrogram Transformer</text>
  <text x="197" y="561" text-anchor="middle" font-size="10.5" fill="#64748b">MIT ast-finetuned-audioset</text>
  <text x="197" y="578" text-anchor="middle" font-size="10.5" fill="#64748b">~87M params &#183; encoder frozen</text>
  <text x="197" y="595" text-anchor="middle" font-size="10.5" fill="#64748b">LoRA: ~0.6M trainable (&#8804; 1%)</text>
  <text x="197" y="612" text-anchor="middle" font-size="10.5" fill="#64748b">Self-attention &#183; patch embedding</text>

  <!-- Multimodal fusion -->
  <rect x="350" y="498" width="282" height="130" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="491" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Multimodal Fusion</text>
  <text x="491" y="544" text-anchor="middle" font-size="11" fill="#475569">Audio + visual features</text>
  <text x="491" y="561" text-anchor="middle" font-size="10.5" fill="#64748b">Cross-modal attention</text>
  <text x="491" y="578" text-anchor="middle" font-size="10.5" fill="#64748b">K-NN / Mahalanobis ensemble</text>
  <text x="491" y="595" text-anchor="middle" font-size="10.5" fill="#64748b">Anomaly scoring</text>
  <text x="491" y="612" text-anchor="middle" font-size="10.5" fill="#64748b">~12 ms/sample (RTX 4090, batched)</text>

  <!-- ============ RIGHT COLUMN: OUTPUT + RESULTS ============ -->
  <!-- Decision output -->
  <rect x="700" y="298" width="336" height="124" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="868" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Anomaly Decision</text>
  <rect x="730" y="344" width="120" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="790" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Normal</text>
  <text x="790" y="389" text-anchor="middle" font-size="10.5" fill="#64748b">score &#8804; threshold</text>
  <rect x="886" y="344" width="120" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="946" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Anomaly</text>
  <text x="946" y="389" text-anchor="middle" font-size="10.5" fill="#64748b">score &#8805; threshold</text>

  <!-- DCASE results -->
  <rect x="700" y="462" width="336" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="716" y="484" font-size="11" letter-spacing="1.5" fill="#64748b">DCASE 2020 TASK 2 RESULTS</text>
  <rect x="724" y="498" width="288" height="130" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="868" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Mean AUC &#8776; 0.94</text>
  <text x="868" y="546" text-anchor="middle" font-size="11" fill="#475569">vs 2020 winners mean &#8776; 0.92</text>
  <text x="868" y="568" text-anchor="middle" font-size="11" fill="#475569">Fan 0.88 &#183; Pump 0.93</text>
  <text x="868" y="585" text-anchor="middle" font-size="11" fill="#475569">Slider 0.98 &#183; Valve 0.99</text>
  <text x="868" y="608" text-anchor="middle" font-size="10.5" fill="#64748b">Exceeds winners on Pump/Slider/Valve</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- Mic -> Beamforming (down into DSP band) -->
  <path d="M174 226 L174 250 L150 250 L150 296" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <!-- Mic -> Spectrogram -->
  <path d="M204 226 L204 252 L342 252 L342 296" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <!-- Camera -> Vision branch -->
  <path d="M450 226 L450 254 L540 254 L540 296" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Beamforming -> Spectrogram (refined audio) -->
  <line x1="236" y1="360" x2="254" y2="360" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>

  <!-- Spectrogram -> AST (down into DL band) -->
  <path d="M342 422 L342 446 L197 446 L197 496" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <!-- Vision branch -> Fusion -->
  <path d="M540 422 L540 446 L491 446 L491 496" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-purple)"/>
  <!-- AST -> Fusion -->
  <line x1="330" y1="563" x2="348" y2="563" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- Fusion -> Anomaly decision (up to right column) -->
  <path d="M632 540 L666 540 L666 360 L698 360" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ah-purple)"/>
  <!-- Fusion -> DCASE results -->
  <path d="M632 590 L678 590 L678 540 L698 540" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>

  <!-- Footer tech note -->
  <text x="40" y="682" font-size="10.5" fill="#64748b">Stack: PyTorch 2.0+ &#183; torchaudio &#183; librosa &#183; AST + LoRA (PEFT) &#183; YOLOv8 &#183; ~88k LOC across 160+ files &#183; 1,036-test suite (995 passed)</text>
  <rect x="40" y="694" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="62" y="705" font-size="10.5" fill="#64748b" font-style="italic">Dashed edges denote optional / open-benchmark inputs; metrics reflect DCASE 2020 Task 2 evaluation, not a live deployment.</text>
</svg>
