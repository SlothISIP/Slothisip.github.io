<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="68" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Screen a change before it <tspan fill="#1772d0">touches the line</tspan>.</text>

  <!-- ============ THE INTERVENTION BEAT (the lone orange): do(Mold Temp = 45) ============ -->
  <rect x="64" y="186" width="276" height="108" rx="14" fill="#ffffff" stroke="#e8833a" stroke-width="2.5"/>
  <text x="202" y="232" text-anchor="middle" font-size="22" font-weight="800" fill="#e8833a" font-family="ui-monospace, Menlo, Consolas, monospace">do(</text>
  <text x="202" y="262" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Mold Temp = 45</text>
  <text x="202" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">value held fixed</text>

  <!-- ============ STRUCTURE: hairline scaffolding, "causes" ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M340 240 C 392 240, 392 240, 424 240"/>
  </g>
  <text x="382" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">causes</text>

  <!-- ============ THE ONE BLUE FOCAL: Shrinkage outcome carrying the delta ============ -->
  <circle cx="600" cy="240" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="600" cy="240" r="76" fill="#1772d0"/>
  <text x="600" y="220" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.2" fill="#ffffff">Shrinkage</text>
  <text x="600" y="252" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff" font-family="ui-monospace, Menlo, Consolas, monospace">&#8211;6.15</text>
  <text x="600" y="278" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">predicted effect (&#916;)</text>

  <!-- ============ BASELINE REFERENCE (quiet gray) ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M676 240 C 760 240, 780 372, 836 372"/>
  </g>
  <text x="730" y="386" font-size="15" font-weight="600" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">baseline &#8211;0.001</text>
</svg>
