<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="70" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Three factors multiply into one <tspan fill="#1772d0">rank</tspan>.</text>

  <!-- ============ THREE INBOUND FACTORS: gray hairlines converging on the focal ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M286 168 C 372 168, 392 250, 424 250"/>
    <path d="M286 250 C 372 250, 392 250, 424 250"/>
    <path d="M286 332 C 372 332, 392 250, 424 250"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="282" cy="168" r="3"/>
    <circle cx="282" cy="250" r="3"/>
    <circle cx="282" cy="332" r="3"/>
  </g>
  <text x="60" y="174" font-size="19" font-weight="700" fill="#6b7280">| ATE |</text>
  <text x="60" y="256" font-size="19" font-weight="700" fill="#6b7280">edge_confidence</text>
  <text x="60" y="338" font-size="19" font-weight="700" fill="#6b7280">bootstrap_stability</text>

  <!-- outbound hairlines to the two ranked outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 250 C 664 250, 690 196, 752 196"/>
    <path d="M576 250 C 664 250, 690 312, 752 312"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the composite score ============ -->
  <circle cx="500" cy="250" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="250" r="76" fill="#1772d0"/>
  <text x="500" y="244" text-anchor="middle" font-size="29" font-weight="800" letter-spacing="0.3" fill="#ffffff">score</text>
  <text x="500" y="274" text-anchor="middle" font-size="15" letter-spacing="0.2" fill="#cfe2f7">composite rank</text>

  <!-- ============ TWO RANKED OUTCOMES (Cooling Time winner = lone orange) ============ -->
  <circle cx="754" cy="196" r="6" fill="#e8833a"/>
  <text x="772" y="190" font-size="20" font-weight="700" fill="#e8833a" letter-spacing="0.3">Cooling Time</text>
  <text x="772" y="214" font-size="22" font-weight="800" fill="#e8833a">0.62</text>

  <circle cx="754" cy="312" r="5" fill="#6b7280"/>
  <text x="772" y="306" font-size="20" font-weight="600" fill="#6b7280" letter-spacing="0.3">Mold Temp</text>
  <text x="772" y="330" font-size="22" font-weight="800" fill="#6b7280">0.29</text>
</svg>
