    <text x="704" y="186" font-size="11" fill="#64748b">4-stage lifecycle</text>

    <rect x="692" y="214" width="164" height="58" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="704" y="238" font-size="13.5" font-weight="600" fill="#5b21b6">Drift Detection</text>
    <text x="704" y="258" font-size="11" fill="#64748b">KS &#183; PSI &#183; ATE drift</text>

    <rect x="692" y="286" width="164" height="58" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="704" y="310" font-size="13.5" font-weight="600" fill="#5b21b6">Auth &#183; RBAC &#183; Audit</text>
    <text x="704" y="330" font-size="11" fill="#64748b">API key &#183; JSONL log</text>

    <rect x="692" y="358" width="164" height="58" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
