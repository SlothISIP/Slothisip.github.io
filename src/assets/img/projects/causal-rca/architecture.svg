    <rect x="268" y="214" width="164" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="280" y="238" font-size="13.5" font-weight="600" fill="#1e3a8a">Ensemble Voting</text>
    <text x="280" y="258" font-size="11" fill="#64748b">weighted consensus</text>

    <rect x="268" y="286" width="164" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
