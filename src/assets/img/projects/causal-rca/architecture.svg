<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="23" font-weight="700" fill="#0f172a">Causal RCA Platform &#183; System Architecture</text>
  <rect x="40" y="58" width="234" height="3" rx="1.5" fill="#1772d0"/>
  <text x="40" y="82" font-size="13" fill="#64748b">Ensemble causal discovery &#8594; DoWhy ATE inference &#8594; composite root-cause ranking, served end to end</text>

  <!-- ===================== SECTION BANDS ===================== -->
