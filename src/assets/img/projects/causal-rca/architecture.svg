    <text x="916" y="186" font-size="11" fill="#64748b">45+ endpoints &#183; SSE</text>

    <rect x="904" y="214" width="140" height="58" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="916" y="238" font-size="13.5" font-weight="600" fill="#0f172a">React SPA</text>
    <text x="916" y="258" font-size="11" fill="#64748b">D3.js causal graph</text>

    <rect x="904" y="286" width="140" height="58" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="916" y="310" font-size="13.5" font-weight="600" fill="#0f172a">Streamlit</text>
    <text x="916" y="330" font-size="11" fill="#64748b">ops dashboard</text>

    <rect x="904" y="358" width="140" height="58" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
