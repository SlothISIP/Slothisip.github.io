  <text x="482" y="126" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">INFERENCE &amp; RCA</text>
  <!-- MLOps -->
  <rect x="676" y="104" width="196" height="476" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="694" y="126" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">MLOPS / ENTERPRISE</text>
