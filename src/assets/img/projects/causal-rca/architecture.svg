<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Five stages converge on one <tspan fill="#1772d0">root cause</tspan>.</text>

  <!-- ============ FIVE PIPELINE STAGES: gray hairlines converging on the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M236 150 C 360 150, 392 264, 424 264"/>
    <path d="M236 207 C 360 207, 392 264, 424 264"/>
    <path d="M236 264 C 392 264, 392 264, 424 264"/>
    <path d="M236 321 C 360 321, 392 264, 424 264"/>
    <path d="M236 378 C 360 378, 392 264, 424 264"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="232" cy="150" r="3"/>
    <circle cx="232" cy="207" r="3"/>
    <circle cx="232" cy="264" r="3"/>
    <circle cx="232" cy="321" r="3"/>
    <circle cx="232" cy="378" r="3"/>
  </g>
  <text x="56" y="156" font-size="18" font-weight="600" fill="#6b7280">Data layer</text>
  <text x="56" y="213" font-size="18" font-weight="600" fill="#6b7280">Causal discovery</text>
  <text x="56" y="270" font-size="18" font-weight="600" fill="#6b7280">Inference &amp; RCA</text>
  <text x="56" y="327" font-size="18" font-weight="600" fill="#6b7280">MLOps / enterprise</text>
  <text x="56" y="384" font-size="18" font-weight="600" fill="#6b7280">Delivery</text>

  <!-- outbound hairline to the outcome -->
  <path d="M576 264 C 668 264, 700 264, 760 264" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>

  <!-- ============ THE ONE BLUE FOCAL: the ensemble / RCA core ============ -->
  <circle cx="500" cy="264" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="264" r="76" fill="#1772d0"/>
  <text x="500" y="252" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.2" fill="#ffffff">Ensemble</text>
  <text x="500" y="280" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.2" fill="#ffffff">+ DoWhy ATE</text>

  <!-- ============ ONE ORANGE BEAT: the weighted-consensus vote ============ -->
  <circle cx="500" cy="160" r="6" fill="#e8833a"/>
  <text x="500" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#e8833a">Ensemble Voting · weighted consensus</text>

  <!-- ============ OUTCOME ============ -->
  <circle cx="762" cy="264" r="5" fill="#6b7280"/>
  <text x="780" y="270" font-size="19" font-weight="700" fill="#6b7280" letter-spacing="0.3">RCA ranking</text>
  <text x="780" y="292" font-size="14" fill="#6b7280">|ATE| × conf × stability</text>
</svg>
