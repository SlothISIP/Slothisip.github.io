    <text x="492" y="186" font-size="11" fill="#64748b">estimation + refutation</text>

    <rect x="480" y="214" width="164" height="58" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="492" y="238" font-size="13.5" font-weight="600" fill="#78350f">Intervention Simulator</text>
    <text x="492" y="258" font-size="11" fill="#64748b">what-if &#183; sweeps &#183; do-calc</text>

