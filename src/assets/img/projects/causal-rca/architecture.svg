  <rect x="40" y="104" width="196" height="476" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="126" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">DATA LAYER</text>
  <!-- Discovery -->
  <rect x="252" y="104" width="196" height="476" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="270" y="126" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">CAUSAL DISCOVERY</text>
  <!-- Inference / RCA -->
