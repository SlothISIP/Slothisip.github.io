<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/>
    </marker>
    <style>
      .layer { fill:#161b22; stroke:#30363d; stroke-width:1; }
      .title { fill:#79c0ff; font-size:14px; font-weight:600; letter-spacing:.5px; }
      .box   { fill:#21262d; stroke:#30363d; stroke-width:1; rx:6; ry:6; }
      .boxT  { fill:#e6edf3; font-size:13px; }
      .boxS  { fill:#8b949e; font-size:11px; }
      .flow  { stroke:#79c0ff; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#0d1117"/>

  <!-- Layer 1: Data -->
  <rect class="layer" x="30"  y="40" width="200" height="440"/>
  <text class="title" x="50" y="70">DATA LAYER</text>
  <rect class="box" x="50"  y="90"  width="160" height="50"/>
  <text class="boxT" x="70" y="110">Connectors</text>
  <text class="boxS" x="70" y="128">CSV . DB . OPC-UA . MQTT</text>
  <rect class="box" x="50"  y="160" width="160" height="50"/>
  <text class="boxT" x="70" y="180">ETL Pipeline</text>
  <text class="boxS" x="70" y="198">schema . validate . preprocess</text>
  <rect class="box" x="50"  y="230" width="160" height="50"/>
  <text class="boxT" x="70" y="250">Data Registry</text>
  <text class="boxS" x="70" y="268">versioned datasets . quality</text>
  <rect class="box" x="50"  y="310" width="160" height="50"/>
  <text class="boxT" x="70" y="330">Synthetic DGP</text>
  <text class="boxS" x="70" y="348">12 vars . 13 edges . 3 tiers</text>

  <!-- Layer 2: Discovery -->
  <rect class="layer" x="260" y="40" width="220" height="440"/>
  <text class="title" x="280" y="70">CAUSAL DISCOVERY</text>
  <rect class="box" x="280" y="90"  width="180" height="50"/>
  <text class="boxT" x="300" y="110">PC . GES . NOTEARS . FCI</text>
  <text class="boxS" x="300" y="128">causal-learn + custom NOTEARS</text>
  <rect class="box" x="280" y="160" width="180" height="50"/>
  <text class="boxT" x="300" y="180">Ensemble Voting</text>
  <text class="boxS" x="300" y="198">weighted consensus</text>
  <rect class="box" x="280" y="230" width="180" height="50"/>
  <text class="boxT" x="300" y="250">Bootstrap Stability</text>
  <text class="boxS" x="300" y="268">joblib parallel . edge CI</text>
  <rect class="box" x="280" y="310" width="180" height="50"/>
  <text class="boxT" x="300" y="330">Temporal / Dynamic</text>
  <text class="boxS" x="300" y="348">Granger . regime detection</text>

  <!-- Layer 3: Inference + RCA -->
  <rect class="layer" x="510" y="40" width="240" height="440"/>
  <text class="title" x="530" y="70">INFERENCE &amp; RCA</text>
  <rect class="box" x="530" y="90"  width="200" height="50"/>
  <text class="boxT" x="550" y="110">DoWhy ATE</text>
  <text class="boxS" x="550" y="128">estimation + refutation</text>
  <rect class="box" x="530" y="160" width="200" height="50"/>
  <text class="boxT" x="550" y="180">Intervention Simulator</text>
  <text class="boxS" x="550" y="198">what-if . sweeps . optimization</text>
  <rect class="box" x="530" y="230" width="200" height="50"/>
  <text class="boxT" x="550" y="250">RCA Ranking</text>
  <text class="boxS" x="550" y="268">|ATE| x confidence x stability</text>
  <rect class="box" x="530" y="310" width="200" height="50"/>
  <text class="boxT" x="550" y="330">Advanced RCA</text>
  <text class="boxS" x="550" y="348">mediation . multi-hop . CF</text>

  <!-- Layer 4: MLOps + Enterprise -->
  <rect class="layer" x="780" y="40" width="180" height="440"/>
  <text class="title" x="800" y="70">MLOPS / ENTERPRISE</text>
  <rect class="box" x="800" y="90"  width="140" height="50"/>
  <text class="boxT" x="820" y="110">Model Registry</text>
  <text class="boxS" x="820" y="128">stage lifecycle</text>
  <rect class="box" x="800" y="160" width="140" height="50"/>
  <text class="boxT" x="820" y="180">Drift Detection</text>
  <text class="boxS" x="820" y="198">KS . PSI . ATE drift</text>
  <rect class="box" x="800" y="230" width="140" height="50"/>
  <text class="boxT" x="820" y="250">Auth . RBAC . Audit</text>
  <text class="boxS" x="820" y="268">API key . JSONL</text>
  <rect class="box" x="800" y="310" width="140" height="50"/>
  <text class="boxT" x="820" y="330">Prometheus . Grafana</text>
  <text class="boxS" x="820" y="348">metrics . dashboards</text>

  <!-- Layer 5: Delivery -->
  <rect class="layer" x="990" y="40" width="180" height="440"/>
  <text class="title" x="1010" y="70">DELIVERY</text>
  <rect class="box" x="1010" y="90"  width="140" height="50"/>
  <text class="boxT" x="1030" y="110">FastAPI</text>
  <text class="boxS" x="1030" y="128">45+ endpoints . SSE</text>
  <rect class="box" x="1010" y="160" width="140" height="50"/>
  <text class="boxT" x="1030" y="180">React SPA</text>
  <text class="boxS" x="1030" y="198">D3.js causal graph</text>
  <rect class="box" x="1010" y="230" width="140" height="50"/>
  <text class="boxT" x="1030" y="250">Streamlit</text>
  <text class="boxS" x="1030" y="268">operational dashboard</text>
  <rect class="box" x="1010" y="310" width="140" height="50"/>
  <text class="boxT" x="1030" y="330">Neo4j . Ollama</text>
  <text class="boxS" x="1030" y="348">lineage . LLM chat</text>

  <!-- Arrows between layers (center horizontal flow) -->
  <line class="flow" x1="230" y1="260" x2="260" y2="260" marker-end="url(#arrow)"/>
  <line class="flow" x1="480" y1="260" x2="510" y2="260" marker-end="url(#arrow)"/>
  <line class="flow" x1="750" y1="260" x2="780" y2="260" marker-end="url(#arrow)"/>
  <line class="flow" x1="960" y1="260" x2="990" y2="260" marker-end="url(#arrow)"/>
</svg>
