  <!-- ===================== HORIZONTAL FLOW ARROWS (between layers) ===================== -->
  <line x1="236" y1="313" x2="266" y2="313" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="448" y1="313" x2="478" y2="313" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="660" y1="313" x2="690" y2="313" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="872" y1="313" x2="902" y2="313" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== ORCHESTRATION BAND ===================== -->
  <rect x="40" y="606" width="1020" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="628" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">PHASE-BASED ORCHESTRATION</text>
  <text x="58" y="652" font-size="12.5" fill="#475569">9 phase orchestrators sharing a common base class &#8212; ingestion &#8594; discovery &#8594; inference &#8594; RCA &#8594; delivery</text>
  <text x="58" y="674" font-size="11.5" fill="#64748b">Multi-process registry: injection_molding &#183; extrusion &#183; cnc_machining &#160;&#160;|&#160;&#160; 700+ tests &#183; Docker Compose &#183; GitHub Actions CI/CD</text>

  <!-- dashed link: orchestration drives all layers -->
  <line x1="318" y1="580" x2="318" y2="606" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arr)"/>
  <line x1="780" y1="580" x2="780" y2="606" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arr)"/>
