    <text x="68" y="186" font-size="11" fill="#64748b">CSV &#183; DB &#183; OPC-UA &#183; MQTT</text>

    <rect x="56" y="214" width="164" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="68" y="238" font-size="13.5" font-weight="600" fill="#065f46">ETL Pipeline</text>
    <text x="68" y="258" font-size="11" fill="#64748b">schema &#183; validate &#183; prep</text>

    <rect x="56" y="286" width="164" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="68" y="310" font-size="13.5" font-weight="600" fill="#065f46">Data Registry</text>
    <text x="68" y="330" font-size="11" fill="#64748b">versioned sets &#183; quality</text>

