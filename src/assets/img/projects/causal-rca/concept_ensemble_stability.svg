<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="ar-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="ar-g" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="28" y="40" font-size="23" font-weight="700" fill="#0f172a">Ensemble discovery + edge stability</text>
  <rect x="28" y="50" width="262" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="28" y="74" font-size="13" fill="#64748b">No single discovery algorithm is trusted alone &#8212; consensus and bootstrap stability decide which edges survive.</text>

  <!-- ============ STAGE 1: four discovery algorithms ============ -->
  <text x="28" y="112" font-size="12" font-weight="700" fill="#64748b" letter-spacing=".06em">DISCOVER (PARALLEL)</text>

  <g>
    <rect x="28" y="124" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="103" y="143" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">PC</text>
    <text x="103" y="157" font-size="10.5" fill="#64748b" text-anchor="middle">constraint-based</text>
  </g>
  <g>
    <rect x="28" y="172" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="103" y="191" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">GES</text>
    <text x="103" y="205" font-size="10.5" fill="#64748b" text-anchor="middle">score-based</text>
  </g>
  <g>
    <rect x="28" y="220" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="103" y="239" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">FCI</text>
    <text x="103" y="253" font-size="10.5" fill="#64748b" text-anchor="middle">causal-learn</text>
  </g>
  <g>
    <rect x="28" y="268" width="150" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="103" y="287" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">NOTEARS</text>
    <text x="103" y="301" font-size="10.5" fill="#64748b" text-anchor="middle">custom, gradient</text>
  </g>

  <!-- edges algos -> ensemble -->
  <path d="M178,144 C212,144 218,200 244,210" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M178,192 C212,192 220,205 244,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M178,240 C212,240 220,222 244,219" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M178,288 C212,288 218,232 244,222" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ============ STAGE 2: weighted ensemble voting ============ -->
  <rect x="246" y="170" width="158" height="92" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="195" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Weighted</text>
  <text x="325" y="211" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">ensemble voting</text>
  <text x="325" y="232" font-size="11" fill="#1e3a8a" text-anchor="middle">per-edge</text>
  <text x="325" y="247" font-size="11" fill="#1e3a8a" text-anchor="middle">confidence score</text>

  <path d="M404,216 H432" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/>

  <!-- ============ STAGE 3: bootstrap edge stability ============ -->
  <rect x="434" y="170" width="158" height="92" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="513" y="195" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Bootstrap</text>
  <text x="513" y="211" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">edge stability</text>
  <text x="513" y="232" font-size="11" fill="#065f46" text-anchor="middle">resample &#8594; % of runs</text>
  <text x="513" y="247" font-size="11" fill="#065f46" text-anchor="middle">edge reappears (joblib)</text>

  <path d="M592,216 H620" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar-amber)"/>

  <!-- ============ STAGE 4: deterministic gate (amber) ============ -->
  <rect x="622" y="158" width="186" height="116" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="715" y="182" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle" letter-spacing=".05em">DETERMINISTIC GATE</text>
  <line x1="640" y1="192" x2="790" y2="192" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="715" y="213" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">keep edge if</text>
  <text x="715" y="233" font-size="12.5" fill="#78350f" text-anchor="middle">confidence &#8805; 0.5</text>
  <text x="715" y="251" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">AND</text>
  <text x="715" y="269" font-size="12.5" fill="#78350f" text-anchor="middle">stability &#8805; 0.6</text>

  <path d="M808,216 H838" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ============ STAGE 5: final learned DAG ============ -->
  <rect x="840" y="120" width="232" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="956" y="143" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Learned DAG</text>
  <text x="956" y="159" font-size="11" fill="#64748b" text-anchor="middle">12 nodes &#183; 7 edges</text>

  <!-- DAG edges (drawn before nodes) -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none">
    <!-- params -> intermediate -->
    <path d="M896,210 C896,236 920,244 925,256" marker-end="url(#ar-g)"/>
    <path d="M896,210 C912,236 980,246 990,256" marker-end="url(#ar-g)"/>
    <path d="M1016,210 C1016,236 1000,246 996,256" marker-end="url(#ar-g)"/>
    <!-- intermediate -> outcome -->
    <path d="M925,290 C925,316 945,326 950,338" marker-end="url(#ar-g)"/>
    <path d="M990,290 C990,316 975,326 970,338" marker-end="url(#ar-g)"/>
    <!-- param -> outcome (direct, e.g. cooling_time->shrinkage) -->
    <path d="M1016,210 C1040,260 1010,320 980,340" marker-end="url(#ar-g)"/>
    <!-- second param->intermediate -->
    <path d="M896,210 C880,250 905,250 915,256" marker-end="url(#ar-g)"/>
  </g>

  <!-- Tier label: process parameters (orange) -->
  <text x="956" y="190" font-size="9.5" fill="#9a3412" text-anchor="middle" font-weight="700" letter-spacing=".04em">PROCESS PARAMETERS</text>
  <g>
    <circle cx="896" cy="202" r="11" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="956" cy="202" r="11" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="1016" cy="202" r="11" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  </g>

  <!-- Tier label: intermediate states (blue) -->
  <text x="956" y="244" font-size="9.5" fill="#1e3a8a" text-anchor="middle" font-weight="700" letter-spacing=".04em">INTERMEDIATE STATES</text>
  <g>
    <circle cx="925" cy="268" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="990" cy="268" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Tier label: outcomes (red) -->
  <text x="956" y="328" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700" letter-spacing=".04em">OUTCOMES (DEFECTS)</text>
  <g>
    <circle cx="950" cy="350" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="970" cy="350" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  </g>

  <!-- legend inside DAG -->
  <line x1="864" y1="378" x2="1048" y2="378" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="872" cy="394" r="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <text x="882" y="398" font-size="10" fill="#475569">params</text>
  <circle cx="932" cy="394" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="942" y="398" font-size="10" fill="#475569">intermediate</text>
  <circle cx="1018" cy="394" r="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="1028" y="398" font-size="10" fill="#475569">outcome</text>

  <!-- emphasized "ensemble" idea brand marker on the gate-output edge node -->
  <!-- Bottom message band -->
  <rect x="28" y="468" width="1044" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="58" cy="500" r="13" fill="#fff7ed" stroke="#f09228" stroke-width="2"/>
  <text x="58" y="505" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">!</text>
  <text x="84" y="494" font-size="13.5" font-weight="700" fill="#0f172a">No single discovery algorithm is trusted alone.</text>
  <text x="84" y="514" font-size="12" fill="#475569">Four methods vote, bootstrap measures how reliably each edge reappears, and only edges clearing both the confidence and stability thresholds reach the final DAG.</text>

  <!-- caption for stage row labels -->
  <text x="325" y="290" font-size="10.5" fill="#64748b" text-anchor="middle">aggregate</text>
  <text x="513" y="290" font-size="10.5" fill="#64748b" text-anchor="middle">measure reliability</text>
  <text x="715" y="292" font-size="10.5" fill="#64748b" text-anchor="middle">filter (min_conf 0.5 / min_stab 0.6)</text>
</svg>
