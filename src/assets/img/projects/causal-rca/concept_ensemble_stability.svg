<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="74" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.4">No single algorithm decides the <tspan fill="#1772d0">edge</tspan>.</text>

  <!-- ============ FOUR DISCOVERY ALGORITHMS: gray hairlines converging ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 170 C 360 170, 392 256, 424 256"/>
    <path d="M214 222 C 360 222, 392 256, 424 256"/>
    <path d="M214 290 C 360 290, 392 256, 424 256"/>
    <path d="M214 342 C 360 342, 392 256, 424 256"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="170" r="3"/>
    <circle cx="210" cy="222" r="3"/>
    <circle cx="210" cy="290" r="3"/>
    <circle cx="210" cy="342" r="3"/>
  </g>
  <text x="56" y="176" font-size="18" font-weight="600" fill="#6b7280">PC</text>
  <text x="56" y="228" font-size="18" font-weight="600" fill="#6b7280">GES</text>
  <text x="56" y="296" font-size="18" font-weight="600" fill="#6b7280">FCI</text>
  <text x="56" y="348" font-size="18" font-weight="600" fill="#6b7280">NOTEARS</text>

  <!-- outbound hairline to the outcome -->
  <path d="M576 256 C 668 256, 700 256, 760 256" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>

  <!-- ============ THE ONE BLUE FOCAL: the deterministic gate ============ -->
  <circle cx="500" cy="256" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="256" r="76" fill="#1772d0"/>
  <text x="500" y="234" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.3" fill="#ffffff">keep edge if</text>
  <text x="500" y="262" text-anchor="middle" font-size="16" fill="#cfe2f7">conf &#8805; 0.5</text>
  <text x="500" y="288" text-anchor="middle" font-size="16" fill="#cfe2f7">&amp; stab &#8805; 0.6</text>

  <!-- ============ THE OUTCOME (gray): surviving DAG ============ -->
  <circle cx="762" cy="256" r="6" fill="#6b7280"/>
  <text x="784" y="252" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="0.2">Learned DAG</text>
  <text x="784" y="278" font-size="17" font-weight="600" fill="#6b7280">12 nodes &#183; 7 edges</text>
</svg>
