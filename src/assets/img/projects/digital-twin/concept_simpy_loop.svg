<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="dt-ahm" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b4bec9"/></marker>
    <marker id="dt-ahl" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
    <pattern id="dt-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fde6cd"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f09228" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="480" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">See downtime before it happens</text>
  <rect x="40" y="55" width="258" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="79" font-size="13" fill="#64748b">SimPy pops timestamped events in time order &#8212; a machine&#8217;s state is what you read off the clock.</text>

  <!-- ===== STATE LEGEND CHIP (top-right) ===== -->
  <rect x="742" y="30" width="318" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="758" y="39" width="11" height="11" rx="2.5" fill="#f59e0b"/><text x="774" y="48" font-size="11.5" font-weight="700" fill="#475569">idle</text>
  <rect x="812" y="39" width="11" height="11" rx="2.5" fill="#16a34a"/><text x="828" y="48" font-size="11.5" font-weight="700" fill="#475569">running</text>
  <rect x="890" y="39" width="11" height="11" rx="2.5" fill="#dc2626"/><text x="906" y="48" font-size="11.5" font-weight="700" fill="#475569">breakdown</text>
  <rect x="988" y="39" width="11" height="11" rx="2.5" fill="#1772d0"/><text x="1004" y="48" font-size="11.5" font-weight="700" fill="#475569">repair</text>

  <!-- ===== EVENT LANE ===== -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="150" y="116">job_arrive</text>
    <text x="290" y="116">job_done</text>
    <text x="560" y="116">breakdown</text>
    <text x="880" y="116">repair_end</text>
  </g>
  <line x1="90" y1="136" x2="1016" y2="136" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#dt-ahl)"/>
  <text x="1022" y="140" font-size="10.5" fill="#94a3b8">time</text>
  <polygon points="150,130 156,136 150,142 144,136" fill="#93b4d8" stroke="#ffffff"/>
  <polygon points="290,130 296,136 290,142 284,136" fill="#9aa3ab" stroke="#ffffff"/>
  <polygon points="560,130 566,136 560,142 554,136" fill="#d8a0a0" stroke="#ffffff"/>
  <polygon points="880,130 886,136 880,142 874,136" fill="#9ec7ad" stroke="#ffffff"/>
  <g font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">
    <text x="150" y="157">12.4</text><text x="290" y="157">15.0</text><text x="560" y="157">18.7</text><text x="880" y="157">23.1</text>
  </g>
  <line x1="150" y1="143" x2="150" y2="176" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="290" y1="143" x2="290" y2="176" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="143" x2="560" y2="176" stroke="#e0a96a" stroke-width="1.4"/>
  <line x1="880" y1="143" x2="880" y2="176" stroke="#e0a96a" stroke-width="1.4"/>

  <!-- ===== STATE STRIP (hero) y 176..266 ===== -->
  <rect x="90" y="176" width="60" height="90" fill="#fde68a"/>
  <rect x="150" y="176" width="410" height="90" fill="#bbf7d0"/>
  <line x1="150" y1="177" x2="560" y2="177" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="290" y1="180" x2="290" y2="262" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 3"/>
  <rect x="560" y="176" width="320" height="90" fill="url(#dt-hatch)"/>
  <line x1="560" y1="176" x2="560" y2="266" stroke="#f09228" stroke-width="2"/>
  <line x1="880" y1="176" x2="880" y2="266" stroke="#f09228" stroke-width="2"/>
  <rect x="880" y="176" width="130" height="90" fill="#fde68a"/>
  <rect x="90" y="176" width="920" height="90" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="352" y="227" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">running</text>
  <text x="945" y="227" font-size="11.5" font-weight="700" fill="#a16207" text-anchor="middle">idle</text>
  <text x="720" y="218" font-size="21" font-weight="800" fill="#b45309" text-anchor="middle">&#916;t = 4.4</text>
  <text x="720" y="239" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing=".5">downtime</text>

  <!-- ===== THROUGHPUT RIBBON (faint, pinches under gap) ===== -->
  <text x="86" y="304" font-size="11" fill="#94a3b8" text-anchor="end">throughput</text>
  <path d="M 100 290 L 515 290 L 560 303 L 880 303 L 925 290 L 1010 290 L 1010 322 L 925 322 L 880 309 L 560 309 L 515 322 L 100 322 Z" fill="#cbd5e1" opacity="0.5"/>

  <!-- ===== OUTCOME LINE (payoff) ===== -->
  <text x="720" y="345" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">measure downtime &#8594; find the bottleneck</text>

  <!-- ===== FEEDBACK ARC (one subtle loop back to the event lane) ===== -->
  <path d="M 735 326 C 540 392, 270 384, 108 180" fill="none" stroke="#c2cbd4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dt-ahm)"/>
  <text x="430" y="382" font-size="10.5" font-style="italic" fill="#94a3b8" text-anchor="middle">physics ROM tunes how often faults fire</text>

  <!-- ===== HONESTY FOOTER ===== -->
  <rect x="40" y="436" width="1020" height="30" rx="8" fill="#f8f9fa"/>
  <text x="56" y="455" font-size="11" font-style="italic" fill="#64748b">Validated on open benchmarks + 6 synthetic scenarios &#8212; not a live production line &#183; ~5,700 LOC <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-style="normal">src/digital_twin/</tspan></text>
</svg>
