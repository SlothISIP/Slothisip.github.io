<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="dt-ah" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
    <pattern id="dt-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e8833a" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <!-- ===== HEADLINE (one blue word) ===== -->
  <text x="40" y="58" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-.4">See <tspan fill="#1772d0">downtime</tspan> before it happens.</text>

  <!-- ===== EVENT LANE (gray hairline timeline) ===== -->
  <line x1="80" y1="150" x2="888" y2="150" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#dt-ah)"/>
  <text x="900" y="155" font-size="14" font-weight="600" fill="#6b7280">time</text>

  <!-- event ticks -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="150" y1="156" x2="150" y2="196"/>
    <line x1="320" y1="156" x2="320" y2="196"/>
  </g>
  <g stroke="#e8833a" stroke-width="1.4">
    <line x1="500" y1="156" x2="500" y2="196"/>
    <line x1="800" y1="156" x2="800" y2="196"/>
  </g>
  <g fill="#6b7280">
    <circle cx="150" cy="150" r="4"/>
    <circle cx="320" cy="150" r="4"/>
  </g>
  <g fill="#e8833a">
    <circle cx="500" cy="150" r="4"/>
    <circle cx="800" cy="150" r="4"/>
  </g>

  <!-- event labels (name + timestamp) -->
  <g text-anchor="middle">
    <text x="150" y="132" font-size="15" font-weight="600" fill="#6b7280">job_arrive · 12.4</text>
    <text x="320" y="132" font-size="15" font-weight="600" fill="#6b7280">job_done · 15.0</text>
    <text x="500" y="132" font-size="15" font-weight="700" fill="#e8833a">breakdown · 18.7</text>
    <text x="800" y="132" font-size="15" font-weight="700" fill="#e8833a">repair_end · 23.1</text>
  </g>

  <!-- ===== STATE STRIP (hero band) y 196..286 ===== -->
  <!-- running (blue focal context) -->
  <rect x="150" y="196" width="350" height="90" fill="#cfe2f7"/>
  <line x1="150" y1="197" x2="500" y2="197" stroke="#1772d0" stroke-width="2.5"/>
  <!-- the ONE orange downtime gap (focal) -->
  <rect x="500" y="196" width="300" height="90" fill="url(#dt-hatch)"/>
  <line x1="500" y1="196" x2="500" y2="286" stroke="#e8833a" stroke-width="2.2"/>
  <line x1="800" y1="196" x2="800" y2="286" stroke="#e8833a" stroke-width="2.2"/>
  <!-- idle tails (neutral) -->
  <rect x="80" y="196" width="70" height="90" fill="#eef0f3"/>
  <rect x="800" y="196" width="80" height="90" fill="#eef0f3"/>
  <rect x="80" y="196" width="800" height="90" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="325" y="247" font-size="14" font-weight="800" fill="#1772d0" text-anchor="middle">running</text>
  <text x="840" y="247" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">idle</text>
  <text x="650" y="237" font-size="24" font-weight="800" fill="#e8833a" text-anchor="middle">&#916;t = 4.4</text>
  <text x="650" y="259" font-size="13" font-weight="700" fill="#e8833a" text-anchor="middle" letter-spacing=".5">downtime</text>

  <!-- ===== THROUGHPUT RIBBON (faint, pinches under the gap) ===== -->
  <text x="76" y="330" font-size="13" fill="#6b7280" text-anchor="end">throughput</text>
  <path d="M 90 318 L 455 318 L 500 333 L 800 333 L 845 318 L 880 318 L 880 350 L 845 350 L 800 335 L 500 335 L 455 350 L 90 350 Z" fill="#cbd5e1" opacity="0.5"/>

  <!-- ===== OUTCOME LINE (payoff) ===== -->
  <text x="480" y="392" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">measure downtime &#8594; find the bottleneck</text>
</svg>
