<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ah-mute" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title block -->
  <text x="40" y="44" font-size="23" font-weight="700" fill="#0f172a">SimPy discrete-event loop</text>
  <rect x="40" y="54" width="232" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="78" font-size="13" fill="#64748b">Timestamped events drive machine state and job flow &#8212; enabling what-if analysis and bottleneck identification</text>

  <!-- ============ EVENT QUEUE ============ -->
  <rect x="40" y="110" width="252" height="270" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="135" font-size="14" font-weight="700" fill="#0f172a">Event queue</text>
  <text x="56" y="153" font-size="11.5" fill="#64748b">timestamped events, processed in order</text>

  <!-- queued event rows -->
  <g font-size="11.5">
    <rect x="56" y="166" width="220" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="68" y="185" font-weight="700" fill="#1e3a8a">t=12.4</text>
    <text x="132" y="185" fill="#1e3a8a">job_arrive</text>

    <rect x="56" y="202" width="220" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="68" y="221" font-weight="700" fill="#78350f">t=15.0</text>
    <text x="132" y="221" fill="#78350f">job_done</text>

    <rect x="56" y="238" width="220" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="68" y="257" font-weight="700" fill="#991b1b">t=18.7</text>
    <text x="132" y="257" fill="#991b1b">breakdown</text>

    <rect x="56" y="274" width="220" height="30" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="68" y="293" font-weight="700" fill="#065f46">t=23.1</text>
    <text x="132" y="293" fill="#065f46">repair_end</text>

    <rect x="56" y="310" width="220" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="68" y="329" font-weight="700" fill="#475569">t=27.5</text>
    <text x="132" y="329" fill="#475569">job_arrive</text>
  </g>
  <text x="56" y="362" font-size="11" fill="#94a3b8">advance simulation clock &#8594; pop next event</text>

  <!-- ============ STATE MACHINE ============ -->
  <rect x="332" y="110" width="430" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="135" font-size="14" font-weight="700" fill="#0f172a">Machine state machine</text>
  <text x="350" y="153" font-size="11.5" fill="#64748b">events trigger labeled state transitions</text>

  <!-- state nodes -->
  <!-- idle -->
  <rect x="360" y="180" width="120" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="201" font-size="13.5" font-weight="700" fill="#78350f" text-anchor="middle">idle</text>
  <text x="420" y="217" font-size="10.5" fill="#92400e" text-anchor="middle">waiting for job</text>

  <!-- running (emphasized: this node is what the figure is about) -->
  <rect x="612" y="180" width="120" height="48" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="672" y="201" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">running</text>
  <text x="672" y="217" font-size="10.5" fill="#047857" text-anchor="middle">processing job</text>

  <!-- breakdown -->
  <rect x="612" y="296" width="120" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="672" y="317" font-size="13.5" font-weight="700" fill="#991b1b" text-anchor="middle">breakdown</text>
  <text x="672" y="333" font-size="10.5" fill="#b91c1c" text-anchor="middle">stochastic fault</text>

  <!-- repair -->
  <rect x="360" y="296" width="120" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="317" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">repair</text>
  <text x="420" y="333" font-size="10.5" fill="#1d4ed8" text-anchor="middle">downtime</text>

  <!-- transitions -->
  <!-- idle -> running -->
  <line x1="480" y1="198" x2="606" y2="198" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="543" y="190" font-size="10.5" fill="#475569" text-anchor="middle">job_arrive</text>

  <!-- running -> idle (return top) -->
  <line x1="606" y1="214" x2="480" y2="214" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="543" y="230" font-size="10.5" fill="#475569" text-anchor="middle">job_done</text>

  <!-- running -> breakdown -->
  <line x1="672" y1="228" x2="672" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <text x="725" y="263" font-size="10.5" fill="#991b1b" text-anchor="middle">fault</text>

  <!-- breakdown -> repair -->
  <line x1="612" y1="320" x2="486" y2="320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <text x="549" y="312" font-size="10.5" fill="#1e3a8a" text-anchor="middle">start_repair</text>

  <!-- repair -> idle -->
  <line x1="420" y1="296" x2="420" y2="234" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="377" y="267" font-size="10.5" fill="#78350f" text-anchor="middle">repaired</text>

  <!-- ============ JOB FLOW LINE ============ -->
  <rect x="332" y="410" width="430" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="434" font-size="14" font-weight="700" fill="#0f172a">Job flow &#8212; line queues</text>

  <!-- queue 1 -->
  <rect x="352" y="452" width="92" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="398" y="471" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">queue A</text>
  <text x="398" y="487" font-size="10.5" fill="#64748b" text-anchor="middle">WIP buffer</text>

  <!-- bottleneck tap (emphasized node, brand orange) -->
  <rect x="504" y="452" width="104" height="44" rx="6" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="556" y="470" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">bottleneck</text>
  <text x="556" y="486" font-size="10.5" fill="#92400e" text-anchor="middle">tap / station</text>

  <!-- queue 2 -->
  <rect x="668" y="452" width="80" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="708" y="471" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">queue B</text>
  <text x="708" y="487" font-size="10.5" fill="#64748b" text-anchor="middle">downstream</text>

  <!-- flow arrows -->
  <line x1="444" y1="474" x2="500" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="608" y1="474" x2="664" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="556" y="520" font-size="10.5" fill="#94a3b8" text-anchor="middle">throughput limited at the tap &#8594; bottleneck identification</text>

  <!-- event queue feeds state machine -->
  <line x1="292" y1="230" x2="354" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-mute)"/>
  <text x="318" y="200" font-size="10.5" fill="#64748b" text-anchor="middle">dispatch</text>

  <!-- state machine governs the bottleneck station -->
  <line x1="672" y1="344" x2="608" y2="452" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-mute)"/>
  <text x="660" y="408" font-size="10.5" fill="#64748b" text-anchor="middle">station status</text>

  <!-- ============ PHYSICS ROM (feedback, dashed) ============ -->
  <rect x="802" y="180" width="258" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="818" y="205" font-size="14" font-weight="700" fill="#0f172a">Physics ROM</text>
  <text x="818" y="223" font-size="11.5" fill="#64748b">reduced-order model</text>
  <text x="818" y="244" font-size="11" fill="#475569">physics/rom.py &#8212; degradation</text>
  <text x="818" y="261" font-size="11" fill="#475569">&amp; health scoring feed event</text>
  <text x="818" y="278" font-size="11" fill="#475569">rates back into the loop</text>

  <!-- ROM feedback edge into running state (dashed feedback) -->
  <path d="M 802 250 C 768 250, 758 222, 736 210" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-mute)"/>
  <text x="790" y="160" font-size="10.5" fill="#64748b" text-anchor="middle">ROM feedback</text>

  <!-- ROM feedback back from breakdown -->
  <path d="M 732 320 C 830 330, 900 320, 900 304" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-mute)"/>

  <!-- ============ HONESTY NOTE ============ -->
  <rect x="40" y="406" width="252" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="56" y="430" font-size="12.5" font-weight="700" font-style="italic" fill="#64748b">Validation scope</text>
  <text x="56" y="452" font-size="11" font-style="italic" fill="#64748b">Validated on open benchmark</text>
  <text x="56" y="469" font-size="11" font-style="italic" fill="#64748b">datasets + 6 scripted synthetic</text>
  <text x="56" y="486" font-size="11" font-style="italic" fill="#64748b">demo scenarios.</text>
  <text x="56" y="510" font-size="11" font-style="italic" fill="#64748b">Not a live production line;</text>
  <text x="56" y="527" font-size="11" font-style="italic" fill="#64748b">~5,700 LOC under src/digital_twin/.</text>
</svg>
