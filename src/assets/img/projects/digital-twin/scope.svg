<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1100" height="500" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">One person, the whole stack</text>
  <rect x="40" y="55" width="240" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="79" font-size="13" fill="#64748b">Built solo, end-to-end: backend + frontend + ML + infra.</text>

  <!-- ===== BUILT-SOLO TAG (near title, top-right) ===== -->
  <rect x="864" y="30" width="196" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="884" cy="44" r="5" fill="#1772d0"/>
  <text x="897" y="48" font-size="11.5" font-weight="700" fill="#475569">built solo &#183; end-to-end</text>

  <!-- ===================================================== -->
  <!-- ===== THREE COLUMNS: BACKEND / FRONTEND / INFRA ===== -->
  <!-- ===================================================== -->

  <!-- ===== COLUMN 1: BACKEND ===== -->
  <rect x="40" y="108" width="320" height="208" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="40" y="108" width="320" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="40" y="130" width="320" height="12" fill="#f1f5f9"/>
  <circle cx="62" cy="125" r="6" fill="#1772d0"/>
  <text x="78" y="130" font-size="14" font-weight="800" fill="#0f172a">Backend</text>
  <text x="344" y="130" font-size="11" fill="#94a3b8" text-anchor="end">Python</text>

  <!-- headline LOC -->
  <text x="64" y="180" font-size="26" font-weight="800" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">~53,600</text>
  <text x="64" y="199" font-size="11.5" fill="#64748b">LOC Python under <tspan font-family="ui-monospace, Menlo, Consolas, monospace">src/</tspan></text>

  <!-- sub-items -->
  <line x1="64" y1="218" x2="336" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="64" y="232" width="9" height="9" rx="2" fill="#cbd5e1"/>
  <text x="82" y="241" font-size="12.5" font-weight="700" fill="#0f172a">SimPy digital twin</text>
  <text x="336" y="241" font-size="12" font-weight="700" fill="#475569" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">~5,700 LOC</text>

  <rect x="64" y="262" width="9" height="9" rx="2" fill="#cbd5e1"/>
  <text x="82" y="271" font-size="12.5" font-weight="700" fill="#0f172a">FastAPI gateway</text>
  <text x="336" y="271" font-size="12" font-weight="700" fill="#475569" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">~2,250 LOC</text>

  <text x="64" y="299" font-size="11" fill="#94a3b8">+ ML pipelines, services &amp; data layer</text>

  <!-- ===== COLUMN 2: FRONTEND ===== -->
  <rect x="390" y="108" width="320" height="208" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="390" y="108" width="320" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="390" y="130" width="320" height="12" fill="#f1f5f9"/>
  <circle cx="412" cy="125" r="6" fill="#2563eb"/>
  <text x="428" y="130" font-size="14" font-weight="800" fill="#0f172a">Frontend</text>
  <text x="694" y="130" font-size="11" fill="#94a3b8" text-anchor="end">TypeScript</text>

  <!-- headline -->
  <text x="414" y="178" font-size="18" font-weight="800" fill="#0f172a">3D dashboard</text>
  <text x="414" y="198" font-size="11.5" fill="#64748b">live operator view of the twin</text>

  <line x1="414" y1="218" x2="686" y2="218" stroke="#e2e8f0" stroke-width="1"/>

  <!-- stack chips -->
  <rect x="414" y="232" width="76" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="452" y="248" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">React</text>
  <rect x="498" y="232" width="86" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="541" y="248" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Three.js</text>
  <rect x="592" y="232" width="94" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="639" y="248" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">TypeScript</text>

  <text x="414" y="290" font-size="11.5" fill="#64748b">Charts, alerts &amp; human-in-the-loop review UI</text>

  <!-- ===== COLUMN 3: INFRA ===== -->
  <rect x="740" y="108" width="320" height="208" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="740" y="108" width="320" height="34" rx="10" fill="#f1f5f9"/>
  <rect x="740" y="130" width="320" height="12" fill="#f1f5f9"/>
  <circle cx="762" cy="125" r="6" fill="#1772d0"/>
  <text x="778" y="130" font-size="14" font-weight="800" fill="#0f172a">Infra</text>
  <text x="1044" y="130" font-size="11" fill="#94a3b8" text-anchor="end">Docker / K8s</text>

  <!-- headline -->
  <text x="764" y="178" font-size="18" font-weight="800" fill="#0f172a">Docker + Kubernetes</text>
  <text x="764" y="198" font-size="11.5" fill="#64748b">containerized with HPA autoscaling</text>

  <line x1="764" y1="218" x2="1036" y2="218" stroke="#e2e8f0" stroke-width="1"/>

  <!-- HPA replicas -->
  <rect x="764" y="230" width="9" height="9" rx="2" fill="#cbd5e1"/>
  <text x="782" y="239" font-size="12.5" font-weight="700" fill="#0f172a">backend replicas</text>
  <text x="1036" y="239" font-size="12" font-weight="700" fill="#475569" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">3-10</text>

  <rect x="764" y="260" width="9" height="9" rx="2" fill="#cbd5e1"/>
  <text x="782" y="269" font-size="12.5" font-weight="700" fill="#0f172a">frontend replicas</text>
  <text x="1036" y="269" font-size="12" font-weight="700" fill="#475569" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">2-5</text>

  <text x="764" y="299" font-size="11" fill="#94a3b8">HPA scales pods to load</text>

  <!-- ===================================================== -->
  <!-- ===== ORANGE FOCAL: TEST PANEL (one beat) ========== -->
  <!-- ===================================================== -->
  <rect x="40" y="336" width="1020" height="78" rx="10" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <rect x="56" y="352" width="3.5" height="46" rx="1.75" fill="#f09228"/>
  <text x="74" y="364" font-size="12.5" font-weight="800" fill="#78350f" letter-spacing=".3">TESTS &#183; the whole stack is covered</text>

  <!-- backend tests -->
  <text x="74" y="394" font-size="13" font-weight="700" fill="#b45309">Backend</text>
  <text x="150" y="394" font-size="20" font-weight="800" fill="#78350f" font-family="ui-monospace, Menlo, Consolas, monospace">1,178/1,189</text>
  <text x="300" y="394" font-size="13" font-weight="800" fill="#b45309">passing</text>
  <rect x="372" y="378" width="74" height="22" rx="11" fill="#fde68a"/>
  <text x="409" y="393" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">99.07%</text>
  <rect x="454" y="378" width="84" height="22" rx="11" fill="#fde68a"/>
  <text x="496" y="393" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">85% cov</text>

  <!-- divider -->
  <line x1="612" y1="372" x2="612" y2="404" stroke="#f09228" stroke-width="1.2" opacity="0.6"/>

  <!-- frontend tests -->
  <text x="640" y="394" font-size="13" font-weight="700" fill="#b45309">Frontend</text>
  <text x="722" y="394" font-size="20" font-weight="800" fill="#78350f" font-family="ui-monospace, Menlo, Consolas, monospace">542/546</text>
  <text x="828" y="394" font-size="13" font-weight="800" fill="#b45309">passing</text>
  <rect x="900" y="378" width="70" height="22" rx="11" fill="#fde68a"/>
  <text x="935" y="393" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">99.3%</text>

  <!-- backend test corpus note -->
  <text x="1044" y="361" font-size="10.5" fill="#b45309" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">~1,386 test fns &#183; 61 files</text>

  <!-- ===== HONESTY FOOTER ===== -->
  <rect x="40" y="430" width="1020" height="50" rx="8" fill="#f8f9fa"/>
  <text x="56" y="452" font-size="11" font-style="italic" fill="#64748b">Validated on open benchmarks (MVTec AD, NASA C-MAPSS, CWRU, PHM2010, SECOM) + 6 synthetic demo scenarios &#8212;</text>
  <text x="56" y="469" font-size="11" font-style="italic" fill="#64748b">not deployed to a live factory or cloud.</text>
</svg>
