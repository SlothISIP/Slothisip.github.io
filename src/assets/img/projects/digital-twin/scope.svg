<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ===== TITLE (one blue phrase) ===== -->
  <text x="40" y="56" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-.3">One person, the <tspan fill="#1772d0">whole stack</tspan>.</text>

  <!-- ===== COLUMN 1: BACKEND ===== -->
  <rect x="40" y="86" width="280" height="184" rx="12" fill="#f8fafc" stroke="#e6e9ee" stroke-width="1.5"/>
  <circle cx="66" cy="118" r="6" fill="#1772d0"/>
  <text x="82" y="123" font-size="15" font-weight="800" fill="#0f172a">Backend</text>
  <text x="66" y="190" font-size="34" font-weight="800" fill="#1772d0" font-family="ui-monospace, Menlo, Consolas, monospace">~53,600</text>
  <text x="66" y="222" font-size="14" font-weight="600" fill="#6b7280">LOC Python · FastAPI · SimPy twin</text>

  <!-- ===== COLUMN 2: FRONTEND ===== -->
  <rect x="340" y="86" width="280" height="184" rx="12" fill="#f8fafc" stroke="#e6e9ee" stroke-width="1.5"/>
  <circle cx="366" cy="118" r="6" fill="#1772d0"/>
  <text x="382" y="123" font-size="15" font-weight="800" fill="#0f172a">Frontend</text>
  <text x="366" y="178" font-size="22" font-weight="800" fill="#0f172a">3D dashboard</text>
  <rect x="366" y="200" width="74" height="30" rx="7" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.4"/>
  <rect x="450" y="200" width="92" height="30" rx="7" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.4"/>
  <text x="403" y="220" font-size="13" font-weight="700" fill="#1772d0" text-anchor="middle">React</text>
  <text x="496" y="220" font-size="13" font-weight="700" fill="#1772d0" text-anchor="middle">Three.js</text>

  <!-- ===== COLUMN 3: INFRA ===== -->
  <rect x="640" y="86" width="280" height="184" rx="12" fill="#f8fafc" stroke="#e6e9ee" stroke-width="1.5"/>
  <circle cx="666" cy="118" r="6" fill="#1772d0"/>
  <text x="682" y="123" font-size="15" font-weight="800" fill="#0f172a">Infra</text>
  <text x="666" y="178" font-size="22" font-weight="800" fill="#0f172a">Docker + K8s</text>
  <text x="666" y="214" font-size="14" font-weight="600" fill="#6b7280">autoscaled pods · CI gates</text>

  <!-- ===== ORANGE FOCAL: TEST BAND (the one beat) ===== -->
  <rect x="40" y="304" width="880" height="86" rx="12" fill="#e8833a" opacity="0.10"/>
  <rect x="40" y="304" width="880" height="86" rx="12" fill="none" stroke="#e8833a" stroke-width="2"/>
  <text x="64" y="340" font-size="13" font-weight="800" fill="#e8833a" letter-spacing=".4">TESTS — THE WHOLE STACK IS COVERED</text>
  <text x="64" y="372" font-size="17" font-weight="700" fill="#0f172a">Backend <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="800">1,178/1,189</tspan> <tspan fill="#6b7280" font-size="14">· 99.07%</tspan></text>
  <text x="520" y="372" font-size="17" font-weight="700" fill="#0f172a">Frontend <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="800">542/546</tspan> <tspan fill="#6b7280" font-size="14">· 99.3%</tspan></text>
</svg>
