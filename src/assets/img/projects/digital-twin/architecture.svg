<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">One <tspan fill="#1772d0">gateway</tspan> fans out to five services.</text>

  <!-- ============ INBOUND: React dashboard hairline into the gateway ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 252 C 300 252, 320 252, 388 252"/>
  </g>
  <circle cx="210" cy="252" r="3" fill="#e6e9ee"/>
  <text x="56" y="247" font-size="18" font-weight="600" fill="#6b7280">React dashboard</text>
  <text x="56" y="268" font-size="14" fill="#6b7280">WebSocket · 2s stream</text>

  <!-- ============ OUTBOUND: five gray hairlines from the gateway to each service ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 252 C 668 252, 690 110, 760 110"/>
    <path d="M576 252 C 668 252, 690 182, 760 182"/>
    <path d="M576 252 C 668 252, 690 254, 760 254"/>
    <path d="M576 252 C 668 252, 690 326, 760 326"/>
    <path d="M576 252 C 668 252, 690 398, 760 398"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the FastAPI gateway ============ -->
  <circle cx="482" cy="252" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="482" cy="252" r="76" fill="#1772d0"/>
  <text x="482" y="246" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="0.2" fill="#ffffff">FastAPI</text>
  <text x="482" y="274" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">routing · JWT</text>

  <!-- ============ FIVE SERVICES (gray; Digital Twin is the lone orange namesake) ============ -->
  <circle cx="762" cy="110" r="5" fill="#6b7280"/>
  <text x="780" y="116" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">Vision AI</text>

  <circle cx="762" cy="182" r="6" fill="#e8833a"/>
  <text x="780" y="188" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">Digital Twin</text>

  <circle cx="762" cy="254" r="5" fill="#6b7280"/>
  <text x="780" y="260" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">Predictive Maint.</text>

  <circle cx="762" cy="326" r="5" fill="#6b7280"/>
  <text x="780" y="332" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">Scheduling</text>

  <circle cx="762" cy="398" r="5" fill="#6b7280"/>
  <text x="780" y="404" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">Monitoring</text>
</svg>
