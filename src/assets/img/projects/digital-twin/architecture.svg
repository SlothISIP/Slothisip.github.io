<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="dt-ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="dt-ar-b" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="dt-ar-g" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">AI Digital Twin Factory &#183; Microservices Architecture</text>
  <rect x="40" y="54" width="232" height="4" rx="2" fill="#1772d0"/>
  <text x="40" y="80" font-size="13" fill="#64748b">Five core ML services behind a central FastAPI gateway &#183; React + Three.js dashboard &#183; Docker / Kubernetes</text>

  <!-- ============ CLIENT BAND ============ -->
  <rect x="40" y="100" width="1020" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="120" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">CLIENT</text>

  <rect x="430" y="128" width="240" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">React Dashboard</text>
  <text x="550" y="168" text-anchor="middle" font-size="10.5" fill="#475569">TypeScript &#183; Three.js / R3F 3D &#183; OEE / KPIs &#183; alerts</text>

  <!-- ============ GATEWAY BAND ============ -->
  <rect x="40" y="216" width="1020" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="236" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">API GATEWAY</text>

  <rect x="370" y="244" width="360" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">FastAPI API Gateway</text>
  <text x="550" y="284" text-anchor="middle" font-size="10.5" fill="#475569">Routing &#183; JWT auth &#183; rate limiting &#183; Swagger / OpenAPI</text>

  <!-- Client <-> Gateway -->
  <line x1="550" y1="180" x2="550" y2="242" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dt-ar-b)"/>
  <text x="566" y="208" font-size="10" fill="#64748b">WebSocket &#183; 2s stream</text>

  <!-- ============ CORE SERVICES BAND ============ -->
  <rect x="40" y="332" width="1020" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="352" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">CORE ML SERVICES &#183; INDEPENDENTLY DEPLOYABLE</text>

  <!-- Vision AI -->
  <rect x="56" y="366" width="186" height="120" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="149" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Vision AI</text>
  <text x="149" y="409" text-anchor="middle" font-size="10.5" fill="#475569">Defect detection</text>
  <text x="149" y="426" text-anchor="middle" font-size="10" fill="#64748b">Swin Transformer</text>
  <text x="149" y="441" text-anchor="middle" font-size="10" fill="#64748b">ONNX / GPU &#183; Grad-CAM</text>
  <text x="149" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">MVTec AD</text>

  <!-- Digital Twin (ORANGE focal — project namesake) -->
  <rect x="256" y="366" width="186" height="120" rx="6" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="349" y="390" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b45309">Digital Twin</text>
  <text x="349" y="409" text-anchor="middle" font-size="10.5" fill="#475569">SimPy discrete-event sim</text>
  <text x="349" y="426" text-anchor="middle" font-size="10" fill="#64748b">What-if &#183; bottleneck ID</text>
  <text x="349" y="441" text-anchor="middle" font-size="10" fill="#64748b">Physics ROM feedback</text>
  <text x="349" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">6 synthetic scenarios</text>

  <!-- Predictive Maintenance -->
  <rect x="456" y="366" width="186" height="120" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="549" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Predictive Maint.</text>
  <text x="549" y="409" text-anchor="middle" font-size="10.5" fill="#475569">Failure + RUL prediction</text>
  <text x="549" y="426" text-anchor="middle" font-size="10" fill="#64748b">XGBoost + LSTM</text>
  <text x="549" y="441" text-anchor="middle" font-size="10" fill="#64748b">Hybrid ensemble</text>
  <text x="549" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">C-MAPSS &#183; PHM2010</text>

  <!-- Scheduling -->
  <rect x="656" y="366" width="186" height="120" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="749" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Scheduling</text>
  <text x="749" y="409" text-anchor="middle" font-size="10.5" fill="#475569">Production optimizer</text>
  <text x="749" y="426" text-anchor="middle" font-size="10" fill="#64748b">OR-Tools CP-SAT</text>
  <text x="749" y="441" text-anchor="middle" font-size="10" fill="#64748b">RL: Ray RLlib / Gym</text>
  <text x="749" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">+56% vs random</text>

  <!-- Integration / Monitoring -->
  <rect x="856" y="366" width="186" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="949" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Integration</text>
  <text x="949" y="409" text-anchor="middle" font-size="10.5" fill="#475569">Real-time KPIs / OEE</text>
  <text x="949" y="426" text-anchor="middle" font-size="10" fill="#64748b">Metrics aggregation</text>
  <text x="949" y="441" text-anchor="middle" font-size="10" fill="#64748b">Dashboard data feed</text>

  <!-- Gateway -> each service -->
  <line x1="430" y1="296" x2="180" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#dt-ar)"/>
  <line x1="475" y1="296" x2="360" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#dt-ar)"/>
  <line x1="550" y1="296" x2="549" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#dt-ar)"/>
  <line x1="625" y1="296" x2="735" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#dt-ar)"/>
  <line x1="670" y1="296" x2="920" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#dt-ar)"/>
  <text x="690" y="324" font-size="10" fill="#64748b" text-anchor="middle">each service optional &#183; graceful degradation</text>

  <!-- ============ DATA & MESSAGING BAND ============ -->
  <rect x="40" y="528" width="1020" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="548" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">DATA &amp; MESSAGING</text>

  <!-- PostgreSQL/TimescaleDB -->
  <rect x="120" y="558" width="210" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="225" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">PostgreSQL / TimescaleDB</text>
  <text x="225" y="600" text-anchor="middle" font-size="10" fill="#475569">Time-series persistence</text>

  <!-- Redis -->
  <rect x="350" y="558" width="180" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Redis</text>
  <text x="440" y="600" text-anchor="middle" font-size="10" fill="#475569">Cache &#183; pub/sub</text>

  <!-- RabbitMQ -->
  <rect x="550" y="558" width="190" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="645" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">RabbitMQ broker</text>
  <text x="645" y="600" text-anchor="middle" font-size="10" fill="#475569">Async message bus</text>

  <!-- Celery -->
  <rect x="760" y="558" width="200" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="860" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Celery workers</text>
  <text x="860" y="600" text-anchor="middle" font-size="10" fill="#475569">Background / periodic tasks</text>

  <!-- Services -> data (green, persistence) -->
  <line x1="349" y1="486" x2="280" y2="556" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dt-ar-g)"/>
  <line x1="549" y1="486" x2="470" y2="556" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dt-ar-g)"/>
  <!-- Services -> messaging (dashed async) -->
  <line x1="660" y1="486" x2="650" y2="556" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#dt-ar)"/>
  <line x1="740" y1="616" x2="740" y2="558" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="700" y="544" font-size="9.5" fill="#64748b" text-anchor="middle">async tasks (dashed)</text>

  <!-- ============ INFRA + TEST FOOTER ============ -->
  <rect x="40" y="652" width="660" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="670" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">INFRASTRUCTURE</text>
  <text x="56" y="688" font-size="10.5" fill="#475569">Docker (multi-stage) &#183; Kubernetes (HPA backend 3-10, frontend 2-5, ingress) &#183; Prometheus + Grafana</text>

  <rect x="712" y="652" width="348" height="44" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="728" y="670" font-size="11" font-weight="700" fill="#065f46" letter-spacing="1.5">TESTS</text>
  <text x="728" y="688" font-size="10.5" fill="#475569">Backend 1,178/1,189 (99.07%, 85% cov) &#183; Frontend 542/546</text>

  <!-- Honesty caveat -->
  <text x="40" y="714" font-size="10" font-style="italic" fill="#64748b">Self-directed R&amp;D / portfolio project &#8212; validated on open benchmark datasets (MVTec AD, NASA C-MAPSS, CWRU, PHM2010, SECOM) and synthetic demos; not deployed to a live factory or cloud.</text>
</svg>
