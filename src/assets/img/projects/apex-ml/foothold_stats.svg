<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ===== TITLE (top-left, one blue word) ===== -->
  <text x="60" y="62" font-size="25" font-weight="800" fill="#0f172a" letter-spacing="-.3">A <tspan fill="#1772d0">Credit Card Fraud</tspan> benchmark run.</text>

  <!-- ===== gray hairline baseline they all sit on ===== -->
  <line x1="60" y1="300" x2="900" y2="300" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- col 1 : Dataset size 284,807 (neutral) -->
  <text x="170" y="216" text-anchor="middle" font-size="46" font-weight="800" fill="#0f172a">284,807</text>
  <text x="170" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">samples · transactions</text>

  <!-- col 2 : Positive class 0.17% (neutral) -->
  <text x="380" y="216" text-anchor="middle" font-size="46" font-weight="800" fill="#0f172a">0.17%</text>
  <text x="380" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">positives · fraud</text>

  <!-- col 3 : Accuracy 99.7% (the one blue focal) -->
  <text x="590" y="216" text-anchor="middle" font-size="46" font-weight="800" fill="#1772d0">99.7%</text>
  <text x="590" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#1772d0">accuracy · full benchmark</text>

  <!-- col 4 : Search space ~85 (neutral) -->
  <text x="800" y="216" text-anchor="middle" font-size="46" font-weight="800" fill="#0f172a">~85</text>
  <text x="800" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">algorithms · ~15 categories</text>

  <!-- thin gray divider ticks under the baseline -->
  <g fill="#e6e9ee">
    <circle cx="170" cy="300" r="3.5"/>
    <circle cx="380" cy="300" r="3.5"/>
    <circle cx="590" cy="300" r="3.5"/>
    <circle cx="800" cy="300" r="3.5"/>
  </g>

  <!-- ===== THE ONE ORANGE CAVEAT (honesty beat) ===== -->
  <line x1="60" y1="372" x2="84" y2="372" stroke="#e8833a" stroke-width="3" stroke-linecap="round"/>
  <text x="98" y="377" font-size="16" font-weight="600" fill="#e8833a">At 0.17% positives, accuracy alone is misleading — F1 is the real headline.</text>
</svg>
