<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">A funnel that <tspan fill="#1772d0">narrows</tspan> to one model.</text>

  <!-- ============ INBOUND: ~85 candidates taper in as gray hairlines ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M168 168 C 320 168, 372 282, 424 282"/>
    <path d="M168 220 C 320 220, 372 282, 424 282"/>
    <path d="M168 282 C 330 282, 380 282, 424 282"/>
    <path d="M168 344 C 320 344, 372 282, 424 282"/>
    <path d="M168 396 C 320 396, 372 282, 424 282"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="164" cy="168" r="3"/>
    <circle cx="164" cy="220" r="3"/>
    <circle cx="164" cy="282" r="3"/>
    <circle cx="164" cy="344" r="3"/>
    <circle cx="164" cy="396" r="3"/>
  </g>
  <text x="56" y="266" font-size="34" font-weight="800" fill="#0f172a">~85</text>
  <text x="56" y="290" font-size="16" font-weight="600" fill="#6b7280">registered algorithms</text>

  <!-- outbound hairline tapering to the single ensemble -->
  <path d="M576 282 C 636 282, 660 248, 688 248" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>

  <!-- ============ THE ONE BLUE FOCAL: cheap sample screening ============ -->
  <circle cx="500" cy="282" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="282" r="76" fill="#1772d0"/>
  <text x="500" y="270" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="0.2" fill="#ffffff">10%</text>
  <text x="500" y="298" text-anchor="middle" font-size="15" letter-spacing="0.2" fill="#cfe2f7">sample screening</text>

  <!-- ============ OUTCOME: one optimized ensemble (the single survivor) ============ -->
  <circle cx="690" cy="248" r="6" fill="#e8833a"/>
  <text x="708" y="244" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.2">1 optimized ensemble</text>
  <text x="708" y="268" font-size="15" font-weight="600" fill="#6b7280" letter-spacing="0.2">dynamic weighting</text>
</svg>
