<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Three phases narrow to one <tspan fill="#1772d0">model</tspan>.</text>

  <!-- ============ INBOUND: gray hairlines converging on the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 188 C 360 188, 392 262, 424 262"/>
    <path d="M214 262 C 360 262, 392 262, 424 262"/>
    <path d="M214 336 C 360 336, 392 262, 424 262"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="188" r="3"/>
    <circle cx="210" cy="262" r="3"/>
    <circle cx="210" cy="336" r="3"/>
  </g>
  <text x="56" y="194" font-size="18" font-weight="600" fill="#6b7280">~85 algorithms</text>
  <text x="56" y="268" font-size="18" font-weight="600" fill="#6b7280">imbalanced tabular</text>
  <text x="56" y="342" font-size="18" font-weight="600" fill="#6b7280">284,807 samples</text>

  <!-- outbound hairlines to the two outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 262 C 662 262, 690 210, 752 210"/>
    <path d="M576 262 C 662 262, 690 314, 752 314"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the 3-phase pipeline ============ -->
  <circle cx="500" cy="262" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="262" r="76" fill="#1772d0"/>
  <text x="500" y="250" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.2" fill="#ffffff">3-phase</text>
  <text x="500" y="278" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.2" fill="#ffffff">pipeline</text>

  <!-- ============ TWO OUTCOMES (the 99.7% result is the lone orange) ============ -->
  <circle cx="754" cy="210" r="5" fill="#6b7280"/>
  <text x="772" y="216" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">1 ensemble model</text>
  <circle cx="754" cy="314" r="6" fill="#e8833a"/>
  <text x="772" y="320" font-size="20" font-weight="700" fill="#e8833a" letter-spacing="0.3">99.7% accuracy</text>
</svg>
