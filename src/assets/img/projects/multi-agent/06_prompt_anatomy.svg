<svg viewBox="0 0 960 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ============ TITLE (top-left label) ============ -->
  <text x="64" y="62" font-size="24" font-weight="700" fill="#0f172a">Goal in the prompt, not the <tspan fill="#1772d0">how-to</tspan>.</text>

  <!-- ============ GRAY PROMPT SKELETON (vertical stack, hairline) ============ -->
  <!-- spine -->
  <line x1="150" y1="138" x2="150" y2="402" stroke="#e6e9ee" stroke-width="2"/>

  <!-- Domain -->
  <circle cx="150" cy="138" r="5" fill="#e6e9ee"/>
  <text x="178" y="145" font-size="28" font-weight="600" fill="#6b7280">Domain</text>

  <!-- Goal : THE ONE BLUE FOCAL (oversized, filled) -->
  <rect x="120" y="196" width="300" height="68" rx="12" fill="#1772d0"/>
  <text x="146" y="240" font-size="34" font-weight="700" fill="#ffffff">Goal</text>
  <line x1="150" y1="138" x2="150" y2="196" stroke="#e6e9ee" stroke-width="2"/>

  <!-- Tools -->
  <circle cx="150" cy="306" r="5" fill="#e6e9ee"/>
  <text x="178" y="313" font-size="28" font-weight="600" fill="#6b7280">Tools</text>
  <line x1="150" y1="264" x2="150" y2="306" stroke="#e6e9ee" stroke-width="2"/>

  <!-- Constraints -->
  <circle cx="150" cy="354" r="5" fill="#e6e9ee"/>
  <text x="178" y="361" font-size="28" font-weight="600" fill="#6b7280">Constraints</text>

  <!-- JSON -->
  <circle cx="150" cy="402" r="5" fill="#e6e9ee"/>
  <text x="178" y="409" font-size="28" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6b7280">JSON</text>

  <!-- ============ ORANGE EXCLUSION (the one orange touch: what's deliberately absent) ============ -->
  <line x1="600" y1="270" x2="700" y2="270" stroke="#e6e9ee" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="700" y="263" font-size="28" font-weight="600" fill="#e8833a">no control flow</text>
  <line x1="697" y1="254" x2="897" y2="254" stroke="#e8833a" stroke-width="2.5"/>
  <text x="700" y="295" font-size="15" fill="#6b7280" letter-spacing="0.2">no if/then, no tool ordering</text>
</svg>
