<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- ===== TITLE (top-left, one word blue) ===== -->
  <text x="60" y="64" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-.2">Five rules. No <tspan fill="#1772d0">LLM</tspan> in the safety path.</text>

  <!-- ===== ROW 1 : physical_inconsistency -> retry (gray) ===== -->
  <text x="60" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">physical_inconsistency</text>
  <line x1="600" y1="152" x2="700" y2="152" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="716" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">retry</text>

  <!-- ===== ROW 2 : cross_agent_contradiction -> deliberation  (BLUE FOCAL) ===== -->
  <rect x="36" y="208" width="888" height="58" rx="12" fill="#1772d0" opacity="0.06"/>
  <text x="60" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#1772d0">cross_agent_contradiction</text>
  <line x1="600" y1="237" x2="700" y2="237" stroke="#1772d0" stroke-width="2"/>
  <text x="716" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#1772d0">deliberation</text>

  <!-- ===== ROW 3 : low_confidence -> hitl (ORANGE human beat) ===== -->
  <text x="60" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">low_confidence</text>
  <line x1="600" y1="316" x2="700" y2="316" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="716" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#e8833a">hitl</text>

  <!-- ===== ROW 4 : tool_anomaly -> force_stop (gray) ===== -->
  <text x="60" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">tool_anomaly</text>
  <line x1="600" y1="394" x2="700" y2="394" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="716" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">force_stop</text>

  <!-- ===== ROW 5 : cost_time_exceeded -> force_stop (gray) ===== -->
  <text x="60" y="464" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">cost_time_exceeded</text>
  <line x1="600" y1="456" x2="700" y2="456" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="716" y="464" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#6b7280">force_stop</text>
</svg>
