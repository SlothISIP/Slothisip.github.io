<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Guardrail Rules</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#64748b">5 deterministic Python rules · evaluated outside the LLM · shared/guardrail.py</text>

  <rect x="60" y="85" width="305" height="40" fill="#1e293b"/>
  <text x="212" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">RULE</text>

  <rect x="370" y="85" width="455" height="40" fill="#1e293b"/>
  <text x="597" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">TRIGGER</text>

  <rect x="830" y="85" width="210" height="40" fill="#1e293b"/>
  <text x="935" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">ACTION</text>

  <rect x="60" y="130" width="305" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="158" font-size="13" font-weight="600" fill="#0f172a">physical_inconsistency</text>
  <text x="78" y="178" font-size="10" fill="#64748b">domain knowledge violation</text>

  <rect x="370" y="130" width="455" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="156" font-size="12" fill="#0f172a">crack reported with surface area &lt; 0.05 %</text>
  <text x="385" y="174" font-size="12" fill="#0f172a">or RUL &lt; 0 (negative remaining-useful-life)</text>

  <rect x="830" y="130" width="210" height="65" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="935" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">retry</text>
  <text x="935" y="183" text-anchor="middle" font-size="10" fill="#64748b">re-run agent with hint</text>

  <rect x="60" y="200" width="305" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="228" font-size="13" font-weight="600" fill="#0f172a">cross_agent_contradiction</text>
  <text x="78" y="248" font-size="10" fill="#64748b">two agents disagree on verdict</text>

  <rect x="370" y="200" width="455" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="226" font-size="12" fill="#0f172a">Recognition DEFECT + Prediction NORMAL</text>
  <text x="385" y="244" font-size="12" fill="#0f172a">(or vice versa, with both confidences ≥ 0.70)</text>

  <rect x="830" y="200" width="210" height="65" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="935" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">deliberation</text>
  <text x="935" y="253" text-anchor="middle" font-size="10" fill="#64748b">2-round protocol</text>

  <rect x="60" y="270" width="305" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="298" font-size="13" font-weight="600" fill="#0f172a">low_confidence</text>
  <text x="78" y="318" font-size="10" fill="#64748b">model not sure enough to act</text>

  <rect x="370" y="270" width="455" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="296" font-size="12" fill="#0f172a">final agent confidence &lt; 0.70</text>
  <text x="385" y="314" font-size="12" fill="#0f172a">(threshold tunable via .env GUARDRAIL_CONFIDENCE_THRESHOLD)</text>

  <rect x="830" y="270" width="210" height="65" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="935" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">hitl</text>
  <text x="935" y="323" text-anchor="middle" font-size="10" fill="#64748b">operator review</text>

  <rect x="60" y="340" width="305" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="368" font-size="13" font-weight="600" fill="#0f172a">tool_anomaly</text>
  <text x="78" y="388" font-size="10" fill="#64748b">tool-use loop misbehaving</text>

  <rect x="370" y="340" width="455" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="366" font-size="12" fill="#0f172a">same tool called 3× consecutively</text>
  <text x="385" y="384" font-size="12" fill="#0f172a">or 0 tool_calls but agent emits judgment</text>

  <rect x="830" y="340" width="210" height="65" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="935" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">force_stop</text>
  <text x="935" y="393" text-anchor="middle" font-size="10" fill="#64748b">return best-so-far</text>

  <rect x="60" y="410" width="305" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="438" font-size="13" font-weight="600" fill="#0f172a">cost_time_exceeded</text>
  <text x="78" y="458" font-size="10" fill="#64748b">runaway inspection</text>

  <rect x="370" y="410" width="455" height="65" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="436" font-size="12" fill="#0f172a">≥ 15 LLM calls within one inspection</text>
  <text x="385" y="454" font-size="12" fill="#0f172a">or wall-clock duration &gt; 30 s</text>

  <rect x="830" y="410" width="210" height="65" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="935" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">force_stop</text>
  <text x="935" y="463" text-anchor="middle" font-size="10" fill="#64748b">return best-so-far</text>

  <text x="550" y="510" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">All five rules evaluated by Python · no LLM in the safety path · LLM is the orchestrator, never the guardrail</text>
</svg>
