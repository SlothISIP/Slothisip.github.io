<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ============ TITLE (top-left label) ============ -->
  <text x="60" y="70" font-size="23" font-weight="700" fill="#0f172a">Between brittle rules and unauditable <tspan fill="#1772d0">ML</tspan>.</text>

  <!-- ============ GRAY SPECTRUM LINE ============ -->
  <line x1="120" y1="248" x2="840" y2="248" stroke="#e6e9ee" stroke-width="2"/>
  <circle cx="120" cy="248" r="5" fill="#e6e9ee"/>
  <circle cx="840" cy="248" r="5" fill="#e6e9ee"/>

  <!-- ============ LEFT POSITION (gray, recedes) ============ -->
  <text x="120" y="312" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">Rule-based</text>
  <text x="120" y="336" text-anchor="middle" font-size="15" fill="#6b7280">(brittle)</text>

  <!-- ============ RIGHT POSITION (gray, recedes) ============ -->
  <text x="840" y="312" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">End-to-end ML</text>
  <text x="840" y="336" text-anchor="middle" font-size="15" fill="#6b7280">(unauditable)</text>

  <!-- ============ THE ONE BLUE FOCAL (center, slightly oversized) ============ -->
  <circle cx="480" cy="248" r="92" fill="#1772d0" opacity="0.06"/>
  <circle cx="480" cy="248" r="68" fill="#1772d0"/>
  <text x="480" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">This project</text>
  <text x="480" y="262" text-anchor="middle" font-size="13" fill="#cfe2f7">ML outputs as evidence</text>
  <text x="480" y="280" text-anchor="middle" font-size="13" fill="#cfe2f7">to cross-examine</text>

  <!-- ============ ONE ORANGE TOUCH: escalate to a human ============ -->
  <line x1="480" y1="316" x2="480" y2="362" stroke="#e6e9ee" stroke-width="1.5"/>
  <circle cx="480" cy="362" r="4.5" fill="#e8833a"/>
  <text x="496" y="367" font-size="15" font-weight="600" fill="#e8833a">escalate to a human</text>
</svg>
