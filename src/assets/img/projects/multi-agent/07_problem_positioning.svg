<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="pp-ev" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="pp-n" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="36" y="46" font-size="27" font-weight="800" fill="#0f172a">Where this sits</text>
  <rect x="36" y="56" width="186" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="36" y="84" font-size="15" fill="#64748b">Two unsatisfying extremes &#8212; and the position this project takes.</text>

  <!-- ===== LEFT: rule-based ===== -->
  <rect x="24" y="128" width="244" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="146" y="184" text-anchor="middle" font-size="24" font-weight="800" fill="#991b1b">Rule-based</text>
  <text x="146" y="228" text-anchor="middle" font-size="20" fill="#b91c1c">brittle as defects</text>
  <text x="146" y="252" text-anchor="middle" font-size="20" fill="#b91c1c">multiply</text>

  <!-- ===== RIGHT: end-to-end ML ===== -->
  <rect x="692" y="128" width="244" height="150" rx="12" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="814" y="184" text-anchor="middle" font-size="24" font-weight="800" fill="#78350f">End-to-end ML</text>
  <text x="814" y="240" text-anchor="middle" font-size="20" fill="#b45309">unauditable</text>

  <!-- ===== CENTER: this project ===== -->
  <rect x="300" y="104" width="360" height="198" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="480" y="158" text-anchor="middle" font-size="30" font-weight="800" fill="#1e3a8a">This project</text>
  <text x="480" y="206" text-anchor="middle" font-size="21" fill="#1e3a8a">treat ML outputs as evidence</text>
  <text x="480" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">to cross-examine,</text>
  <text x="480" y="268" text-anchor="middle" font-size="21" fill="#1e3a8a">escalate on disagreement</text>

  <!-- ===== converge arrows ===== -->
  <line x1="272" y1="203" x2="296" y2="203" stroke="#64748b" stroke-width="2.4" marker-end="url(#pp-n)"/>
  <line x1="688" y1="203" x2="664" y2="203" stroke="#64748b" stroke-width="2.4" marker-end="url(#pp-n)"/>

  <!-- ===== evidence tool chips feeding up ===== -->
  <rect x="216" y="430" width="160" height="58" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="296" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">PatchCore</text>
  <rect x="400" y="430" width="160" height="58" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">AnomalyCLIP</text>
  <rect x="584" y="430" width="160" height="58" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="664" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">XGBoost RUL</text>

  <line x1="296" y1="430" x2="430" y2="308" stroke="#16a34a" stroke-width="2.4" marker-end="url(#pp-ev)"/>
  <line x1="480" y1="430" x2="480" y2="308" stroke="#16a34a" stroke-width="2.4" marker-end="url(#pp-ev)"/>
  <line x1="664" y1="430" x2="530" y2="308" stroke="#16a34a" stroke-width="2.4" marker-end="url(#pp-ev)"/>
</svg>
