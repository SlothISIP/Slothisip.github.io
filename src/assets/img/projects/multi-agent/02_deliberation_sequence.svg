<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="ar-red" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="36" y="46" font-size="27" font-weight="800" fill="#0f172a">Deliberation Protocol</text>
  <rect x="36" y="55" width="292" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="36" y="82" font-size="15" fill="#64748b">2 rounds, no tiebreaker &#8212; disagreement escalates to a human.</text>

  <!-- TRIGGER CHIP -->
  <rect x="270" y="102" width="420" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">Trigger: DEFECT vs NORMAL</text>

  <!-- LANE HEADERS -->
  <rect x="60" y="172" width="380" height="54" rx="10" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="250" y="208" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">Recognition</text>

  <rect x="520" y="172" width="380" height="54" rx="10" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="710" y="208" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">Prediction</text>

  <!-- LIFELINES -->
  <line x1="250" y1="226" x2="250" y2="486" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="5 5"/>
  <line x1="710" y1="226" x2="710" y2="486" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="5 5"/>

  <!-- ROUND 1 -->
  <rect x="408" y="244" width="144" height="34" rx="6" fill="#1e293b"/>
  <text x="480" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Round 1</text>

  <rect x="80" y="294" width="340" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="333" text-anchor="middle" font-size="26" font-weight="800" fill="#991b1b">DEFECT 0.95</text>

  <rect x="540" y="294" width="340" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="333" text-anchor="middle" font-size="26" font-weight="800" fill="#1e40af">NORMAL 0.95</text>

  <!-- ROUND 2 -->
  <rect x="408" y="376" width="144" height="34" rx="6" fill="#1e293b"/>
  <text x="480" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Round 2</text>

  <rect x="80" y="426" width="340" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="465" text-anchor="middle" font-size="26" font-weight="800" fill="#991b1b">holds DEFECT</text>

  <rect x="540" y="426" width="340" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="465" text-anchor="middle" font-size="26" font-weight="800" fill="#1e40af">holds NORMAL</text>

  <!-- JOIN INTO SYNTHESIS -->
  <line x1="250" y1="486" x2="250" y2="512" stroke="#475569" stroke-width="2.5"/>
  <line x1="710" y1="486" x2="710" y2="512" stroke="#475569" stroke-width="2.5"/>
  <line x1="250" y1="512" x2="710" y2="512" stroke="#475569" stroke-width="2.5"/>
  <line x1="480" y1="512" x2="480" y2="534" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- SYNTHESIS -->
  <rect x="330" y="538" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="572" text-anchor="middle" font-size="24" font-weight="800" fill="#1e3a8a">Synthesis</text>

  <line x1="480" y1="590" x2="480" y2="616" stroke="#dc2626" stroke-width="3" marker-end="url(#ar-red)"/>

  <!-- PUNCHLINE -->
  <rect x="186" y="620" width="588" height="74" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="480" y="668" text-anchor="middle" font-size="40" font-weight="800" fill="#991b1b">NO CONSENSUS &#8594; HUMAN</text>
</svg>
