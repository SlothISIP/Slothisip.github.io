<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- TITLE (top-left label) -->
  <text x="44" y="56" font-size="29" font-weight="700" fill="#0f172a">When two agents disagree, a <tspan fill="#1772d0">human</tspan> decides.</text>

  <!-- ============ TWO FACING GRAY POSITIONS (never reconcile) ============ -->
  <!-- left: Recognition -->
  <circle cx="172" cy="208" r="60" fill="none" stroke="#e6e9ee" stroke-width="2"/>
  <text x="172" y="200" text-anchor="middle" font-size="17" fill="#6b7280" letter-spacing="0.4">Recognition</text>
  <text x="172" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#6b7280">DEFECT</text>
  <text x="172" y="306" text-anchor="middle" font-size="16" fill="#6b7280">0.95</text>

  <!-- right: Prediction -->
  <circle cx="788" cy="208" r="60" fill="none" stroke="#e6e9ee" stroke-width="2"/>
  <text x="788" y="200" text-anchor="middle" font-size="17" fill="#6b7280" letter-spacing="0.4">Prediction</text>
  <text x="788" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#6b7280">NORMAL</text>
  <text x="788" y="306" text-anchor="middle" font-size="16" fill="#6b7280">0.95</text>

  <!-- thin two-round hint between them: they restate, no tiebreaker -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M232 188 C 380 162, 580 162, 728 188"/>
    <path d="M728 228 C 580 254, 380 254, 232 228"/>
  </g>
  <text x="480" y="152" text-anchor="middle" font-size="15" fill="#6b7280" letter-spacing="0.4">round 1</text>
  <text x="480" y="274" text-anchor="middle" font-size="15" fill="#6b7280" letter-spacing="0.4">round 2</text>

  <!-- hairline convergence from both into the focal outcome -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M198 262 C 300 372, 400 384, 426 384"/>
    <path d="M762 262 C 660 372, 560 384, 534 384"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the outcome ============ -->
  <circle cx="480" cy="384" r="90" fill="#1772d0" opacity="0.06"/>
  <circle cx="480" cy="384" r="68" fill="#1772d0"/>
  <text x="480" y="378" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">NO</text>
  <text x="480" y="404" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">CONSENSUS</text>

  <!-- ============ ONE ORANGE TOUCH: HUMAN decides ============ -->
  <path d="M550 384 C 604 384, 624 384, 664 384" stroke="#e8833a" stroke-width="2.5" fill="none"/>
  <circle cx="672" cy="384" r="5.5" fill="#e8833a"/>
  <text x="690" y="391" font-size="22" font-weight="700" fill="#e8833a" letter-spacing="0.4">HUMAN</text>
</svg>
