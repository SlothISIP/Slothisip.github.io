<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ===== TITLE (top-left, one short line) ===== -->
  <text x="60" y="62" font-size="23" font-weight="700" fill="#0f172a">Strong scores — but they measure the <tspan fill="#1772d0">tools</tspan>, not the system.</text>

  <!-- ===== FOUR BIG NUMBERS IN A ROW ===== -->
  <!-- gray hairline baseline they all sit on -->
  <line x1="60" y1="300" x2="900" y2="300" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- col 1 : PatchCore AUROC 1.0000 (synthetic) -->
  <text x="170" y="218" text-anchor="middle" font-size="58" font-weight="800" fill="#1772d0">1.0000</text>
  <text x="170" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">PatchCore · AUROC</text>
  <text x="170" y="276" text-anchor="middle" font-size="14" fill="#6b7280">synthetic</text>

  <!-- col 2 : AnomalyCLIP AUROC 0.9850 (synthetic) -->
  <text x="380" y="218" text-anchor="middle" font-size="58" font-weight="800" fill="#1772d0">0.9850</text>
  <text x="380" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">AnomalyCLIP · AUROC</text>
  <text x="380" y="276" text-anchor="middle" font-size="14" fill="#6b7280">synthetic</text>

  <!-- col 3 : XGBoost F1 0.9851 (open AI4I-2020) -->
  <text x="590" y="218" text-anchor="middle" font-size="58" font-weight="800" fill="#1772d0">0.9851</text>
  <text x="590" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">XGBoost · F1</text>
  <text x="590" y="276" text-anchor="middle" font-size="14" fill="#6b7280">open AI4I-2020</text>

  <!-- col 4 : Chronos-2 RMSE 40.29 (open C-MAPSS FD001) -->
  <text x="800" y="218" text-anchor="middle" font-size="58" font-weight="800" fill="#1772d0">40.29</text>
  <text x="800" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">Chronos-2 · RMSE</text>
  <text x="800" y="276" text-anchor="middle" font-size="14" fill="#6b7280">open C-MAPSS FD001</text>

  <!-- thin gray divider ticks under the baseline separating the four -->
  <g fill="#e6e9ee">
    <circle cx="170" cy="300" r="3.5"/>
    <circle cx="380" cy="300" r="3.5"/>
    <circle cx="590" cy="300" r="3.5"/>
    <circle cx="800" cy="300" r="3.5"/>
  </g>

  <!-- ===== THE ONE ORANGE CAVEAT (critical caveat) ===== -->
  <line x1="60" y1="370" x2="84" y2="370" stroke="#e8833a" stroke-width="3" stroke-linecap="round"/>
  <text x="98" y="375" font-size="16" font-weight="600" fill="#e8833a">These score the four ML tools — not the orchestration around them.</text>
</svg>
