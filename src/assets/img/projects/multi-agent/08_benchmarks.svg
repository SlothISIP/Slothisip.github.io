<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="36" y="44" font-size="27" font-weight="800" fill="#0f172a">ML-tool benchmarks</text>
  <rect x="36" y="54" width="252" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="36" y="80" font-size="15" fill="#64748b">Strong scores — but on synthetic / open data. They measure the tools, not the system.</text>

  <!-- ===== COLUMN HEADERS ===== -->
  <text x="36"  y="120" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="0.5">TOOL</text>
  <text x="340" y="120" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="0.5">VALUE</text>
  <text x="924" y="120" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="0.5" text-anchor="end">DATASET</text>
  <line x1="36" y1="132" x2="924" y2="132" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- ===== ROW 1 : PatchCore AUROC 1.0000 ===== -->
  <g>
    <text x="36"  y="178" font-size="29" font-weight="700" fill="#0f172a">PatchCore</text>
    <text x="36"  y="200" font-size="18" font-weight="600" fill="#64748b">AUROC</text>
    <text x="340" y="190" font-size="40" font-weight="800" fill="#166534">1.0000</text>
    <rect x="560" y="166" width="170" height="24" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <rect x="754" y="162" width="170" height="32" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="839" y="184" font-size="20" font-style="italic" fill="#64748b" text-anchor="middle">synthetic</text>
  </g>
  <line x1="36" y1="216" x2="924" y2="216" stroke="#eef2f7" stroke-width="1.4"/>

  <!-- ===== ROW 2 : AnomalyCLIP AUROC 0.9850 ===== -->
  <g>
    <text x="36"  y="262" font-size="29" font-weight="700" fill="#0f172a">AnomalyCLIP</text>
    <text x="36"  y="284" font-size="18" font-weight="600" fill="#64748b">AUROC</text>
    <text x="340" y="274" font-size="40" font-weight="800" fill="#166534">0.9850</text>
    <rect x="560" y="250" width="170" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
    <rect x="560" y="250" width="167.45" height="24" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <rect x="754" y="246" width="170" height="32" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="839" y="268" font-size="20" font-style="italic" fill="#64748b" text-anchor="middle">synthetic</text>
  </g>
  <line x1="36" y1="300" x2="924" y2="300" stroke="#eef2f7" stroke-width="1.4"/>

  <!-- ===== ROW 3 : XGBoost F1 0.9851 ===== -->
  <g>
    <text x="36"  y="346" font-size="29" font-weight="700" fill="#0f172a">XGBoost</text>
    <text x="36"  y="368" font-size="18" font-weight="600" fill="#64748b">F1</text>
    <text x="340" y="358" font-size="40" font-weight="800" fill="#166534">0.9851</text>
    <rect x="560" y="334" width="170" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
    <rect x="560" y="334" width="167.47" height="24" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <rect x="754" y="330" width="170" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="839" y="352" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">open AI4I-2020</text>
  </g>
  <line x1="36" y1="384" x2="924" y2="384" stroke="#eef2f7" stroke-width="1.4"/>

  <!-- ===== ROW 4 : Chronos-2 RMSE 40.29 (lower better, no 0-1 bar) ===== -->
  <g>
    <text x="36"  y="424" font-size="29" font-weight="700" fill="#0f172a">Chronos-2</text>
    <text x="340" y="404" font-size="18" font-weight="600" fill="#64748b">RMSE (lower better)</text>
    <text x="340" y="432" font-size="36" font-weight="800" fill="#78350f">40.29</text>
    <rect x="754" y="402" width="170" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="839" y="424" font-size="17" font-weight="600" fill="#1e3a8a" text-anchor="middle">open C-MAPSS FD001</text>
  </g>
</svg>
