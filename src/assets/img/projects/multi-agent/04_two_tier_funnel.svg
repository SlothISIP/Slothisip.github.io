<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- ===== TITLE (top-left) ===== -->
  <text x="60" y="62" font-size="24" font-weight="700" fill="#0f172a">The <tspan fill="#1772d0">cheap path</tspan> runs first.</text>

  <!-- ===== INSPECTION ORIGIN (gray) ===== -->
  <circle cx="118" cy="240" r="5" fill="#6b7280"/>
  <text x="60" y="282" font-size="15" fill="#6b7280" letter-spacing="0.3">Inspection</text>

  <!-- ===== FAST PATH — primary blue lane (solid, straight, oversized) ===== -->
  <path d="M124 240 L 360 240" fill="none" stroke="#1772d0" stroke-width="4"/>
  <path d="M656 240 L 800 240" fill="none" stroke="#1772d0" stroke-width="4"/>

  <!-- the one lit node: Fast Path -->
  <rect x="360" y="208" width="296" height="64" rx="32" fill="#1772d0"/>
  <text x="508" y="247" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.3">Fast Path</text>

  <!-- verdict terminus (gray, quiet) -->
  <circle cx="806" cy="240" r="5" fill="#6b7280"/>
  <text x="824" y="245" font-size="16" fill="#6b7280" letter-spacing="0.3">verdict</text>

  <!-- ===== SECONDARY LANE — fallback, hairline gray ===== -->
  <!-- branch down off Inspection -->
  <path d="M124 240 C 220 240, 220 348, 360 348" fill="none" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- Goal-Driven ReAct -> Deliberation -> Human, thin gray flow -->
  <circle cx="360" cy="348" r="4" fill="#6b7280"/>
  <text x="378" y="353" font-size="15" fill="#6b7280" letter-spacing="0.3">Goal-Driven ReAct</text>

  <path d="M530 348 L 600 348" fill="none" stroke="#e6e9ee" stroke-width="1.5"/>
  <circle cx="604" cy="348" r="4" fill="#6b7280"/>
  <text x="622" y="353" font-size="15" fill="#6b7280" letter-spacing="0.3">Deliberation</text>

  <path d="M734 348 L 800 348" fill="none" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- Human — the one orange touch -->
  <circle cx="806" cy="348" r="4.5" fill="#e8833a"/>
  <text x="824" y="353" font-size="15" font-weight="600" fill="#e8833a" letter-spacing="0.3">Human</text>

  <!-- editorial caption (gray, big air) -->
  <text x="60" y="402" font-size="14" fill="#6b7280" letter-spacing="0.2">The LLM lane is the gray exception.</text>
</svg>
