<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left) ===== -->
  <text x="48" y="74" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Every path ends at one <tspan fill="#1772d0">gate</tspan>.</text>

  <!-- ============ STRUCTURE: hairline gray scaffolding ============ -->

  <!-- inbound converging hairlines (the 11 agents + two-tier pipeline, implied) -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M150 150 C 330 150, 380 268, 424 268"/>
    <path d="M150 184 C 330 184, 380 268, 424 268"/>
    <path d="M150 218 C 330 218, 380 268, 424 268"/>
    <path d="M150 252 C 330 252, 380 268, 424 268"/>
    <path d="M150 286 C 330 286, 380 268, 424 268"/>
    <path d="M150 320 C 330 320, 380 268, 424 268"/>
    <path d="M150 354 C 330 354, 380 268, 424 268"/>
    <path d="M150 388 C 330 388, 380 268, 424 268"/>
  </g>

  <!-- faint origin dots -->
  <g fill="#e6e9ee">
    <circle cx="148" cy="150" r="3"/>
    <circle cx="148" cy="184" r="3"/>
    <circle cx="148" cy="218" r="3"/>
    <circle cx="148" cy="252" r="3"/>
    <circle cx="148" cy="286" r="3"/>
    <circle cx="148" cy="320" r="3"/>
    <circle cx="148" cy="354" r="3"/>
    <circle cx="148" cy="388" r="3"/>
  </g>

  <!-- inbound source labels (muted gray) -->
  <text x="60" y="156" font-size="18" font-weight="600" fill="#6b7280">11 agents</text>
  <text x="60" y="394" font-size="18" font-weight="600" fill="#6b7280">two-tier pipeline</text>

  <!-- three thin outbound hairlines to the outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 268 C 680 268, 700 168, 766 168"/>
    <path d="M576 268 C 680 268, 700 268, 766 268"/>
    <path d="M576 268 C 680 268, 700 368, 766 368"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the guardrail ============ -->
  <circle cx="500" cy="268" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="268" r="76" fill="#1772d0"/>
  <text x="500" y="262" text-anchor="middle" font-size="29" font-weight="800" letter-spacing="0.4" fill="#ffffff">guardrail</text>
  <text x="500" y="292" text-anchor="middle" font-size="16" letter-spacing="0.3" fill="#cfe2f7">5 rules · no LLM</text>

  <!-- ============ THREE OUTCOMES (gray; HUMAN is the lone orange) ============ -->
  <circle cx="772" cy="168" r="5" fill="#6b7280"/>
  <text x="788" y="175" font-size="20" font-weight="600" fill="#6b7280" letter-spacing="0.4">PASS</text>

  <circle cx="772" cy="268" r="5" fill="#6b7280"/>
  <text x="788" y="275" font-size="20" font-weight="600" fill="#6b7280" letter-spacing="0.4">DELIBERATION</text>

  <circle cx="772" cy="368" r="6" fill="#e8833a"/>
  <text x="788" y="375" font-size="20" font-weight="700" fill="#e8833a" letter-spacing="0.4">HUMAN</text>
</svg>
