<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="a-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#f09228"/></marker>
    <marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="36" y="46" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-.3">Everything funnels into one gate</text>
  <rect x="36" y="56" width="340" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="36" y="84" font-size="15" fill="#64748b">11 agents and the two-tier pipeline all converge on a single deterministic guardrail.</text>

  <!-- ===== SOURCES (top) ===== -->
  <rect x="36" y="108" width="262" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="167" y="146" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a8a">11 specialist agents</text>

  <rect x="330" y="108" width="262" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="461" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Fast Path</text>
  <text x="461" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Goal-Driven ReAct</text>

  <rect x="624" y="108" width="300" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="774" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Operator</text>
  <text x="774" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Dashboard</text>

  <!-- FUNNEL arrows into gate -->
  <line x1="167" y1="170" x2="430" y2="262" stroke="#475569" stroke-width="2.4" marker-end="url(#a-slate)"/>
  <line x1="461" y1="170" x2="478" y2="262" stroke="#475569" stroke-width="2.4" marker-end="url(#a-slate)"/>
  <line x1="774" y1="170" x2="530" y2="262" stroke="#475569" stroke-width="2.4" marker-end="url(#a-slate)"/>

  <!-- ===== THE GATE (loud focal) ===== -->
  <polygon points="480,250 700,355 480,460 260,355" fill="#fde68a" stroke="#f09228" stroke-width="5"/>
  <text x="480" y="350" text-anchor="middle" font-size="32" font-weight="800" fill="#78350f">Deterministic</text>
  <text x="480" y="384" text-anchor="middle" font-size="32" font-weight="800" fill="#78350f">guardrail</text>
  <text x="480" y="414" text-anchor="middle" font-size="20" font-weight="600" fill="#b45309">5 rules · no LLM</text>

  <!-- THREE EXITS -->
  <line x1="360" y1="408" x2="200" y2="478" stroke="#16a34a" stroke-width="3" marker-end="url(#a-green)"/>
  <line x1="480" y1="460" x2="480" y2="478" stroke="#f09228" stroke-width="3" marker-end="url(#a-amber)"/>
  <line x1="600" y1="408" x2="760" y2="478" stroke="#dc2626" stroke-width="3" marker-end="url(#a-red)"/>

  <rect x="60" y="484" width="240" height="58" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.4"/>
  <text x="180" y="521" text-anchor="middle" font-size="26" font-weight="800" fill="#166534">PASS</text>

  <rect x="360" y="484" width="240" height="58" rx="10" fill="#fef3c7" stroke="#f09228" stroke-width="2.4"/>
  <text x="480" y="521" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">DELIBERATION</text>

  <rect x="660" y="484" width="240" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="780" y="521" text-anchor="middle" font-size="26" font-weight="800" fill="#dc2626">HITL · Human</text>
</svg>
