<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">HITL → Learning Adaptive Loop</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#64748b">rules stay static · thresholds adapt · the loop is half-closed by design</text>

  <rect x="60" y="100" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Inspection</text>
  <text x="160" y="146" text-anchor="middle" font-size="11" fill="#64748b">Recognition + Prediction</text>
  <text x="160" y="161" text-anchor="middle" font-size="11" fill="#64748b">+ Automation judgments</text>

  <line x1="260" y1="135" x2="305" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="100" width="200" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Guardrail</text>
  <text x="410" y="146" text-anchor="middle" font-size="11" fill="#78350f">rule-based · threshold = 0.70</text>
  <text x="410" y="161" text-anchor="middle" font-size="11" fill="#78350f">low_confidence → HITL</text>

  <line x1="510" y1="135" x2="555" y2="135" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="560" y="100" width="200" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">HITL queue</text>
  <text x="660" y="146" text-anchor="middle" font-size="11" fill="#991b1b">status = hitl_pending</text>
  <text x="660" y="161" text-anchor="middle" font-size="11" fill="#991b1b">operator review required</text>

  <line x1="760" y1="135" x2="805" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="810" y="100" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="910" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Operator</text>
  <text x="910" y="146" text-anchor="middle" font-size="11" fill="#64748b">approve / reject + reason</text>
  <text x="910" y="161" text-anchor="middle" font-size="11" fill="#64748b">stored as fact</text>

  <path d="M 910 170 L 910 210 L 660 210 L 660 245" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="430" y="245" width="460" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Learning Agent</text>
  <text x="660" y="289" text-anchor="middle" font-size="11" fill="#1e3a8a">tool: analyze_hitl_history (approval/rejection rates, trend)</text>
  <text x="660" y="305" text-anchor="middle" font-size="11" fill="#1e3a8a">tool: suggest_threshold_adjustment (FP/FN rates → +/− delta)</text>
  <text x="660" y="321" text-anchor="middle" font-size="11" fill="#1e3a8a">tool: recommend_rule_updates (rejection patterns → rule diff)</text>
  <text x="660" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#1e3a8a">judgment ∈ {NO_ACTION_NEEDED, ADJUSTMENT_RECOMMENDED, CRITICAL_REVIEW_NEEDED}</text>

  <line x1="430" y1="295" x2="385" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="160" y="265" width="225" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="272" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Suggestion (output only)</text>
  <text x="272" y="306" text-anchor="middle" font-size="11" fill="#065f46">{ suggested_threshold: 0.74,</text>
  <text x="272" y="320" text-anchor="middle" font-size="11" fill="#065f46">  reason, expected_impact }</text>

  <line x1="272" y1="325" x2="272" y2="385" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dim)"/>
  <text x="295" y="358" text-anchor="start" font-size="10" font-style="italic" fill="#94a3b8">no auto-apply ·</text>
  <text x="295" y="372" text-anchor="start" font-size="10" font-style="italic" fill="#94a3b8">no DB write</text>

  <rect x="155" y="390" width="235" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="272" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Operator (manual)</text>
  <text x="272" y="430" text-anchor="middle" font-size="11" fill="#64748b">edits .env / config_overrides</text>

  <line x1="272" y1="445" x2="272" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="155" y="505" width="235" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="272" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Updated threshold</text>
  <text x="272" y="545" text-anchor="middle" font-size="11" fill="#78350f">applied on next inspection</text>

  <path d="M 155 532 C 80 532, 80 135, 60 135" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <text x="35" y="335" text-anchor="middle" font-size="10" font-style="italic" fill="#78350f" transform="rotate(-90 35 335)">feeds back into Guardrail (next cycle)</text>

  <rect x="430" y="380" width="600" height="180" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="730" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Why half-closed (verified in code)</text>
  <text x="450" y="430" font-size="11" fill="#713f12">• threshold_tuner.py returns dict {suggested_threshold, adjustment, reason}</text>
  <text x="450" y="448" font-size="11" fill="#713f12">  — no DB write, no config write, no state mutation</text>
  <text x="450" y="468" font-size="11" fill="#713f12">• hitl_analyzer.py: pure analytics function (returns rates / trend)</text>
  <text x="450" y="486" font-size="11" fill="#713f12">• grep "suggest_threshold_adjustment": 6 references = tests + stub + tuner</text>
  <text x="450" y="504" font-size="11" fill="#713f12">  itself + agent registry. No consumer applies the suggestion.</text>
  <text x="450" y="525" font-size="11" font-style="italic" fill="#713f12">Design rationale: keeps the LLM out of the safety-critical write path.</text>
  <text x="450" y="542" font-size="11" font-style="italic" fill="#713f12">Adaptation = parameter only. Logic and rules stay human-authored.</text>
</svg>
