<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="m-blue" markerWidth="9" markerHeight="9" refX="6.2" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1772d0"/>
    </marker>
    <marker id="m-gray" markerWidth="9" markerHeight="9" refX="6.2" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="44" y="56" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-0.3">The AI suggests; a <tspan fill="#1772d0">human</tspan> applies.</text>

  <!-- ===== GRAY LOOP: hairline ring through 5 nodes ===== -->
  <!-- ring forward arcs (gray) -->
  <g stroke="#e6e9ee" stroke-width="2.4" fill="none">
    <path d="M308 150 C 372 134, 458 134, 520 150" marker-end="url(#m-gray)"/>
    <path d="M636 196 C 676 232, 676 286, 644 326" marker-end="url(#m-gray)"/>
    <path d="M530 360 C 466 380, 372 380, 300 360" marker-end="url(#m-gray)"/>
    <path d="M196 312 C 168 274, 168 222, 188 184" marker-end="url(#m-gray)"/>
  </g>

  <!-- ===== GRAY NODES ===== -->
  <!-- Inspect (top-left) -->
  <circle cx="244" cy="160" r="44" fill="#ffffff" stroke="#e6e9ee" stroke-width="2"/>
  <text x="244" y="166" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">Inspect</text>

  <!-- Suggestion (top-right) -->
  <circle cx="592" cy="160" r="44" fill="#ffffff" stroke="#e6e9ee" stroke-width="2"/>
  <text x="592" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="#6b7280">Suggestion</text>

  <!-- Learning (bottom-right) -->
  <circle cx="592" cy="356" r="44" fill="#ffffff" stroke="#e6e9ee" stroke-width="2"/>
  <text x="592" y="362" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">Learning</text>

  <!-- Human (bottom-left) -->
  <circle cx="244" cy="356" r="44" fill="#ffffff" stroke="#e6e9ee" stroke-width="2"/>
  <text x="244" y="362" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">Human</text>

  <!-- Guardrail (center hub, gray secondary node) -->
  <circle cx="418" cy="258" r="50" fill="#ffffff" stroke="#e6e9ee" stroke-width="2"/>
  <text x="418" y="264" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">Guardrail</text>

  <!-- ===== ORANGE: the BLOCKED machine path (Suggestion -> Guardrail, broken) ===== -->
  <!-- gray auto-path stub leaving Suggestion downward toward Guardrail, then BREAK -->
  <path d="M592 204 L 592 234 L 504 234" stroke="#e6e9ee" stroke-width="2.4" fill="none"/>
  <!-- the orange break mark across the path -->
  <g stroke="#e8833a" stroke-width="3.4" stroke-linecap="round">
    <line x1="492" y1="222" x2="508" y2="246"/>
    <line x1="508" y1="222" x2="492" y2="246"/>
  </g>
  <text x="600" y="228" font-size="15" fill="#e8833a" font-weight="600" letter-spacing="0.2">no auto-apply</text>

  <!-- ===== BLUE FOCAL: the human-applies link (Human -> Guardrail) ===== -->
  <path d="M285 326 C 322 300, 350 290, 376 276" stroke="#1772d0" stroke-width="4" fill="none" marker-end="url(#m-blue)"/>
  <circle cx="334" cy="301" r="6" fill="#1772d0"/>
  <text x="232" y="430" font-size="18" font-weight="700" fill="#1772d0" letter-spacing="0.2">human applies</text>

  <!-- ===== EDITORIAL CAPTION ===== -->
  <text x="44" y="92" font-size="14" fill="#6b7280" letter-spacing="0.2">No model output ever writes a threshold.</text>
</svg>
