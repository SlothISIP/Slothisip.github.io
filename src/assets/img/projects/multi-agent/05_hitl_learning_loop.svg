<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="hl-blue" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="hl-orange" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#f09228"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="36" y="46" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-.3">The AI suggests, a human applies</text>
  <rect x="36" y="56" width="392" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="36" y="84" font-size="15" fill="#64748b">No model output ever writes a threshold.</text>

  <!-- ===== FORWARD CHAIN: 5 nodes ===== -->
  <!-- blue forward arrows -->
  <line x1="180" y1="170" x2="206" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#hl-blue)"/>
  <line x1="376" y1="170" x2="402" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#hl-blue)"/>
  <line x1="556" y1="170" x2="582" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#hl-blue)"/>
  <line x1="736" y1="170" x2="762" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#hl-blue)"/>

  <!-- Node 1: Inspect -->
  <rect x="36" y="138" width="144" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="108" y="178" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Inspect</text>

  <!-- Node 2: Guardrail -->
  <rect x="207" y="138" width="169" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="291" y="178" text-anchor="middle" font-size="21" font-weight="800" fill="#1e3a8a">Guardrail</text>

  <!-- Node 3: Human -->
  <rect x="403" y="138" width="153" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="479" y="178" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Human</text>

  <!-- Node 4: Learning -->
  <rect x="583" y="138" width="153" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="659" y="178" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Learning</text>

  <!-- Node 5: Suggestion (ORANGE FOCAL) -->
  <rect x="763" y="138" width="161" height="64" rx="12" fill="#fef3c7" stroke="#f09228" stroke-width="3"/>
  <text x="843" y="178" text-anchor="middle" font-size="21" font-weight="800" fill="#b45309">Suggestion</text>

  <!-- ===== BLOCKED MACHINE PATH (centerpiece) ===== -->
  <!-- grey auto path drops from Suggestion, runs left toward Guardrail, CUT by red break -->
  <path d="M 843 202 L 843 300 L 470 300" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <!-- the red barrier -->
  <line x1="470" y1="300" x2="300" y2="300" stroke="#dc2626" stroke-width="3" stroke-dasharray="4 11" stroke-linecap="round"/>
  <rect x="318" y="276" width="222" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/>
  <text x="429" y="308" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">no auto-apply</text>
  <!-- dead-end stub showing the auto path can't reach Guardrail -->
  <line x1="300" y1="300" x2="291" y2="300" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ALLOWED HUMAN PATH ===== -->
  <!-- orange solid arrow from Human, around the bottom, back up into Guardrail -->
  <path d="M 479 202 L 479 240 L 150 240 L 150 420 L 291 420 L 291 204" stroke="#f09228" stroke-width="3.4" fill="none" marker-end="url(#hl-orange)"/>
  <rect x="206" y="396" width="218" height="48" rx="24" fill="#fef3c7" stroke="#f09228" stroke-width="2.6"/>
  <text x="315" y="428" text-anchor="middle" font-size="22" font-weight="800" fill="#b45309">Human applies</text>
</svg>
