<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Plug-in physics priors</text>
  <rect x="40" y="56" width="208" height="4" rx="2" fill="#1772d0"/>
  <text x="40" y="80" font-size="13" fill="#64748b">An abstract PhysicsPrior interface socketing into one fixed Bayesian Optimization core engine</text>

  <!-- ===== BO core engine (fixed, emphasized) ===== -->
  <rect x="406" y="118" width="288" height="166" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="146" font-size="16.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">BO core engine</text>
  <text x="550" y="166" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-style="italic">fixed &#183; shared across all processes</text>

  <rect x="430" y="180" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="197" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">GP surrogate</text>
  <text x="550" y="212" font-size="11" fill="#475569" text-anchor="middle">Matern 5/2 + ARD</text>

  <rect x="430" y="228" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="245" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Acquisition</text>
  <text x="550" y="260" font-size="11" fill="#475569" text-anchor="middle">EI &#183; UCB &#183; KG</text>

  <!-- Socket / slot on the left edge of the core -->
  <rect x="392" y="178" width="20" height="92" rx="4" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="397" y1="190" x2="397" y2="258" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="402" y1="190" x2="402" y2="258" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="407" y1="190" x2="407" y2="258" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="402" y="296" font-size="10.5" fill="#64748b" text-anchor="middle" font-style="italic">socket</text>

  <!-- ===== Four interchangeable PhysicsPrior cards ===== -->
  <text x="60" y="150" font-size="13" font-weight="700" fill="#0f172a">AbstractPhysicsPrior &#8212; interchangeable modules</text>

  <!-- card 1 -->
  <g>
    <rect x="60" y="166" width="300" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="166" width="6" height="46" rx="3" fill="#f09228"/>
    <text x="80" y="186" font-size="12.5" font-weight="700" fill="#0f172a">Injection Molding</text>
    <text x="80" y="203" font-size="11" fill="#475569">glass-transition constraint + shrinkage model</text>
    <rect x="360" y="184" width="14" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="60" y="220" width="300" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="220" width="6" height="46" rx="3" fill="#f09228"/>
    <text x="80" y="240" font-size="12.5" font-weight="700" fill="#0f172a">CNC Milling</text>
    <text x="80" y="257" font-size="11" fill="#475569">Taylor-type tool-wear law</text>
    <rect x="360" y="238" width="14" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="60" y="274" width="300" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="274" width="6" height="46" rx="3" fill="#f09228"/>
    <text x="80" y="294" font-size="12.5" font-weight="700" fill="#0f172a">Laser Welding</text>
    <text x="80" y="311" font-size="11" fill="#475569">penetration-depth relations</text>
    <rect x="360" y="292" width="14" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="60" y="328" width="300" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="328" width="6" height="46" rx="3" fill="#f09228"/>
    <text x="80" y="348" font-size="12.5" font-weight="700" fill="#0f172a">3D Printing</text>
    <text x="80" y="365" font-size="11" fill="#475569">multi-output constraints (qEHVI MOBO)</text>
    <rect x="360" y="346" width="14" height="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>

  <!-- plug-in edges into socket -->
  <path d="M374,189 C 388,189 384,214 391,214" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M374,243 C 386,243 386,221 391,221" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M374,297 C 386,297 386,227 391,227" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M374,351 C 390,351 384,234 391,234" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- physics-informed mean biases the posterior -->
  <text x="708" y="200" font-size="11.5" fill="#475569">biases the GP posterior</text>
  <text x="708" y="216" font-size="11.5" fill="#475569">via a physics-informed</text>
  <text x="708" y="232" font-size="11.5" fill="#475569">mean function</text>
  <path d="M694,210 C 702,210 700,206 706,206" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <!-- Empirical-Bayes note (amber) -->
  <rect x="708" y="252" width="356" height="62" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="724" y="274" font-size="12" font-weight="700" fill="#78350f">Empirical-Bayes weighting</text>
  <text x="724" y="292" font-size="11" fill="#78350f">auto-tunes each prior's influence by data</text>
  <text x="724" y="307" font-size="11" fill="#78350f">volume &#8212; the prior fades as evidence grows.</text>

  <!-- caption node: a new process = one new module -->
  <rect x="60" y="420" width="1004" height="64" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="84" y="446" font-size="14" font-weight="700" fill="#065f46">A new process = one new module.</text>
  <text x="84" y="468" font-size="12.5" fill="#065f46">The shared surrogate, acquisition, and API layers stay untouched &#8212; only a mean function + constraints + empirical weighting ship per process.</text>

  <!-- honesty caveat -->
  <rect x="60" y="510" width="1004" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="84" y="537" font-size="11.5" fill="#64748b" font-style="italic">Personal R&amp;D project; the laser-welding prior ships the interface but is unvalidated. Injection-molding, CNC, and 3D-printing priors were validated on open / Kaggle datasets, not deployed in production.</text>
</svg>
