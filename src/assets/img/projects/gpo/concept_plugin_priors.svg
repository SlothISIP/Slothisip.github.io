<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue phrase) ===== -->
  <text x="48" y="72" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Four physics priors, <tspan fill="#1772d0">one fixed core</tspan>.</text>

  <!-- ============ STRUCTURE: gray hairlines from four prior sockets into the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M300 160 C 430 160, 392 256, 424 256"/>
    <path d="M300 224 C 430 224, 392 256, 424 256"/>
    <path d="M300 288 C 430 288, 392 256, 424 256"/>
    <path d="M300 352 C 430 352, 392 256, 424 256"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="296" cy="160" r="3"/>
    <circle cx="296" cy="224" r="3"/>
    <circle cx="296" cy="288" r="3"/>
    <circle cx="296" cy="352" r="3"/>
  </g>

  <!-- inbound prior sockets (muted gray) -->
  <text x="56" y="166" font-size="18" font-weight="600" fill="#6b7280">Injection molding</text>
  <text x="56" y="230" font-size="18" font-weight="600" fill="#6b7280">CNC milling</text>
  <text x="56" y="294" font-size="18" font-weight="600" fill="#6b7280">Laser welding</text>
  <text x="56" y="358" font-size="18" font-weight="600" fill="#6b7280">3D printing</text>

  <!-- ============ THE ONE BLUE FOCAL: the BO core engine ============ -->
  <circle cx="500" cy="256" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="256" r="76" fill="#1772d0"/>
  <text x="500" y="244" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.2" fill="#ffffff">BO core</text>
  <text x="500" y="272" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">GP · Matérn 5/2</text>
  <text x="500" y="294" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">EI · UCB · KG</text>

  <!-- outbound hairline to the focal outcome -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 256 C 680 256, 700 256, 760 256"/>
  </g>

  <!-- ============ ONE ORANGE BEAT: the physics-informed mean ============ -->
  <circle cx="762" cy="256" r="6" fill="#e8833a"/>
  <text x="780" y="251" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">Physics-informed</text>
  <text x="780" y="274" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">GP mean</text>

  <!-- quiet swap label under the sockets -->
  <text x="56" y="420" font-size="15" font-weight="600" fill="#6b7280">one shared surrogate · interchangeable PhysicsPrior modules</text>
</svg>
