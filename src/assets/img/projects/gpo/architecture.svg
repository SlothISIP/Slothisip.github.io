<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .layer { fill: #fafbfc; stroke: #d0d7de; stroke-width: 1; }
    .layer-label { fill: #57606a; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .box { stroke: #1f6feb; stroke-width: 1.5; fill: #ddf4ff; }
    .box-data { stroke: #9a6700; stroke-width: 1.5; fill: #fff8c5; }
    .box-compute { stroke: #1a7f37; stroke-width: 1.5; fill: #dafbe1; }
    .box-obs { stroke: #8250df; stroke-width: 1.5; fill: #fbefff; }
    .title { font-weight: 700; font-size: 13px; fill: #1f2328; }
    .subtitle { font-size: 11px; fill: #57606a; }
    .arrow { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .arrow-ws { fill: none; stroke: #1a7f37; stroke-width: 1.5; stroke-dasharray: 4,3; marker-end: url(#arrowhead-ws); }
    .port { font-size: 10px; fill: #57606a; font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowhead-ws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- Client Layer -->
  <rect class="layer" x="10" y="10" width="940" height="70" rx="6"/>
  <text class="layer-label" x="20" y="28">CLIENT</text>
  <rect class="box" x="360" y="34" width="240" height="40" rx="4"/>
  <text class="title" x="480" y="51" text-anchor="middle">Browser</text>
  <text class="subtitle" x="480" y="66" text-anchor="middle">React + Vite + Plotly (13 components)</text>

  <!-- Arrow down: Browser -> Web -->
  <path class="arrow" d="M 480 74 L 480 108"/>
  <text class="port" x="490" y="95">HTTPS / WSS</text>

  <!-- Web Layer -->
  <rect class="layer" x="10" y="110" width="940" height="60" rx="6"/>
  <text class="layer-label" x="20" y="128">WEB</text>
  <rect class="box" x="360" y="128" width="240" height="36" rx="4"/>
  <text class="title" x="480" y="144" text-anchor="middle">gpo-web (nginx)</text>
  <text class="subtitle" x="480" y="158" text-anchor="middle">reverse proxy &#183; :3000</text>

  <!-- Arrow down: Web -> API -->
  <path class="arrow" d="M 480 164 L 480 202"/>

  <!-- API Layer -->
  <rect class="layer" x="10" y="200" width="940" height="95" rx="6"/>
  <text class="layer-label" x="20" y="218">API</text>
  <rect class="box" x="180" y="222" width="600" height="64" rx="4"/>
  <text class="title" x="480" y="240" text-anchor="middle">gpo-api (FastAPI :8000)</text>
  <text class="subtitle" x="480" y="256" text-anchor="middle">9 routers &#183; JWT auth &#183; WebSocket relay</text>
  <text class="subtitle" x="480" y="272" text-anchor="middle">auth &#183; oauth &#183; experiments &#183; data &#183; billing &#183; usage &#183; webhooks &#183; websocket &#183; metrics</text>

  <!-- Arrows from API to Data Layer -->
  <path class="arrow" d="M 280 286 L 170 326"/>
  <path class="arrow" d="M 480 286 L 480 326"/>
  <path class="arrow" d="M 680 286 L 770 326"/>

  <!-- Data + Compute Layer -->
  <rect class="layer" x="10" y="320" width="940" height="110" rx="6"/>
  <text class="layer-label" x="20" y="338">DATA &amp; COMPUTE</text>

  <!-- Postgres -->
  <rect class="box-data" x="60" y="342" width="220" height="66" rx="4"/>
  <text class="title" x="170" y="361" text-anchor="middle">PostgreSQL</text>
  <text class="subtitle" x="170" y="376" text-anchor="middle">+ TimescaleDB (pg16)</text>
  <text class="subtitle" x="170" y="392" text-anchor="middle">experiments, GP checkpoints,</text>
  <text class="subtitle" x="170" y="404" text-anchor="middle">Alembic migrations &#183; :5433</text>

  <!-- Redis (center) -->
  <rect class="box-data" x="370" y="342" width="220" height="66" rx="4"/>
  <text class="title" x="480" y="361" text-anchor="middle">Redis (7-alpine)</text>
  <text class="subtitle" x="480" y="376" text-anchor="middle">Celery broker &#183; pub/sub</text>
  <text class="subtitle" x="480" y="392" text-anchor="middle">progress stream &#183; 2 GB cache</text>
  <text class="subtitle" x="480" y="404" text-anchor="middle">:6380</text>

  <!-- Celery Worker -->
  <rect class="box-compute" x="680" y="342" width="220" height="66" rx="4"/>
  <text class="title" x="790" y="361" text-anchor="middle">Celery Worker (GPU)</text>
  <text class="subtitle" x="790" y="376" text-anchor="middle">BoTorch / GPyTorch</text>
  <text class="subtitle" x="790" y="392" text-anchor="middle">CUDA 12.4 &#183; prefork &#215;2</text>
  <text class="subtitle" x="790" y="404" text-anchor="middle">async BO iterations</text>

  <!-- Redis <-> Worker (pub/sub) -->
  <path class="arrow-ws" d="M 590 375 L 680 375"/>
  <text class="port" x="635" y="369" text-anchor="middle" fill="#1a7f37">pub/sub</text>

  <!-- WebSocket progress back to API (curved) -->
  <path class="arrow-ws" d="M 480 342 Q 480 300 480 286"/>

  <!-- Observability Layer (separate box, right side) -->
  <rect class="layer" x="10" y="450" width="940" height="100" rx="6"/>
  <text class="layer-label" x="20" y="468">OBSERVABILITY</text>

  <rect class="box-obs" x="200" y="472" width="170" height="60" rx="4"/>
  <text class="title" x="285" y="490" text-anchor="middle">Prometheus</text>
  <text class="subtitle" x="285" y="506" text-anchor="middle">metrics scrape</text>
  <text class="subtitle" x="285" y="520" text-anchor="middle">:9090</text>

  <rect class="box-obs" x="410" y="472" width="170" height="60" rx="4"/>
  <text class="title" x="495" y="490" text-anchor="middle">Alertmanager</text>
  <text class="subtitle" x="495" y="506" text-anchor="middle">alert routing</text>
  <text class="subtitle" x="495" y="520" text-anchor="middle">:9093</text>

  <rect class="box-obs" x="620" y="472" width="170" height="60" rx="4"/>
  <text class="title" x="705" y="490" text-anchor="middle">Grafana</text>
  <text class="subtitle" x="705" y="506" text-anchor="middle">dashboards</text>
  <text class="subtitle" x="705" y="520" text-anchor="middle">:3001</text>

  <!-- Prometheus -> API (dashed up) -->
  <path class="arrow" d="M 285 472 Q 285 440 285 300 Q 285 290 380 280" stroke-dasharray="3,3"/>
  <text class="port" x="220" y="450">scrape /metrics</text>

  <!-- Prometheus -> Alertmanager -->
  <path class="arrow" d="M 370 502 L 410 502"/>
  <!-- Prometheus -> Grafana -->
  <path class="arrow" d="M 370 518 Q 500 545 620 518"/>

  <!-- Legend -->
  <g transform="translate(790, 10)">
    <rect x="0" y="0" width="160" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text class="subtitle" x="8" y="14" font-weight="600">Legend</text>
    <line x1="10" y1="26" x2="30" y2="26" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text class="subtitle" x="36" y="30">HTTP / sync call</text>
    <line x1="10" y1="42" x2="30" y2="42" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-ws)"/>
    <text class="subtitle" x="36" y="46">pub/sub &#183; WebSocket</text>
  </g>
</svg>
