<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Sync control plane, async <tspan fill="#1772d0">compute</tspan>.</text>

  <!-- ============ STRUCTURE: gray hairline service skeleton ============ -->

  <!-- inbound converging hairlines (the sync request path) -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 168 C 350 168, 386 256, 424 256"/>
    <path d="M214 220 C 350 220, 386 256, 424 256"/>
    <path d="M214 272 C 350 272, 386 256, 424 256"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="168" r="3"/>
    <circle cx="210" cy="220" r="3"/>
    <circle cx="210" cy="272" r="3"/>
  </g>
  <text x="56" y="174" font-size="18" font-weight="600" fill="#6b7280">React client</text>
  <text x="56" y="226" font-size="18" font-weight="600" fill="#6b7280">nginx web</text>
  <text x="56" y="278" font-size="18" font-weight="600" fill="#6b7280">FastAPI API</text>

  <!-- outbound hairlines: focal -> data stores + the async beat -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 256 C 636 256, 658 184, 684 184"/>
    <path d="M576 256 C 636 256, 658 256, 684 256"/>
  </g>
  <!-- the one orange async path (queue -> worker) -->
  <path d="M576 256 C 636 256, 658 372, 684 372" stroke="#e8833a" stroke-width="2" stroke-dasharray="5 4" fill="none"/>

  <!-- ============ THE ONE BLUE FOCAL: Redis broker handing off to GPU compute ============ -->
  <circle cx="500" cy="256" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="256" r="76" fill="#1772d0"/>
  <text x="500" y="250" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.2" fill="#ffffff">Redis</text>
  <text x="500" y="278" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">queue · pub/sub</text>

  <!-- ============ OUTCOMES (gray stores; the async BO worker is the lone orange) ============ -->
  <circle cx="684" cy="184" r="5" fill="#6b7280"/>
  <text x="702" y="190" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">PostgreSQL + TimescaleDB</text>

  <circle cx="684" cy="256" r="5" fill="#6b7280"/>
  <text x="702" y="262" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">Prometheus · Grafana</text>

  <circle cx="684" cy="372" r="6" fill="#e8833a"/>
  <text x="702" y="367" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">GPU Celery worker</text>
  <text x="702" y="389" font-size="14" font-weight="600" fill="#e8833a" letter-spacing="0.2">long Bayesian-optimization jobs</text>
</svg>
