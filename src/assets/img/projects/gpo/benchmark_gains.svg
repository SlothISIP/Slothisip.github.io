<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (one blue word) ===== -->
  <text x="40" y="60" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-.3">Fewer experiments to the <tspan fill="#1772d0">optimum</tspan>.</text>

  <!-- ===== AXIS: gray hairline baseline, 240..900 maps 0..40 (16.5px / iteration) ===== -->
  <g stroke="#e6e9ee" stroke-width="1.2">
    <line x1="240" y1="128" x2="240" y2="318"/>
    <line x1="405" y1="128" x2="405" y2="318"/>
    <line x1="570" y1="128" x2="570" y2="318"/>
    <line x1="735" y1="128" x2="735" y2="318"/>
    <line x1="900" y1="128" x2="900" y2="318"/>
  </g>
  <line x1="240" y1="318" x2="900" y2="318" stroke="#e6e9ee" stroke-width="1.5"/>

  <!-- ===== BARS ===== -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- Random search 35.1 (muted gray, the par baseline) -->
    <text x="225" y="156" font-size="14" font-weight="600" fill="#6b7280" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">Random search</text>
    <rect x="240" y="138" width="579.15" height="32" rx="4" fill="#eef0f3" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="805" y="159" font-size="14" font-weight="700" fill="#6b7280" text-anchor="end">35.1</text>

    <!-- Bayesian optimization 14.8 (blue) -->
    <text x="225" y="216" font-size="14" font-weight="600" fill="#0f172a" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">Bayesian optimization</text>
    <rect x="240" y="198" width="244.2" height="32" rx="4" fill="#cfe2f7" stroke="#1772d0" stroke-width="1.5"/>
    <text x="498" y="219" font-size="14" font-weight="700" fill="#1772d0" text-anchor="start">14.8</text>

    <!-- BO + physics-prior 8.8 (ORANGE FOCAL — best) -->
    <text x="225" y="276" font-size="14" font-weight="800" fill="#0f172a" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif">BO + physics-prior</text>
    <rect x="240" y="258" width="145.2" height="32" rx="4" fill="#e8833a" opacity="0.16"/>
    <rect x="240" y="258" width="145.2" height="32" rx="4" fill="none" stroke="#e8833a" stroke-width="2.2"/>
    <text x="399" y="279" font-size="14.5" font-weight="800" fill="#e8833a" text-anchor="start">8.8</text>
    <rect x="438" y="262" width="50" height="24" rx="12" fill="none" stroke="#e8833a" stroke-width="1.6"/>
    <text x="463" y="278" font-size="11.5" font-weight="800" fill="#e8833a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">best</text>
  </g>

  <!-- ===== GAINS STRIP (three chips; transfer chip recolored green -> ink/blue) ===== -->
  <g>
    <rect x="40" y="376" width="293" height="56" rx="8" fill="#f8fafc" stroke="#e6e9ee" stroke-width="1.2"/>
    <text x="60" y="404" font-size="20" font-weight="800" fill="#1772d0" font-family="ui-monospace, Menlo, Consolas, monospace">2.38x</text>
    <text x="140" y="402" font-size="12" font-weight="600" fill="#6b7280">fewer iterations than random</text>

    <rect x="349" y="376" width="262" height="56" rx="8" fill="#e8833a" opacity="0.08"/>
    <rect x="349" y="376" width="262" height="56" rx="8" fill="none" stroke="#e8833a" stroke-width="1.4"/>
    <text x="369" y="404" font-size="20" font-weight="800" fill="#e8833a" font-family="ui-monospace, Menlo, Consolas, monospace">+40.7%</text>
    <text x="461" y="402" font-size="12" font-weight="600" fill="#6b7280">fewer with physics prior</text>

    <rect x="627" y="376" width="293" height="56" rx="8" fill="#f8fafc" stroke="#e6e9ee" stroke-width="1.2"/>
    <text x="647" y="404" font-size="20" font-weight="800" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">-65.7%</text>
    <text x="740" y="402" font-size="12" font-weight="600" fill="#6b7280">regret, transfer PP&#8594;ABS</text>
  </g>
</svg>
