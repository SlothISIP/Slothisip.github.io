<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a" letter-spacing="-.3">Fewer experiments to the optimum</text>
  <rect x="40" y="55" width="262" height="3.5" rx="1.75" fill="#1772d0"/>
  <text x="40" y="79" font-size="13" fill="#64748b">Iterations to 90% convergence on the open injection-molding benchmark (n=20).</text>

  <!-- ===== BAR CHART ===== -->
  <!-- x-axis geometry: track 240..980 maps 0..40 iterations (18.5px per iteration) -->
  <!-- shared x-axis baseline -->
  <line x1="240" y1="306" x2="980" y2="306" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- gridlines + axis ticks (0,10,20,30,40) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="240" y1="124" x2="240" y2="306"/>
    <line x1="425" y1="124" x2="425" y2="306"/>
    <line x1="610" y1="124" x2="610" y2="306"/>
    <line x1="795" y1="124" x2="795" y2="306"/>
    <line x1="980" y1="124" x2="980" y2="306"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="240" y="324">0</text>
    <text x="425" y="324">10</text>
    <text x="610" y="324">20</text>
    <text x="795" y="324">30</text>
    <text x="980" y="324">40</text>
  </g>
  <text x="610" y="346" font-size="11.5" fill="#64748b" text-anchor="middle" letter-spacing=".3">iterations to 90% convergence  &#183;  fewer is better &#8594;</text>

  <!-- Row 1: Random search 35.1 -->
  <text x="225" y="156" font-size="14" font-weight="600" fill="#0f172a" text-anchor="end">Random search</text>
  <rect x="240" y="138" width="649.35" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="877" y="158" font-size="13" font-weight="700" fill="#475569" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">35.1</text>

  <!-- Row 2: vanilla BO 14.8 -->
  <text x="225" y="216" font-size="14" font-weight="600" fill="#0f172a" text-anchor="end">Bayesian optimization</text>
  <rect x="240" y="198" width="273.8" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="525" y="218" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">14.8</text>

  <!-- Row 3: BO + physics-prior 8.8  (ORANGE FOCAL — best) -->
  <text x="225" y="276" font-size="14" font-weight="800" fill="#0f172a" text-anchor="end">BO + physics-prior</text>
  <rect x="240" y="258" width="162.8" height="30" rx="4" fill="#fde68a" stroke="#f09228" stroke-width="2"/>
  <text x="414" y="278" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">8.8</text>
  <!-- focal "best" tag -->
  <rect x="455" y="262" width="46" height="21" rx="10.5" fill="#fef3c7" stroke="#f09228" stroke-width="1.4"/>
  <text x="478" y="277" font-size="11" font-weight="800" fill="#78350f" text-anchor="middle">best</text>

  <!-- ===== GAINS CALLOUT STRIP ===== -->
  <!-- three gain chips on one row -->
  <g>
    <!-- chip 1: BO vs random -->
    <rect x="40" y="368" width="320" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="60" y="392" font-size="19" font-weight="800" fill="#1e3a8a" font-family="ui-monospace, Menlo, Consolas, monospace">2.38x</text>
    <text x="140" y="388" font-size="11.5" font-weight="700" fill="#475569">fewer iterations than random</text>
    <text x="140" y="404" font-size="11.5" fill="#64748b">(Bayesian optimization)</text>

    <!-- chip 2: physics prior gain (ORANGE accent text) -->
    <rect x="372" y="368" width="320" height="52" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.4"/>
    <text x="392" y="392" font-size="19" font-weight="800" fill="#b45309" font-family="ui-monospace, Menlo, Consolas, monospace">+40.7%</text>
    <text x="484" y="388" font-size="11.5" font-weight="700" fill="#78350f">fewer again with the</text>
    <text x="484" y="404" font-size="11.5" fill="#b45309">physics prior</text>

    <!-- chip 3: transfer -->
    <rect x="704" y="368" width="356" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="724" y="392" font-size="19" font-weight="800" fill="#16a34a" font-family="ui-monospace, Menlo, Consolas, monospace">-65.7%</text>
    <text x="822" y="388" font-size="11.5" font-weight="700" fill="#475569">simple regret, transfer PP&#8594;ABS</text>
    <text x="822" y="404" font-size="11.5" fill="#64748b">at iteration 15</text>
  </g>

  <!-- ===== HONESTY FOOTER ===== -->
  <rect x="40" y="430" width="1020" height="30" rx="8" fill="#f8f9fa"/>
  <text x="56" y="449" font-size="11" font-style="italic" fill="#64748b">Open <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-style="normal">B2SHARE/EUDAT</tspan> injection-molding benchmark (564 cycles, 4-D), n=20 repeats &#8212; not a production line.</text>
</svg>
