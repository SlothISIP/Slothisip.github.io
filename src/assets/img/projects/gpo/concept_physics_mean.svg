<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue phrase) ===== -->
  <text x="48" y="64" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">The <tspan fill="#1772d0">prior mean</tspan> bends the GP posterior.</text>

  <!-- ===== PLOT FRAME: gray hairline scaffolding ===== -->
  <line x1="120" y1="360" x2="900" y2="360" stroke="#e6e9ee" stroke-width="1.5"/>
  <line x1="120" y1="120" x2="120" y2="360" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="510" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">process parameter x</text>
  <text x="108" y="116" text-anchor="end" font-size="15" font-weight="600" fill="#6b7280">response</text>

  <!-- ===== flat mean = 0 reference (quiet gray dashed) ===== -->
  <line x1="120" y1="300" x2="900" y2="300" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="900" y="304" text-anchor="end" font-size="14" font-weight="600" fill="#6b7280">mean = 0</text>

  <!-- ===== narrow blue uncertainty band hugging the physics curve ===== -->
  <path d="M120 196
           C 230 168, 360 196, 510 250
           C 660 304, 790 338, 900 350
           L 900 392
           C 790 384, 660 348, 510 292
           C 360 236, 230 214, 120 240 Z"
        fill="#cfe2f7" opacity="0.7"/>

  <!-- ===== THE ONE BLUE FOCAL: physics-informed prior mean curve ===== -->
  <path d="M120 218
           C 230 191, 360 205, 510 271
           C 660 321, 790 345, 900 371"
        fill="none" stroke="#1772d0" stroke-width="3.5"/>

  <!-- focal node on the prior-mean curve + faint halo -->
  <circle cx="510" cy="271" r="74" fill="#1772d0" opacity="0.06"/>
  <circle cx="510" cy="271" r="9" fill="#1772d0"/>
  <text x="510" y="206" text-anchor="middle" font-size="18" font-weight="800" fill="#1772d0">physics prior mean &#956;(x)</text>

  <!-- ===== observations sit close to the curve (ink dots) ===== -->
  <circle cx="245" cy="190" r="5" fill="#0f172a"/>
  <circle cx="370" cy="208" r="5" fill="#0f172a"/>
  <circle cx="640" cy="318" r="5" fill="#0f172a"/>
  <circle cx="770" cy="343" r="5" fill="#0f172a"/>

  <!-- ===== EB-weight decay inset (recolored green -> ink/gray) ===== -->
  <text x="120" y="436" font-size="15" font-weight="700" fill="#0f172a">Empirical-Bayes weight w</text>
  <line x1="360" y1="448" x2="360" y2="412" stroke="#e6e9ee" stroke-width="1.5"/>
  <line x1="360" y1="448" x2="640" y2="448" stroke="#e6e9ee" stroke-width="1.5"/>
  <text x="352" y="418" text-anchor="end" font-size="13" font-weight="600" fill="#6b7280">1</text>
  <text x="352" y="452" text-anchor="end" font-size="13" font-weight="600" fill="#6b7280">0</text>
  <path d="M360 414 C 430 422, 470 444, 540 447 C 590 449, 615 448, 638 448"
        fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="652" y="436" font-size="14" font-weight="600" fill="#6b7280">from 1 toward 0 as data accumulates</text>
</svg>
