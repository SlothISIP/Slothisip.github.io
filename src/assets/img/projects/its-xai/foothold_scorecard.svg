<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (one blue phrase) ===== -->
  <text x="48" y="62" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-.3">Every target <tspan fill="#1772d0">met or beaten</tspan>.</text>

  <!-- ===== SCORECARD SCAFFOLD: gray hairlines per row ===== -->
  <g stroke="#e6e9ee" stroke-width="1.5">
    <line x1="48" y1="128" x2="912" y2="128"/>
    <line x1="48" y1="194" x2="912" y2="194"/>
    <line x1="48" y1="260" x2="912" y2="260"/>
    <line x1="48" y1="326" x2="912" y2="326"/>
    <line x1="48" y1="392" x2="912" y2="392"/>
  </g>

  <!-- ROW 1: F1 — the lead metric, orange focal value -->
  <text x="48" y="170" font-size="19" font-weight="600" fill="#0f172a">Meta-classifier F1-score</text>
  <text x="660" y="170" text-anchor="end" font-size="22" font-weight="800" fill="#e8833a">0.9462</text>
  <rect x="700" y="148" width="212" height="34" rx="17" fill="#cfe2f7"/>
  <text x="806" y="171" text-anchor="middle" font-size="16" font-weight="800" fill="#1772d0">PASS +26%</text>

  <!-- ROW 2: latency — blue PASS pill -->
  <text x="48" y="236" font-size="19" font-weight="600" fill="#0f172a">End-to-end /predict latency</text>
  <text x="660" y="236" text-anchor="end" font-size="22" font-weight="800" fill="#0f172a">67.3 ms</text>
  <rect x="700" y="214" width="212" height="34" rx="17" fill="#cfe2f7"/>
  <text x="806" y="237" text-anchor="middle" font-size="16" font-weight="800" fill="#1772d0">PASS &#8722;44%</text>

  <!-- ROW 3: defect recall -->
  <text x="48" y="302" font-size="19" font-weight="600" fill="#0f172a">Defect (FAIL) recall</text>
  <text x="660" y="302" text-anchor="end" font-size="22" font-weight="800" fill="#0f172a">95.91%</text>

  <!-- ROW 4: SHAP explain latency -->
  <text x="48" y="368" font-size="19" font-weight="600" fill="#0f172a">/explain SHAP latency</text>
  <text x="660" y="368" text-anchor="end" font-size="22" font-weight="800" fill="#0f172a">15.6 ms</text>

  <!-- ROW 5: YOLO mAP -->
  <text x="48" y="434" font-size="19" font-weight="600" fill="#0f172a">YOLOv8m mAP@50</text>
  <text x="660" y="434" text-anchor="end" font-size="22" font-weight="800" fill="#0f172a">93.51%</text>
</svg>
