<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Two streams, one <tspan fill="#1772d0">fusion</tspan> verdict.</text>

  <!-- ============ TWO GRAY HAIRLINE STREAMS converging on the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 192 C 360 192, 392 250, 424 250"/>
    <path d="M214 308 C 360 308, 392 250, 424 250"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="192" r="3"/>
    <circle cx="210" cy="308" r="3"/>
  </g>
  <text x="56" y="186" font-size="18" font-weight="700" fill="#6b7280">Random Forest</text>
  <text x="56" y="210" font-size="14" font-weight="600" fill="#6b7280">SECOM &#183; 603 features</text>
  <text x="56" y="302" font-size="18" font-weight="700" fill="#6b7280">YOLO detector</text>
  <text x="56" y="326" font-size="14" font-weight="600" fill="#6b7280">DeepPCB images</text>

  <!-- outbound hairlines to the two outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 250 C 662 250, 690 202, 752 202"/>
    <path d="M576 250 C 662 250, 690 298, 752 298"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the XGBoost meta-classifier ============ -->
  <circle cx="500" cy="250" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="250" r="76" fill="#1772d0"/>
  <text x="500" y="240" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0.2" fill="#ffffff">XGBoost</text>
  <text x="500" y="266" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">meta-classifier</text>
  <text x="500" y="288" text-anchor="middle" font-size="13" letter-spacing="0.2" fill="#cfe2f7">8 fusion features</text>

  <!-- ============ TWO OUTCOMES (DEFECT is the lone orange) ============ -->
  <circle cx="754" cy="202" r="5" fill="#6b7280"/>
  <text x="772" y="208" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.3">PASS</text>
  <circle cx="754" cy="298" r="6" fill="#e8833a"/>
  <text x="772" y="304" font-size="19" font-weight="700" fill="#e8833a" letter-spacing="0.3">DEFECT</text>

  <!-- ============ OUTCOME LINE (quiet, the headline payoff in numbers) ============ -->
  <path d="M214 404 L 470 404" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>
  <circle cx="210" cy="404" r="3" fill="#e6e9ee"/>
  <text x="56" y="409" font-size="15" font-weight="700" fill="#1772d0">F1 0.9462</text>
  <text x="486" y="409" font-size="15" font-weight="600" fill="#6b7280">defect recall 95.91% &#183; 67.3 ms end-to-end (CPU)</text>
</svg>
