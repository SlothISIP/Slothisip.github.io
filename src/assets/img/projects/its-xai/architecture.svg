<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ax-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="ax-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="23" font-weight="800" fill="#0f172a">ITS AI XAI &#183; Explainable PCB Defect-Detection Pipeline</text>
  <rect x="40" y="54" width="118" height="4" rx="2" fill="#1772d0"/>
  <text x="40" y="78" font-size="13" fill="#64748b">Two-stream sensor + vision fusion with an XGBoost meta-classifier and SHAP explanations &#183; F1 0.9462 &#183; 67.3 ms end-to-end (CPU)</text>

  <!-- ============ BAND 1: INPUTS / DATA ============ -->
  <rect x="40" y="104" width="248" height="392" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">INPUTS &#183; OPEN BENCHMARKS</text>

  <!-- Sensor stream input -->
  <rect x="56" y="142" width="216" height="96" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="165" font-size="13" font-weight="700" fill="#1e3a8a">Sensor telemetry</text>
  <text x="72" y="185" font-size="11" fill="#475569">SECOM &#183; 603 features</text>
  <text x="72" y="202" font-size="11" fill="#475569">(590 raw + 13 engineered)</text>
  <text x="72" y="222" font-size="11" fill="#64748b">temperature &#183; pressure &#183; vibration</text>

  <!-- Vision stream input -->
  <rect x="56" y="252" width="216" height="96" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="275" font-size="13" font-weight="700" fill="#1e3a8a">PCB images</text>
  <text x="72" y="295" font-size="11" fill="#475569">DeepPCB defect benchmark</text>
  <text x="72" y="312" font-size="11" fill="#475569">999 train / 501 val image pairs</text>
  <text x="72" y="332" font-size="11" fill="#64748b">visual inspection input</text>

  <!-- Data honesty caveat -->
  <rect x="56" y="362" width="216" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="72" y="385" font-size="11" font-weight="700" fill="#64748b">DATA NOTE</text>
  <text x="72" y="406" font-size="11" fill="#64748b" font-style="italic">SECOM and DeepPCB are open</text>
  <text x="72" y="423" font-size="11" fill="#64748b" font-style="italic">datasets; the sensor&#8594;image</text>
  <text x="72" y="440" font-size="11" fill="#64748b" font-style="italic">pairing is synthetic, built by</text>
  <text x="72" y="457" font-size="11" fill="#64748b" font-style="italic">statistical matching (not a</text>
  <text x="72" y="474" font-size="11" fill="#64748b" font-style="italic">deployed production line).</text>

  <!-- ============ BAND 2: PER-STREAM MODELS ============ -->
  <rect x="312" y="104" width="276" height="392" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="328" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">PER-STREAM MODELS</text>

  <!-- Feature reduction -->
  <rect x="328" y="142" width="244" height="86" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="344" y="165" font-size="13" font-weight="700" fill="#0f172a">Feature reduction</text>
  <text x="344" y="185" font-size="11" fill="#475569">tiered missing-value handling +</text>
  <text x="344" y="202" font-size="11" fill="#475569">importance-based selection</text>
  <text x="344" y="220" font-size="11" font-weight="700" fill="#1772d0">603 &#8594; 164 features (&#8722;72.8%)</text>

  <!-- Random Forest -->
  <rect x="328" y="240" width="244" height="86" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="344" y="263" font-size="13" font-weight="700" fill="#065f46">Random Forest</text>
  <text x="344" y="283" font-size="11" fill="#475569">sensor stream analyzer</text>
  <text x="344" y="300" font-size="11" fill="#475569">SMOTE class balancing</text>
  <text x="344" y="318" font-size="11" fill="#64748b">outputs probability + confidence</text>

  <!-- YOLO -->
  <rect x="328" y="338" width="244" height="142" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="344" y="361" font-size="13" font-weight="700" fill="#065f46">YOLO visual detector</text>
  <text x="344" y="381" font-size="11" fill="#475569">YOLOv8m benchmark &#183; mAP@50 93.51%</text>
  <text x="344" y="398" font-size="11" fill="#475569">(precision 89.74% &#183; recall 90.44%)</text>
  <text x="344" y="418" font-size="11" fill="#475569">YOLOv11n at inference time</text>
  <text x="344" y="438" font-size="11" fill="#64748b">on open DeepPCB</text>
  <text x="344" y="462" font-size="11" fill="#64748b">outputs detection features</text>

  <!-- ============ BAND 3: FUSION + OUTPUT ============ -->
  <rect x="612" y="104" width="248" height="392" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="628" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">FUSION &#183; DECISION</text>

  <!-- XGBoost meta-classifier -->
  <rect x="628" y="142" width="216" height="150" rx="6" fill="#fef3c7" stroke="#f09228" stroke-width="2.5"/>
  <text x="736" y="166" font-size="14" font-weight="800" fill="#78350f" text-anchor="middle">XGBoost</text>
  <text x="736" y="184" font-size="13" font-weight="800" fill="#78350f" text-anchor="middle">meta-classifier</text>
  <text x="736" y="208" font-size="11" fill="#475569" text-anchor="middle">fuses RF + YOLO streams</text>
  <text x="736" y="225" font-size="11" fill="#475569" text-anchor="middle">into 8 fusion features</text>
  <line x1="652" y1="240" x2="820" y2="240" stroke="#fde68a"/>
  <text x="736" y="260" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">F1 0.9462</text>
  <text x="736" y="278" font-size="11" fill="#64748b" text-anchor="middle">defect recall 95.91%</text>

  <!-- Decision output -->
  <rect x="628" y="308" width="216" height="84" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="736" y="331" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Defect decision</text>
  <text x="700" y="356" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">PASS</text>
  <text x="772" y="356" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">DEFECT</text>
  <text x="736" y="378" font-size="11" fill="#64748b" text-anchor="middle">67.3 ms end-to-end /predict (CPU)</text>

  <!-- Explainability layer -->
  <rect x="628" y="408" width="216" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="736" y="431" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Explainability (XAI)</text>
  <text x="736" y="450" font-size="11" fill="#475569" text-anchor="middle">SHAP waterfall &#183; counterfactual</text>
  <text x="736" y="467" font-size="11" fill="#64748b" text-anchor="middle">/explain 15.6 ms &#183; Pearson &gt; 0.95</text>

  <!-- ============ BAND 4: SERVING ============ -->
  <rect x="884" y="104" width="176" height="392" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="900" y="126" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">SERVING</text>

  <!-- FastAPI -->
  <rect x="900" y="142" width="144" height="150" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="972" y="165" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">FastAPI</text>
  <text x="972" y="183" font-size="11" fill="#475569" text-anchor="middle">REST API</text>
  <text x="972" y="200" font-size="11" fill="#475569" text-anchor="middle">Uvicorn &#183; 7 endpoints</text>
  <line x1="916" y1="214" x2="1028" y2="214" stroke="#bfdbfe"/>
  <text x="972" y="234" font-size="11" fill="#64748b" text-anchor="middle">/predict</text>
  <text x="972" y="251" font-size="11" fill="#64748b" text-anchor="middle">/explain</text>
  <text x="972" y="268" font-size="11" fill="#64748b" text-anchor="middle">/health</text>

  <!-- Streamlit dashboard -->
  <rect x="900" y="308" width="144" height="172" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="972" y="331" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Streamlit</text>
  <text x="972" y="349" font-size="11" fill="#475569" text-anchor="middle">dashboard + Plotly</text>
  <line x1="916" y1="362" x2="1028" y2="362" stroke="#e2e8f0"/>
  <text x="972" y="383" font-size="11" fill="#64748b" text-anchor="middle">Overview</text>
  <text x="972" y="401" font-size="11" fill="#64748b" text-anchor="middle">API Health</text>
  <text x="972" y="419" font-size="11" fill="#64748b" text-anchor="middle">XAI Insights</text>
  <text x="972" y="437" font-size="11" fill="#64748b" text-anchor="middle">Historical Trends</text>
  <text x="972" y="462" font-size="11" fill="#64748b" text-anchor="middle">4 interactive tabs</text>

  <!-- ============ ARROWS ============ -->
  <!-- Sensor input -> feature reduction -->
  <line x1="272" y1="190" x2="324" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <!-- PCB images -> YOLO -->
  <line x1="272" y1="300" x2="324" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <!-- feature reduction -> Random Forest -->
  <line x1="450" y1="228" x2="450" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>

  <!-- Random Forest -> XGBoost -->
  <line x1="572" y1="283" x2="624" y2="225" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ax-arrow-green)"/>
  <!-- YOLO -> XGBoost -->
  <line x1="572" y1="405" x2="624" y2="250" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ax-arrow-green)"/>

  <!-- XGBoost -> Decision -->
  <line x1="736" y1="292" x2="736" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <!-- XGBoost -> XAI (dashed) -->
  <line x1="612" y1="217" x2="600" y2="444" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="600" y1="444" x2="624" y2="444" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ax-arrow)"/>

  <!-- Decision -> FastAPI -->
  <line x1="844" y1="334" x2="896" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <!-- XAI -> FastAPI -->
  <line x1="844" y1="444" x2="896" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <!-- FastAPI -> Streamlit -->
  <line x1="972" y1="292" x2="972" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax-arrow)"/>

  <!-- ============ FOOTER STACK STRIP ============ -->
  <rect x="40" y="514" width="1020" height="116" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="538" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">STACK</text>

  <text x="56" y="566" font-size="11" fill="#475569"><tspan font-weight="700" fill="#0f172a">ML / AI</tspan>  XGBoost (meta-classifier) &#183; Random Forest (sensor) &#183; YOLOv8m / YOLOv11n &#183; scikit-learn &#183; imbalanced-learn (SMOTE)</text>
  <text x="56" y="588" font-size="11" fill="#475569"><tspan font-weight="700" fill="#0f172a">XAI</tspan>  SHAP waterfall attribution &#183; counterfactual analysis      <tspan font-weight="700" fill="#0f172a">API</tspan>  FastAPI &#183; Uvicorn (7 endpoints) &#183; pandas &#183; numpy &#183; OpenCV</text>
  <text x="56" y="610" font-size="11" fill="#475569"><tspan font-weight="700" fill="#0f172a">Frontend</tspan>  Streamlit (4 tabs) &#183; Plotly      <tspan font-weight="700" fill="#0f172a">Data</tspan>  SECOM (open) &#183; DeepPCB (open) &#183; synthetic SECOM&#8211;DeepPCB pairing</text>
</svg>
