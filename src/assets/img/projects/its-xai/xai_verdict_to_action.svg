<svg viewBox="0 0 960 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="70" font-size="29" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Every verdict carries a <tspan fill="#1772d0">faithful</tspan> explanation.</text>

  <!-- ============ INBOUND: gray hairlines converging on the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 162 C 360 162, 392 250, 424 250"/>
    <path d="M214 250 C 360 250, 392 250, 424 250"/>
    <path d="M214 338 C 360 338, 392 250, 424 250"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="162" r="3"/>
    <circle cx="210" cy="250" r="3"/>
    <circle cx="210" cy="338" r="3"/>
  </g>
  <text x="56" y="168" font-size="18" font-weight="600" fill="#6b7280">verdict (PASS / DEFECT)</text>
  <text x="56" y="256" font-size="18" font-weight="600" fill="#6b7280">SHAP attribution</text>
  <text x="56" y="344" font-size="18" font-weight="600" fill="#6b7280">counterfactual</text>

  <!-- outbound hairline to the actionable outcome -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 250 C 670 250, 700 250, 766 250"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the faithfulness beat ============ -->
  <circle cx="500" cy="250" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="250" r="76" fill="#1772d0"/>
  <text x="500" y="240" text-anchor="middle" font-size="16" letter-spacing="0.3" fill="#cfe2f7">Pearson</text>
  <text x="500" y="272" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="0.2" fill="#ffffff">&gt; 0.95</text>

  <!-- ============ OUTCOME (the lone orange: an engineer can act) ============ -->
  <circle cx="772" cy="250" r="6" fill="#e8833a"/>
  <text x="788" y="244" font-size="20" font-weight="700" fill="#e8833a" letter-spacing="0.3">PROCESS TWEAK</text>
  <text x="788" y="268" font-size="15" font-weight="600" fill="#6b7280">an engineer can act</text>

  <!-- ============ SECONDARY VISUAL LANE (quiet, gray): what Pearson compares ============ -->
  <path d="M214 408 L 470 408" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>
  <circle cx="210" cy="408" r="3" fill="#e6e9ee"/>
  <text x="56" y="413" font-size="15" font-weight="600" fill="#6b7280">SHAP vs model importances</text>
  <text x="486" y="413" font-size="15" font-weight="600" fill="#6b7280">faithful, not decorative</text>
</svg>
