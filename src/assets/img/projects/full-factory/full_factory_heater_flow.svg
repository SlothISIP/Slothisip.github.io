<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- ===== HEADLINE (one blue word) ===== -->
  <text x="48" y="64" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.4">One L1 anomaly, end-to-end, in <tspan fill="#1772d0">one pass</tspan>.</text>

  <!-- ===== GRAY HAIRLINE TIMELINE (left to right) ===== -->
  <path d="M70 232 L 890 232" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>

  <!-- quiet upstream + downstream stops (gray) -->
  <circle cx="92" cy="232" r="4" fill="#6b7280"/>
  <text x="92" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">Simulator</text>

  <circle cx="246" cy="232" r="4" fill="#6b7280"/>
  <text x="246" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">SPC fan-out</text>

  <!-- ===== ONE BLUE FOCAL: confidence-routed fallback gate ===== -->
  <circle cx="500" cy="232" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="232" r="76" fill="#1772d0"/>
  <text x="500" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">conf 0.42</text>
  <text x="500" y="247" text-anchor="middle" font-size="13" fill="#cfe2f7">below 0.3</text>
  <text x="500" y="266" text-anchor="middle" font-size="13" fill="#cfe2f7">&#8594; rule fallback</text>

  <!-- gate label above focal -->
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1772d0">LineMonitorAgent (L1)</text>
  <path d="M500 128 L 500 154" stroke="#cfe2f7" stroke-width="1.5" fill="none"/>

  <!-- downstream gray stops -->
  <circle cx="708" cy="232" r="4" fill="#6b7280"/>
  <text x="708" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">Coordinator</text>

  <circle cx="868" cy="232" r="4" fill="#6b7280"/>
  <text x="868" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">UI push</text>

  <!-- ===== ONE ORANGE BEAT: WARNING -> CRITICAL escalation ===== -->
  <path d="M576 232 C 640 232, 660 352, 760 352" stroke="#e6e9ee" stroke-width="1.5" fill="none"/>
  <circle cx="766" cy="352" r="6" fill="#e8833a"/>
  <text x="784" y="345" font-size="16" font-weight="700" fill="#e8833a">WARNING &#8594; CRITICAL</text>
  <text x="784" y="365" font-size="13" font-weight="600" fill="#6b7280">trigger = heater_drift</text>
</svg>
