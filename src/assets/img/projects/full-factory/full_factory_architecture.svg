<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== HEADLINE (top-left, one blue word) ===== -->
  <text x="48" y="66" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">Five layers, one <tspan fill="#1772d0">event bus</tspan>.</text>

  <!-- ============ 5 LAYER ROWS: gray hairlines converging on the spine ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M250 132 C 360 132, 392 258, 424 258"/>
    <path d="M250 195 C 360 195, 392 258, 424 258"/>
    <path d="M250 258 L 424 258"/>
    <path d="M250 321 C 360 321, 392 258, 424 258"/>
    <path d="M250 384 C 360 384, 392 258, 424 258"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="246" cy="132" r="3"/>
    <circle cx="246" cy="195" r="3"/>
    <circle cx="246" cy="258" r="3"/>
    <circle cx="246" cy="321" r="3"/>
    <circle cx="246" cy="384" r="3"/>
  </g>
  <text x="56" y="138" font-size="17" font-weight="600" fill="#6b7280">L1 · Presentation</text>
  <text x="56" y="201" font-size="17" font-weight="600" fill="#6b7280">L2 · Application</text>
  <text x="56" y="264" font-size="17" font-weight="600" fill="#6b7280">L3 · AI + Agents</text>
  <text x="56" y="327" font-size="17" font-weight="600" fill="#6b7280">L4 · Data Platform</text>
  <text x="56" y="390" font-size="17" font-weight="600" fill="#6b7280">L5 · Simulator</text>

  <!-- ============ THE ONE BLUE FOCAL: Redis Streams Event Bus ============ -->
  <circle cx="500" cy="258" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="500" cy="258" r="76" fill="#1772d0"/>
  <text x="500" y="252" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.2" fill="#ffffff">Redis Streams</text>
  <text x="500" y="280" text-anchor="middle" font-size="15" letter-spacing="0.3" fill="#cfe2f7">Event Bus</text>

  <!-- ============ THE ONE ORANGE BEAT: both modes publish the same events ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 258 C 660 258, 690 214, 752 214"/>
    <path d="M576 258 C 660 258, 690 302, 752 302"/>
  </g>
  <circle cx="754" cy="214" r="5" fill="#6b7280"/>
  <text x="772" y="220" font-size="17" font-weight="600" fill="#6b7280">A · Full Sensor</text>
  <circle cx="754" cy="302" r="5" fill="#6b7280"/>
  <text x="772" y="308" font-size="17" font-weight="600" fill="#6b7280">B · Camera-First</text>

  <text x="500" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#e8833a">Both modes publish the same downstream events.</text>
</svg>
