<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ffArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="ffArrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#ffffff" />

  <!-- Title -->
  <text x="40" y="40" font-size="23" font-weight="700" fill="#0f172a">Full AI Factory &#183; 5-Layer Architecture</text>
  <rect x="40" y="50" width="190" height="4" rx="2" fill="#1772d0" />
  <text x="40" y="74" font-size="13" fill="#64748b">Modular monolith &#183; Redis Streams event bus &#183; 19 backend modules &#183; 14 logical agents &#183; Dual Mode (Sensor / Camera-First)</text>

  <!-- ================= EVENT BUS (right rail) ================= -->
  <rect x="888" y="92" width="184" height="560" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="980" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Redis Streams</text>
  <text x="980" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Event Bus</text>
  <line x1="904" y1="144" x2="1056" y2="144" stroke="#cbd5e1" stroke-width="1" />
  <text x="980" y="162" text-anchor="middle" font-size="10" fill="#5b21b6">sensor:{lineId}</text>
  <text x="980" y="178" text-anchor="middle" font-size="10" fill="#5b21b6">event:production:{lineId}</text>
  <text x="980" y="194" text-anchor="middle" font-size="10" fill="#5b21b6">event:quality:{lineId}</text>
  <text x="980" y="210" text-anchor="middle" font-size="10" fill="#5b21b6">event:maintenance</text>
  <text x="980" y="226" text-anchor="middle" font-size="10" fill="#5b21b6">event:safety</text>
  <text x="980" y="242" text-anchor="middle" font-size="10" fill="#5b21b6">event:energy</text>
  <text x="980" y="258" text-anchor="middle" font-size="10" fill="#5b21b6">camera:{lineId}</text>
  <text x="980" y="274" text-anchor="middle" font-size="10" fill="#5b21b6">agent:request:*</text>
  <text x="980" y="290" text-anchor="middle" font-size="10" fill="#5b21b6">agent:response:*</text>
  <line x1="904" y1="304" x2="1056" y2="304" stroke="#cbd5e1" stroke-width="1" />
  <text x="980" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Invariants</text>
  <text x="980" y="342" text-anchor="middle" font-size="9.5" fill="#475569">No direct module import</text>
  <text x="980" y="358" text-anchor="middle" font-size="9.5" fill="#475569">WS channels = 10 (fixed)</text>
  <text x="980" y="374" text-anchor="middle" font-size="9.5" fill="#475569">Zustand stores = 7 (fixed)</text>
  <text x="980" y="390" text-anchor="middle" font-size="9.5" fill="#475569">audit_log on every CUD</text>
  <text x="980" y="406" text-anchor="middle" font-size="9.5" fill="#475569">TimescaleDB source field</text>
  <text x="980" y="422" text-anchor="middle" font-size="9.5" fill="#475569">i18n ko / en key parity</text>
  <line x1="904" y1="436" x2="1056" y2="436" stroke="#cbd5e1" stroke-width="1" />
  <text x="980" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Enforced by</text>
  <text x="980" y="474" text-anchor="middle" font-size="10" fill="#475569">arch_check.sh</text>
  <text x="980" y="489" text-anchor="middle" font-size="10" fill="#475569">on every Edit / Write</text>
  <line x1="904" y1="502" x2="1056" y2="502" stroke="#cbd5e1" stroke-width="1" />
  <text x="980" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">W42 audit</text>
  <text x="980" y="540" text-anchor="middle" font-size="10" fill="#065f46">arch 0 violations</text>
  <text x="980" y="556" text-anchor="middle" font-size="10" fill="#065f46">tsc 0 errors</text>
  <text x="980" y="572" text-anchor="middle" font-size="10" fill="#065f46">vitest 18 / 54 pass</text>
  <text x="980" y="588" text-anchor="middle" font-size="10" fill="#065f46">health 35 / 35 live</text>
  <line x1="904" y1="602" x2="1056" y2="602" stroke="#cbd5e1" stroke-width="1" />
  <text x="980" y="622" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">single-machine demo</text>
  <text x="980" y="637" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">synthetic data</text>

  <!-- ================= L1 PRESENTATION (blue) ================= -->
  <rect x="40" y="92" width="824" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="110" font-size="11" letter-spacing="1.5" fill="#64748b">L1 &#183; PRESENTATION</text>
  <rect x="56" y="120" width="792" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="68" y="138" font-size="11.5" font-weight="700" fill="#1e3a8a">React 18 + TypeScript + Vite + TailwindCSS + shadcn/ui + React Three Fiber</text>
  <text x="68" y="154" font-size="10.5" fill="#1e3a8a">20 pages &#183; 111 components &#183; Zustand 7 stores (5 domain + 2 infra) &#183; i18n ko/en &#183; 1920&#215;1080+</text>
  <text x="68" y="170" font-size="10.5" fill="#1e3a8a">Surfaces &#8212; Command Center &#183; SCADA &#183; MES &#183; ERP &#183; QMS &#183; SPC &#183; WMS &#183; APS &#183; CMMS &#183; Digital Twin (3D)</text>

  <!-- L1 to L2 edge -->
  <line x1="452" y1="190" x2="452" y2="218" stroke="#64748b" stroke-width="1.8" marker-end="url(#ffArr)" marker-start="url(#ffArr)" />
  <text x="462" y="208" font-size="10" fill="#475569">WS 10ch + REST</text>

  <!-- ================= L2 APPLICATION (green) ================= -->
  <rect x="40" y="218" width="824" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="236" font-size="11" letter-spacing="1.5" fill="#64748b">L2 &#183; APPLICATION MODULES</text>
  <rect x="56" y="246" width="792" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5" />
  <text x="68" y="264" font-size="11.5" font-weight="700" fill="#065f46">FastAPI + Python 3.12 + SQLAlchemy 2 + Alembic (7 rev) &#183; 156 REST endpoints &#183; WS 10 channels &#183; gRPC client</text>
  <text x="68" y="280" font-size="10.5" fill="#065f46">19 modules, same shape (router &#183; service &#183; models &#183; schemas &#183; events) &#8212; direct import forbidden, Redis Streams only</text>
  <text x="68" y="296" font-size="10.5" fill="#065f46">MES &#183; ERP &#183; SPC &#183; QMS &#183; WMS &#183; APS &#183; CMMS &#183; Energy &#183; Safety &#183; Tracking &#183; Camera &#183; Predictive &#183; Document &#183; Notification &#183; Audit</text>

  <!-- L2 to L3 edge -->
  <line x1="452" y1="316" x2="452" y2="344" stroke="#64748b" stroke-width="1.8" marker-end="url(#ffArr)" marker-start="url(#ffArr)" />
  <text x="462" y="334" font-size="10" fill="#475569">gRPC 5s + Redis Streams</text>

  <!-- ================= L3 AI ENGINE + AGENTS (amber) ================= -->
  <rect x="40" y="344" width="824" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="362" font-size="11" letter-spacing="1.5" fill="#64748b">L3 &#183; AI ENGINE + MULTI-AGENT</text>
  <rect x="56" y="372" width="792" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="68" y="390" font-size="11.5" font-weight="700" fill="#78350f">PyTorch / ONNX (FP16) + gRPC serving &#183; LangGraph + Ollama (Qwen 2.5 3B) &#183; ChromaDB RAG &#183; MCP 16 tools</text>
  <text x="68" y="406" font-size="10.5" fill="#78350f">Vision &#8212; PatchCore / EfficientAD &#183; YOLOv8n &#215; 4 &#183; Pose &#183; ArcFace    Predictive &#8212; LSTM-Attention &#183; CNN-GRU &#183; TimesFM &#183; LSTM-AE</text>
  <text x="68" y="422" font-size="10.5" fill="#78350f">14 logical agents = 8 classes &#215; line_id (LineMonitor &#215; L1..L7 + Quality &#183; Maintenance &#183; Planning &#183; Energy &#183; Safety &#183; Coordinator &#183; Document)</text>

  <!-- L3 to L4 edge -->
  <line x1="452" y1="450" x2="452" y2="478" stroke="#64748b" stroke-width="1.8" marker-end="url(#ffArr)" marker-start="url(#ffArr)" />
  <text x="462" y="468" font-size="10" fill="#475569">SQLAlchemy / ChromaDB / MinIO</text>

  <!-- ================= L4 DATA PLATFORM (green) ================= -->
  <rect x="40" y="478" width="824" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="496" font-size="11" letter-spacing="1.5" fill="#64748b">L4 &#183; DATA PLATFORM</text>
  <rect x="56" y="506" width="792" height="58" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5" />
  <text x="68" y="524" font-size="11" font-weight="700" fill="#065f46">PostgreSQL 16 (~48 tables) &#183; TimescaleDB 2.17 (4 hypertables, source required) &#183; Redis 7 &#183; ChromaDB embedded &#183; MinIO FS fallback</text>
  <text x="68" y="540" font-size="10.5" fill="#065f46">Hypertables &#8212; sensor_data &#183; spc_measurements &#183; energy_readings &#183; camera_detections    RAG corpus &#8212; synthetic SOPs / manuals in ChromaDB</text>
  <text x="68" y="556" font-size="10.5" fill="#065f46">audit_log on every CUD &#183; timezone-aware UTC &#183; enforced by pre-commit arch_check.sh</text>

  <!-- L4 to L5 edge -->
  <line x1="452" y1="576" x2="452" y2="604" stroke="#64748b" stroke-width="1.8" marker-end="url(#ffArr)" marker-start="url(#ffArr)" />
  <text x="462" y="594" font-size="10" fill="#475569">writes synthetic events</text>

  <!-- ================= L5 SIMULATOR (red / honesty) ================= -->
  <rect x="40" y="604" width="824" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="622" font-size="11" letter-spacing="1.5" fill="#64748b">L5 &#183; SYNTHETIC FACTORY SIMULATOR</text>
  <rect x="56" y="632" width="792" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="68" y="650" font-size="10.5" fill="#991b1b">7 lines &#8212; L1 Injection &#183; L2 Press &#183; L3 Assembly &#183; L4 Painting &#183; L5 Welding &#183; L6 CNC &#183; L7 Final Inspection</text>
  <text x="68" y="666" font-size="10.5" fill="#991b1b">Dual Mode &#8212; A: Full Sensor (PLC values) | B: Camera-First (signal-tower / line-counting / WIP / OCR &#8594; same downstream events)</text>
  <text x="68" y="682" font-size="10.5" fill="#991b1b">4 physics-based scenarios &#8212; heater_degradation (L1, 72h quadratic drift) &#183; die_wear &#183; electrode_wear &#183; safety_intrusion</text>

  <!-- ================= Layer to Bus connectors ================= -->
  <line x1="864" y1="149" x2="888" y2="149" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ffArrPurple)" marker-start="url(#ffArrPurple)" />
  <line x1="864" y1="275" x2="888" y2="275" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ffArrPurple)" marker-start="url(#ffArrPurple)" />
  <line x1="864" y1="405" x2="888" y2="405" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ffArrPurple)" marker-start="url(#ffArrPurple)" />
  <line x1="864" y1="535" x2="888" y2="535" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ffArrPurple)" marker-start="url(#ffArrPurple)" />
  <line x1="864" y1="662" x2="888" y2="662" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ffArrPurple)" marker-start="url(#ffArrPurple)" />

  <!-- Footer -->
  <text x="40" y="730" font-size="10.5" fill="#64748b" font-style="italic">Solo developer &#183; 42 weeks (38 roadmap + 4 hardening) &#183; synthetic data calibrated against open datasets &#183; single-machine demo &#183; not deployed in a live factory</text>
</svg>
