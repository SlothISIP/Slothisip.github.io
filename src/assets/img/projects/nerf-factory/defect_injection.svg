<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue word) ===== -->
  <text x="48" y="72" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">One engine <tspan fill="#1772d0">perturbs</tspan> the trained field.</text>

  <!-- ============ INBOUND: gray hairlines from the trained NeRF fields ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M214 186 C 320 186, 360 250, 408 250"/>
    <path d="M214 314 C 320 314, 360 250, 408 250"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="210" cy="186" r="3"/>
    <circle cx="210" cy="314" r="3"/>
  </g>
  <text x="56" y="180" font-size="18" font-weight="700" fill="#6b7280">trained NeRF</text>
  <text x="56" y="192" font-size="15" font-weight="600" fill="#6b7280">&#963; density field</text>
  <text x="56" y="320" font-size="15" font-weight="600" fill="#6b7280">c color field</text>

  <!-- outbound hairlines: engine -> four defect types + COCO export -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M576 250 C 668 250, 692 132, 752 132"/>
    <path d="M576 250 C 668 250, 692 211, 752 211"/>
    <path d="M576 250 C 668 250, 692 289, 752 289"/>
    <path d="M576 250 C 668 250, 692 368, 752 368"/>
  </g>

  <!-- ============ THE ONE FOCAL: the DefectInjectionEngine (orange beat) ============ -->
  <circle cx="492" cy="250" r="104" fill="#e8833a" opacity="0.06"/>
  <circle cx="492" cy="250" r="76" fill="#e8833a"/>
  <text x="492" y="240" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.2" fill="#ffffff">DefectInjection</text>
  <text x="492" y="262" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.2" fill="#ffffff">Engine</text>
  <text x="492" y="286" text-anchor="middle" font-size="13" letter-spacing="0.2" fill="#ffffff">&#916;&#963; carve &#183; &#916;c tint</text>

  <!-- ============ OUTCOMES (neutral gray dots + COCO export) ============ -->
  <g fill="#cbd5e1">
    <circle cx="754" cy="132" r="5"/>
    <circle cx="754" cy="211" r="5"/>
    <circle cx="754" cy="289" r="5"/>
  </g>
  <g font-size="18" font-weight="600" fill="#6b7280">
    <text x="772" y="138">scratch &#183; crack</text>
    <text x="772" y="217">dent</text>
    <text x="772" y="295">contamination</text>
  </g>
  <circle cx="754" cy="368" r="5" fill="#1772d0"/>
  <text x="772" y="374" font-size="18" font-weight="700" fill="#1772d0">COCO export</text>
</svg>
