<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== TITLE (headline, top-left, one blue phrase) ===== -->
  <text x="48" y="64" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.4">A few photos become <tspan fill="#1772d0">unlimited</tspan> training data.</text>

  <!-- ============ INBOUND: a few captured views fan into the core ============ -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M196 170 C 320 170, 360 258, 412 258"/>
    <path d="M196 234 C 320 234, 360 258, 412 258"/>
    <path d="M196 298 C 320 298, 360 258, 412 258"/>
  </g>
  <g fill="#e6e9ee">
    <circle cx="192" cy="170" r="3"/>
    <circle cx="192" cy="234" r="3"/>
    <circle cx="192" cy="298" r="3"/>
  </g>
  <text x="56" y="176" font-size="18" font-weight="600" fill="#6b7280">multi-view images</text>
  <text x="56" y="240" font-size="18" font-weight="600" fill="#6b7280">camera poses</text>
  <text x="56" y="304" font-size="18" font-weight="600" fill="#6b7280">novel-view synthesis</text>

  <!-- outbound hairlines from core to the pipeline outcomes -->
  <g stroke="#e6e9ee" stroke-width="1.5" fill="none">
    <path d="M564 258 C 632 258, 652 198, 670 198"/>
    <path d="M564 258 C 632 258, 652 280, 670 280"/>
    <path d="M564 258 C 632 258, 652 362, 670 362"/>
  </g>

  <!-- ============ THE ONE BLUE FOCAL: the from-scratch NeRF core ============ -->
  <circle cx="488" cy="258" r="104" fill="#1772d0" opacity="0.06"/>
  <circle cx="488" cy="258" r="76" fill="#1772d0"/>
  <text x="488" y="250" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="0.2" fill="#ffffff">NeRF core</text>
  <text x="488" y="278" text-anchor="middle" font-size="14" letter-spacing="0.2" fill="#cfe2f7">from-scratch · PyTorch</text>

  <!-- ============ PIPELINE OUTCOMES (gray) ============ -->
  <circle cx="672" cy="198" r="5" fill="#6b7280"/>
  <text x="690" y="204" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">Physics defect injection</text>

  <circle cx="672" cy="280" r="5" fill="#6b7280"/>
  <text x="690" y="286" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">Synthetic data generator</text>

  <circle cx="672" cy="362" r="5" fill="#6b7280"/>
  <text x="690" y="368" font-size="18" font-weight="600" fill="#6b7280" letter-spacing="0.3">Inspection AI training</text>

  <!-- ============ THE ONE ORANGE BEAT: demo-prototype status ============ -->
  <line x1="48" y1="430" x2="72" y2="430" stroke="#e8833a" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="436" font-size="16" font-weight="700" fill="#e8833a">v0.1.0 alpha — research / demo prototype</text>
</svg>
