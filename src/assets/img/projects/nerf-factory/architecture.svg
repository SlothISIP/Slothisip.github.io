<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#f09228"/>
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="23" font-weight="800" fill="#0f172a">Industrial NeRF Factory &#183; End-to-End Pipeline</text>
  <rect x="40" y="56" width="186" height="4" rx="2" fill="#1772d0"/>
  <text x="40" y="80" font-size="13" fill="#64748b">From-scratch NeRF synthetic-data generation, through training, to a simulation-only sim-to-real loop (research / demo prototype)</text>

  <!-- ============ BAND 1: DATA + NeRF CORE ============ -->
  <rect x="32" y="100" width="1036" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="122" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">DATA COLLECTION &#183; NeRF CORE (FROM-SCRATCH PYTORCH)</text>

  <!-- Multi-View Capture -->
  <rect x="48" y="136" width="200" height="142" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="148" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Multi-View Capture</text>
  <text x="148" y="184" text-anchor="middle" font-size="11.5" fill="#475569">Multi-view images</text>
  <text x="148" y="202" text-anchor="middle" font-size="11.5" fill="#475569">+ supplied camera poses</text>
  <text x="148" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">View count = runtime input</text>
  <text x="148" y="252" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">SfM pose est. (COLMAP)</text>
  <text x="148" y="266" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">future work &#183; mock trajectory</text>

  <!-- NeRF Training -->
  <rect x="296" y="136" width="216" height="142" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="404" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">NeRF Training</text>
  <text x="404" y="184" text-anchor="middle" font-size="11.5" fill="#475569">Instant-NGP-style core</text>
  <text x="404" y="204" text-anchor="middle" font-size="11" fill="#475569">Multi-res hash encoding + MLP</text>
  <text x="404" y="222" text-anchor="middle" font-size="11" fill="#475569">Volume rendering</text>
  <text x="404" y="240" text-anchor="middle" font-size="11" fill="#475569">Marching-cubes mesh export</text>
  <text x="404" y="263" text-anchor="middle" font-size="10.5" fill="#64748b">PyTorch &#183; Open3D / Trimesh</text>

  <!-- Novel View Synthesis -->
  <rect x="560" y="136" width="200" height="142" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Novel View Synthesis</text>
  <text x="660" y="186" text-anchor="middle" font-size="11.5" fill="#475569">Render arbitrary poses</text>
  <text x="660" y="206" text-anchor="middle" font-size="11.5" fill="#475569">Unlimited unseen angles</text>
  <text x="660" y="226" text-anchor="middle" font-size="11.5" fill="#475569">Photorealistic output</text>
  <text x="660" y="252" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">PSNR stored (scaffold);</text>
  <text x="660" y="266" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">SSIM/LPIPS not measured</text>

  <!-- Multimodal NeRF Variants -->
  <rect x="808" y="136" width="244" height="142" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="930" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Multimodal NeRF Variants</text>
  <text x="930" y="186" text-anchor="middle" font-size="11.5" fill="#475569">Acoustic NeRF</text>
  <text x="930" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">sound-source localization</text>
  <text x="930" y="226" text-anchor="middle" font-size="11.5" fill="#475569">Hyperspectral NeRF</text>
  <text x="930" y="244" text-anchor="middle" font-size="10.5" fill="#64748b">128 bands, 400&#8211;1000nm</text>
  <text x="930" y="267" text-anchor="middle" font-size="10.5" fill="#64748b">shared hash encoding</text>

  <!-- ============ BAND 2: SYNTHETIC DATA + DOWNSTREAM AI ============ -->
  <rect x="32" y="320" width="1036" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="342" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">SYNTHETIC DATA GENERATION &#183; DOWNSTREAM AI</text>

  <!-- Defect Injection -->
  <rect x="48" y="356" width="224" height="120" rx="6" fill="#fef3c7" stroke="#f09228" stroke-width="2"/>
  <text x="160" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">Physics Defect Injection</text>
  <text x="160" y="404" text-anchor="middle" font-size="11" fill="#475569">Modifies NeRF density / color</text>
  <text x="160" y="424" text-anchor="middle" font-size="11" fill="#475569">Scratch &#183; crack &#183; dent</text>
  <text x="160" y="442" text-anchor="middle" font-size="11" fill="#475569">&#183; contamination</text>
  <text x="160" y="463" text-anchor="middle" font-size="10.5" fill="#64748b">OpenCV / Kornia &#183; Albumentations</text>

  <!-- Synthetic Data Generator -->
  <rect x="320" y="356" width="224" height="120" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="432" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Synthetic Data Generator</text>
  <text x="432" y="406" text-anchor="middle" font-size="11.5" fill="#475569">Labeled datasets</text>
  <text x="432" y="426" text-anchor="middle" font-size="11.5" fill="#475569">Auto annotation</text>
  <text x="432" y="446" text-anchor="middle" font-size="11.5" fill="#475569">COCO-format export</text>
  <text x="432" y="467" text-anchor="middle" font-size="10.5" fill="#64748b">no manual labeling required</text>

  <!-- AI Model Training -->
  <rect x="592" y="356" width="216" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Inspection AI Training</text>
  <text x="700" y="406" text-anchor="middle" font-size="11.5" fill="#475569">Detection / classification</text>
  <text x="700" y="426" text-anchor="middle" font-size="11.5" fill="#475569">Trained on synthetic data</text>
  <text x="700" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">automatically-labeled inputs</text>

  <!-- Digital Twin + Sim-to-Real -->
  <rect x="856" y="356" width="196" height="120" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="954" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Sim-to-Real</text>
  <text x="954" y="404" text-anchor="middle" font-size="11" fill="#475569">Gymnasium NeRF env</text>
  <text x="954" y="422" text-anchor="middle" font-size="11" fill="#475569">PPO + domain random.</text>
  <text x="954" y="442" text-anchor="middle" font-size="11" fill="#475569">visual + physics DR</text>
  <text x="954" y="463" text-anchor="middle" font-size="10.5" fill="#64748b">success rate in sim only</text>

  <!-- ============ BAND 3: BACKEND / PLATFORM ============ -->
  <rect x="32" y="516" width="1036" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="538" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">BACKEND / PLATFORM (SINGLE-NODE) &#183; FASTAPI REST + TYPER CLI</text>

  <rect x="48" y="552" width="240" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="168" y="573" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">API / CLI</text>
  <text x="168" y="591" text-anchor="middle" font-size="10.5" fill="#475569">FastAPI REST &#183; Typer CLI</text>

  <rect x="304" y="552" width="240" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="424" y="573" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Task Queue</text>
  <text x="424" y="591" text-anchor="middle" font-size="10.5" fill="#475569">Celery + Redis</text>

  <rect x="560" y="552" width="240" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="680" y="573" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Storage</text>
  <text x="680" y="591" text-anchor="middle" font-size="10.5" fill="#475569">PostgreSQL + Alembic &#183; MinIO / S3</text>

  <rect x="816" y="552" width="236" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="934" y="573" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Deploy &amp; Observability</text>
  <text x="934" y="591" text-anchor="middle" font-size="10.5" fill="#475569">Docker &#183; Prometheus + Grafana</text>

  <!-- ============ ARROWS ============ -->
  <!-- Band 1 horizontal flow -->
  <line x1="248" y1="207" x2="290" y2="207" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="512" y1="207" x2="554" y2="207" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <!-- NeRF core feeds multimodal variants (dashed, shared encoding) -->
  <line x1="760" y1="178" x2="802" y2="178" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

  <!-- Novel views -> defect injection (down into band 2) -->
  <path d="M660,278 L660,300 L160,300 L160,350" fill="none" stroke="#f09228" stroke-width="1.6" marker-end="url(#arrow-orange)"/>

  <!-- Band 2 horizontal flow -->
  <line x1="272" y1="416" x2="314" y2="416" stroke="#f09228" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="544" y1="416" x2="586" y2="416" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="808" y1="416" x2="850" y2="416" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Platform serves all stages (dashed up from backend band) -->
  <line x1="550" y1="552" x2="550" y2="498" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <text x="560" y="528" font-size="10" fill="#64748b" font-style="italic">orchestrates &amp; persists all stages</text>

  <!-- ============ FEEDBACK LOOP ============ -->
  <path d="M954,476 L954,648 L160,648 L160,500" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="557" y="643" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Continuous-improvement feedback loop &#8212; sim results refine synthetic-data generation (simulation only)</text>

  <!-- Honesty footer -->
  <text x="40" y="690" font-size="10.5" fill="#64748b" font-style="italic">v0.1.0 alpha &#183; research / demo prototype on synthetic and open data &#8212; no real client data, no factory deployment. ROS 2 / MoveIt and a distributed Ray/gRPC cluster are not wired in.</text>
  <rect x="40" y="700" width="1020" height="0.8" fill="#cbd5e1"/>
</svg>
