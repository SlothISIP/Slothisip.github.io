# Single source for all publications. Detail pubs carry abstract/figures/acknowledgements; markers resolved.
- slug: mst2026
  title: 'Amortised Neural Acoustic Tomography: Domain-Specific Encoder Design and Topology-Dependent Eikonal Analysis'
  authors: Ju O Kim, Deokwoo Lee
  venue: Measurement Science and Technology (IOP Publishing)
  year: 2026
  badge: scie
  detail: true
  paper_url: https://doi.org/10.1088/1361-6501/ae8c6d
  bib: KimMST2026
  highlight: false
  thumb: publications/mst2026/mst2026_thumb.jpg
  stats:
    - value: '~950x'
      label: 'faster per scene'
      sub: '127 ms vs ~2 min of optimisation'
    - value: '+51.0%'
      label: 'IoU over a generic encoder'
      sub: '0.644 vs 0.426, p = 0.0015'
    - value: '-9.3%'
      label: 'IoU from the Eikonal prior'
      sub: 'the standard physics loss hurts'
  tldr: >-
    Reconstructs 3D object geometry from acoustic pressure measurements in a single forward
    pass -- roughly 950x faster than the per-scene optimisation it replaces -- and shows that
    the accuracy comes from designing the encoder around acoustics, not from adding
    physics-informed losses. The Eikonal prior, standard in SDF learning, is measured here
    rather than assumed, and it turns out to help only narrowly and harm broadly.
  problem: >-
    Recovering an object's shape from how it perturbs a sound field is an inverse scattering
    problem normally solved by optimising one scene at a time, which costs about two minutes
    per scene and cannot be deployed. Amortising it into a learned encoder is the obvious fix,
    but a generic set encoder throws away the structure that makes acoustic observations
    informative -- and the field's default remedy, bolting on physics-informed losses, had
    never been ablated in this setting.
  approach:
    - >-
      Learns the transfer function T = p_scat / p_inc rather than raw pressure, which removes
      the dominant free-space oscillation from the target; a 10.3M-parameter forward surrogate
      reaches 0.05% relative L2 on it, validating T as a learnable quantity in 3D.
    - >-
      Designs the encoder along two acoustically motivated axes -- magnitude-phase input
      (separating scattering cross-section from path length) and frequency-selective attention
      (learning which scattering regimes carry shape) -- for 293K parameters total.
    - >-
      Trains in two stages -- code-match distillation against a per-scene auto-decoder, then
      joint fine-tuning with cycle-consistency through the frozen forward model -- on a
      100-scene 3D BEM dataset spanning 12 shape categories, with the BEM solver itself
      validated against the analytical Mie series to 0.24% relative L2.
    - >-
      Ablates the Eikonal constraint systematically across both architectures, 12 shape
      categories and 6-point (auto-decoder) / 4-point (encoder) weight sweeps, instead of
      including it untested as the prior 2D work did.
  results:
    - >-
      Single-pass inference in ~127 ms against ~120,000 ms for per-scene optimisation -- a
      ~950x speed-up that retains 78.4% of the auto-decoder ceiling (IoU 0.644 +/- 0.015 vs
      0.821).
    - >-
      The acoustic-specific encoder beats a domain-agnostic one by 51.0% (0.644 vs 0.426,
      p = 0.0015, 3 seeds), and an augmentation ablation confirms the gain comes from the input
      representation and attention rather than from data augmentation.
    - >-
      Learned attention is wavelength-selective, peaking at 2.0x uniform weight in the
      resonance regime near 1.2 kHz and falling to 0.28x where the wavelength is far shorter
      than the object -- an acoustic prior that mean pooling cannot express.
    - >-
      Eikonal regularisation degrades the encoder by 9.3% (p = 0.012). The per-category
      breakdown explains why -- benefits are architecture-dependent and confined to convex
      shapes that still have reconstruction headroom (ellipsoid +0.267 in the auto-decoder,
      only +0.008 in the encoder), whereas the harm is universal, flattening topological
      features regardless of architecture (torus -0.240 / -0.222).
    - >-
      Reported honestly -- zero-shot transfer to entirely unseen shape categories is weak
      (0.280 mean IoU, 0.363 excluding the degenerate thin-shell class), thin-shell "hollowed"
      geometry fails outright at 64^3 resolution, and the data are fully synthetic, so the
      framework is positioned as a measurement methodology validated in simulation rather than
      a deployed instrument.
  abstract: >-
    We present an amortised neural framework for three-dimensional acoustic diffraction
    tomography that reconstructs scene geometry as signed distance functions from boundary
    element method pressure observations. The central finding is that domain-specific encoder
    design, rather than physics-informed loss terms, drives reconstruction accuracy. Across
    100 synthetic scenes spanning 12 shape categories, this encoder attains 0.644 +/- 0.015
    mean intersection over union, a 51.0% improvement over a domain-agnostic baseline, while
    the physics losses evaluated in this amortised setting provide zero or negative benefit.
    Inference is a single forward pass (~127 ms, a ~950x speedup over per-scene optimisation).
    A systematic Eikonal regularisation ablation reveals a topology- and architecture-dependent
    asymmetry -- any benefit is confined to specific convex shapes with reconstruction headroom,
    whereas the harm, a flattening of topological features, is universal.
  citation: >-
    Ju O Kim and Deokwoo Lee, "Amortised neural acoustic tomography: domain-specific encoder
    design and topology-dependent Eikonal analysis," Measurement Science and Technology (IOP
    Publishing), vol. 37, no. 31, article 316003, 2026. DOI 10.1088/1361-6501/ae8c6d. Published
    7 August 2026.
  pipeline:
    - { label: 'BEM observations', sub: 'p(f, xs, xr)' }
    - { label: 'Magnitude + phase', sub: 'Axis A' }
    - { label: 'Frequency attention', sub: 'alpha(f), Axis B', key: true }
    - { label: 'Latent code', sub: 'z, 256-dim' }
    - { label: 'SDF decoder', sub: 'geometry s(x)' }
  figures:
    - src: publications/mst2026/mst2026_concept.svg
      section: problem
      alt: 'Generic mean pooling over frequency versus learned frequency-selective attention - the core encoder design'
      caption: 'Core idea: a generic encoder averages all 50 frequencies and dilutes the resonance band that carries geometry (IoU 0.426); the acoustic-specific encoder splits magnitude from phase and learns a frequency weighting that peaks at 2.0x in resonance and drops to 0.28x at short wavelengths (IoU 0.644).'
    - src: publications/mst2026/mst2026_amortise.svg
      section: problem
      featured: true
      alt: 'Reconstruction time per scene on a log scale - per-scene auto-decoder versus the amortised encoder'
      caption: 'Amortisation is the point: per-scene optimisation needs ~120,000 ms and 800 epochs to reach IoU 0.821; the encoder reaches 0.644 in ~127 ms, keeping 78.4% of that ceiling for a ~950x speed-up.'
    - src: publications/mst2026/mst2026_architecture.jpg
      title: 'System architecture'
      section: approach
      alt: Acoustic-specific encoder, SDF decoder, frozen forward surrogate and the cycle-consistency path
      caption: 'The 293K-parameter encoder maps complex BEM observations to a 256-dim latent code through magnitude-phase input and frequency-selective attention pooling. Stage 1 distils auto-decoder codes; Stage 2 fine-tunes jointly with cycle-consistency through the frozen forward surrogate. The Eikonal term is analysed, not recommended.'
    - src: publications/mst2026/mst2026_bem.jpg
      title: 'Measurement reference validated against theory'
      section: approach
      alt: Relative L2 error of BEM against the analytical Mie series across eight sphere scenes
      caption: 'The simulated measurements are trustworthy before anything is learned from them: across eight sphere scenes (radii 3-12 cm) the BEM solver sits 0.24% from the analytical Mie series, an order of magnitude below the neural error on the same scenes.'
    - src: publications/mst2026/mst2026_recon.jpg
      title: 'Reconstructed geometry'
      section: lead
      featured: true
      alt: 'Ground-truth versus reconstructed SDF contours at the z-midplane for six shape categories'
      caption: 'Reconstructed geometry at the z-midplane against ground truth. Convex and multi-body scenes recover closely (sphere 0.968, cone 0.947, torus 0.939, multi-body 0.925); the ellipsoid at 0.693 shows where the reconstruction still loses the boundary.'
    - src: publications/mst2026/mst2026_mainresults.jpg
      title: 'Encoder design versus physics loss'
      section: results
      featured: true
      alt: Mean IoU for the acoustic-specific encoder, the same encoder with Eikonal, and a generic encoder
      caption: 'The headline result. Acoustic-specific design lifts IoU by 51.0% over a generic encoder (0.644 vs 0.426, p = 0.0015); adding the standard Eikonal prior to that same encoder costs 9.3% (p = 0.012). Error bars are one population standard deviation over 3 seeds.'
    - src: publications/mst2026/mst2026_freqattn.jpg
      title: 'What the encoder listens to'
      section: results
      featured: true
      alt: Learned attention weight relative to uniform, plotted against frequency across three scattering regimes
      caption: 'The learned weighting is wavelength-selective rather than arbitrary: it peaks at 2.0x uniform near 1,236 Hz where the wavelength matches the object, holds 1.42x in the Rayleigh regime, and is suppressed to 0.28x in the short-wavelength geometric regime where scattering is dominated by fine-scale, hard-to-invert interactions.'
    - src: publications/mst2026/mst2026_dataeff.jpg
      title: 'Data efficiency'
      section: results
      alt: Mean IoU against fraction of training data for the acoustic-specific and generic encoders
      caption: 'The acoustic-specific encoder converts more data into more accuracy (0.404 to 0.647, +60% as the training set grows), while the generic encoder stays flat near 0.41 - evidence that the design extracts geometric information rather than memorising scenes.'
    - src: publications/mst2026/mst2026_eikonal.jpg
      title: 'Eikonal weight sweep'
      section: results
      alt: Mean IoU against Eikonal weight for the per-scene auto-decoder and the amortised encoder
      caption: 'Sweeping the Eikonal weight across both architectures: the auto-decoder shows a shallow within-noise maximum at w = 0.001 then falls away, while the encoder is flat below w = 0.01 and drops sharply at 0.1. Amortisation makes explicit Eikonal supervision redundant - the encoder already inherits SDF regularity through code-match distillation.'
    - src: publications/mst2026/mst2026_category.jpg
      title: 'Where the physics prior helps and where it hurts'
      section: results
      alt: Per-category change in IoU from the Eikonal prior, for the auto-decoder and the encoder
      caption: 'Per-category effect of the Eikonal prior. Benefit is narrow and architecture-dependent - the ellipsoid gains +0.267 in the auto-decoder but only +0.008 once amortised. Harm is broad and structural: torus -0.240 / -0.222 and wedge -0.257 / -0.170, the prior flattening exactly the topological features the reconstruction is meant to recover.'
    - src: publications/mst2026/mst2026_percat.jpg
      title: 'Reconstruction across all 12 categories'
      section: results
      alt: Per-category reconstruction IoU across the twelve shape categories with the overall mean
      caption: 'Per-category reconstruction IoU across the full 12-category dataset (overall mean 0.82). Simple convex primitives sit near 0.9, while thin-shell hollowed geometry (0.60) and L-shapes (0.69) mark the current limits - the failure modes are reported rather than averaged away.'
  acknowledgements: Computational resources were provided by the Department of Computer Science and Engineering, Keimyung University. This work was supported by the National Research Foundation of Korea, grant no. 2022R1I1A3069352.
- slug: applsci2026
  title: 'FFT-Free Neural Operators for Helmholtz Scattering via Adaptive Coefficient Modulation'
  authors: Ju O Kim, Deokwoo Lee
  venue: Applied Sciences (MDPI)
  year: 2026
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/2076-3417/16/12/5997
  bib: KimAPPLSCI2026
  highlight: false
  thumb: publications/applsci2026/applsci2026_thumb.jpg
  compare:
    title: 'High-contrast failure case: FNO vs HNO'
    aria: 'Toggle between FNO and HNO wave-field reconstruction on the same scene'
    before: { src: publications/applsci2026/applsci2026_ba_before.jpg, label: 'FNO', alt: 'FNO reconstruction collapses on the high-contrast scene' }
    after: { src: publications/applsci2026/applsci2026_ba_after.jpg, label: 'HNO (ours)', alt: 'HNO reconstruction degrades gracefully on the same scene' }
    caption: 'Same Level-4 high-contrast scene. FNO collapses with error massed at the material interfaces (rel L² 1.64); HNO degrades gracefully (1.18). Hover or tap to swap FFT-based ⇄ FFT-free.'
  stats:
    - value: '19.6%'
      label: 'OOD generalization gap'
      sub: '2.6x lower than FNO'
    - value: '4.6-16.4x'
      label: 'faster inference'
      sub: 'vs FNO / MscaleFNO (FFT-free)'
    - value: '~1.05M'
      label: 'parameters'
      sub: 'param-matched, 5 seeds'
  tldr: >-
    A physics-informed neural operator (HNO) that solves 2-D Helmholtz wave-scattering
    roughly 5-16x faster than Fourier Neural Operators (FNO and MscaleFNO) and generalizes
    far better to unseen high-contrast media -- by re-weighting a fixed, wave-tailored
    basis for each input medium instead of spending a fixed budget of Fourier modes.
  problem: >-
    Fourier Neural Operators (FNO) must spread a fixed budget of Fourier modes uniformly
    across the spectrum, so they saturate and degrade on high-contrast media with sharp
    material interfaces -- exactly the wave-scattering regime that matters. The question
    is whether an FFT-free operator can adapt its basis to each input medium instead.
  approach:
    - >-
      FFT-free branch-trunk operator in the DeepONet family: a hybrid SIREN +
      learnable-Fourier trunk captures local smoothness and global periodicity without any
      global transform.
    - >-
      A dual-path, rank-32 hypernetwork branch emits a bounded multiplicative gate on the
      per-mode coefficients, so the operator re-weights a fixed hybrid basis per input
      medium rather than adding spectral modes.
    - >-
      Evaluated parameter-matched (~1.05M parameters, 5 random seeds) against vanilla
      DeepONet, FNO, and MscaleFNO on 2-D Helmholtz scattering in high-contrast
      inhomogeneous media.
  results:
    - >-
      19.6% out-of-distribution generalization gap -- 2.6x lower than FNO (50.6%, p =
      1.7x10^-3, Cohen's d = 5.1), 5.1x lower than vanilla DeepONet (99.9%), and 6.0x lower
      than MscaleFNO (117.4%); MscaleFNO worsens with branch capacity (148.0% at 4.2x more
      parameters), ruling out capacity starvation.
    - >-
      Being FFT-free, HNO runs 4.6x / 16.4x faster at inference than FNO / MscaleFNO and
      64-245x faster than a multi-threaded FD-PML direct solver.
    - >-
      An architecture ablation attributes essentially all of the OOD gain to the hybrid
      wave-tailored trunk; the bounded coefficient gate is an accuracy-neutral stability
      guard, not the accuracy driver.
    - >-
      Reported honestly: absolute accuracy on extreme-contrast (15:1) OOD samples is
      limited (relative L2 ~ 1.04), so HNO is positioned as a fast many-query surrogate or
      a warm start for refinement loops, not a solver replacement; it also underperforms
      FNO on the elliptic Darcy Flow benchmark (229.8% vs. 70.6% gap), confirming
      specialization for wave / hyperbolic equations.
  abstract: >-
    We introduce the Helmholtz Neural Operator (HNO), a physics-informed, FFT-free
    branch-trunk operator in the DeepONet family for the 2D Helmholtz wave-scattering
    problem on high-contrast inhomogeneous media. HNO pairs a hybrid SIREN +
    learnable-Fourier trunk (local smoothness plus global periodicity) with a dual-path,
    rank-32 hypernetwork branch that emits a bounded multiplicative gate on the per-mode
    coefficients, so the operator adapts to each input medium by re-weighting a fixed
    hybrid basis rather than adding spectral modes. This targets the mode-saturation
    failure of Fourier Neural Operators (FNO), whose fixed Fourier bases must spend modes
    uniformly across the spectrum to resolve sharp material interfaces and therefore show
    diminishing returns on high-contrast media.
  citation: >-
    Ju O Kim and Deokwoo Lee, "FFT-Free Neural Operators for Helmholtz Scattering via
    Adaptive Coefficient Modulation," Applied Sciences (MDPI), vol. 16, no. 12, article
    5997, 2026. DOI: 10.3390/app16125997. Open Access (CC BY).
  pipeline:
    - { label: 'Input medium', sub: 'n2(x)' }
    - { label: 'Spatial encoder', sub: 'context z, S' }
    - { label: 'Rank-32 gate', sub: 'hypernetwork branch', key: true }
    - { label: 'Hybrid basis', sub: 'SIREN + Fourier' }
    - { label: 'Wave field', sub: 'u-hat(x)' }
  figures:
    - src: publications/applsci2026/applsci2026_concept.svg
      section: problem
      alt: 'Fixed Fourier-mode budget (FNO) vs adaptive basis re-weighting (HNO) - the core mechanism'
      caption: 'Core idea: where FNO spends a fixed Fourier-mode budget and saturates at sharp interfaces (50.6% OOD gap), HNO re-weights a fixed SIREN + Fourier basis per input medium - FFT-free - cutting the gap to 19.6%.'
    - src: publications/applsci2026/applsci2026_architecture.jpg
      title: 'HNO architecture'
      section: approach
      alt: HNO architecture overview
      caption: 'HNO architecture: a spatial encoder and a dual-path rank-32 modulator emit a bounded per-mode gate over a hybrid SIREN + Fourier basis. FFT-free, 1,047,440 parameters.'
    - src: publications/applsci2026/applsci2026_dataset.jpg
      title: 'Dataset and difficulty regimes'
      section: problem
      alt: Helmholtz dataset visualization
      caption: 'Dataset: input medium n²(x) and field magnitude |u(x)|. Difficulty rises from Level 1 (~3:1 contrast) to Level 4 (up to 15:1); models train on Level 3 and are tested out-of-distribution on Level 4.'
    - src: publications/applsci2026/applsci2026_oodgap.jpg
      title: 'Out-of-distribution generalization gap'
      section: results
      featured: true
      alt: Parameter-matched OOD generalization gap
      caption: 'Param-matched OOD generalization gap (~1.05M params each, 5 seeds): HNO reaches 19.6% - 2.6x better than FNO, 5.1x better than DeepONet, and 6.0x better than MscaleFNO.'
    - src: publications/applsci2026/applsci2026_qualitative.jpg
      title: 'Qualitative wave-field comparison'
      section: lead
      alt: Qualitative wave-field comparison (HNO vs FNO)
      caption: 'HNO vs FNO wave fields across difficulty: HNO degrades gracefully (relative L2 0.74 / 1.14 / 1.18) while FNO collapses on the high-contrast case (up to 1.64), its error concentrating at material interfaces.'
    - src: publications/applsci2026/applsci2026_speed.svg
      section: results
      featured: true
      alt: 'Speed versus accuracy across models - inference time per forward pass vs out-of-distribution gap'
      caption: 'Speed-accuracy trade-off (param-matched): HNO sits alone in the fast-and-accurate corner (3.05 ms, 19.6% gap); the classical FD-PML solver is exact but 64-245x slower.'
    - src: publications/applsci2026/applsci2026_frequency.jpg
      title: 'Frequency robustness'
      section: results
      featured: true
      alt: Frequency robustness across wavenumber
      caption: 'Frequency robustness: across wavenumber k0 in [10, 30], HNO holds lower, more consistent gaps than FNO (29.9% vs. 55.2% mean gap).'
    - src: publications/applsci2026/applsci2026_ablation.jpg
      title: 'Architecture ablation'
      section: results
      alt: Architecture ablation (basis type and modulator rank)
      caption: 'Ablation: the hybrid SIREN + Fourier trunk drives the gain (19.9% gap, 4.6x lower than SIREN-only); modulator rank 32 is the sweet spot.'
  acknowledgements: This work was supported by the Basic Science Research Program through the National Research Foundation of Korea (NRF) funded by the Ministry of Education (No. 2022R1I1A3069352). We thank the academic editors and the anonymous reviewers for their valuable feedback.
- slug: electronics2025
  title: 'Overcoming Data Scarcity in Non-Contact Respiratory Monitoring: A DTW-Enhanced CNN-LSTM Approach'
  authors: Ju O Kim, Deokwoo Lee
  venue: Electronics (MDPI)
  year: 2025
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/2079-9292/14/20/4120
  bib: KimELECTRONICS2025
  highlight: true
  thumb: publications/electronics2025/electronics2025_thumb.jpg
  compare:
    title: 'DTW-SMOTE-TS augmentation: real vs synthetic cycle'
    aria: 'Toggle between an original respiration cycle and a DTW-SMOTE-TS synthetic sample'
    before: { src: publications/electronics2025/electronics2025_ba_before.jpg, label: 'Original', alt: 'Original measured respiration cycle' }
    after: { src: publications/electronics2025/electronics2025_ba_after.jpg, label: 'DTW-SMOTE-TS', alt: 'Synthetic cycle from DTW-SMOTE-TS that preserves breathing rhythm' }
    caption: 'A synthetic respiration cycle generated from two parents preserves realistic breathing cadence — the rhythm-aware augmentation behind the +5.2-point gain. Hover or tap to swap original ⇄ synthetic.'
  stats:
    - value: '94.3%'
      label: 'accuracy'
      sub: 'normal vs apnea (AUC 0.969)'
    - value: '~104.6K'
      label: 'parameters'
      sub: 'compact CNN-LSTM (104,578)'
    - value: '+5.2%'
      label: 'from DTW augmentation'
      sub: '94.3% vs 89.1% without DTW'
  tldr: >-
    A compact CNN-LSTM that detects apnea events from non-contact UWB radar, using a
    DTW-based augmentation that preserves breathing rhythm to reach 94.3% accuracy despite
    scarce labeled training data.
  problem: >-
    Medical time-series such as respiration are expensive to label, so deep models usually
    starve for data. Standard SMOTE augmentation relies on Euclidean distance, which
    distorts the timing of breathing cycles -- can rhythm-aware augmentation make a compact
    CNN-LSTM viable on a small radar dataset?
  approach:
    - >-
      Replace Euclidean distance in SMOTE with Dynamic Time Warping so synthetic
      respiration samples preserve realistic breathing cadence (DTW-SMOTE-TS).
    - >-
      A hybrid CNN-LSTM: 1-D convolutional blocks extract local waveform morphology and
      stacked LSTM layers model temporal dynamics (~104.6K / 104,578 parameters).
    - >-
      Fully non-contact sensing with a UWB radar (Xethru X4M300), with no body-worn
      electrodes.
    - >-
      Built for data scarcity: trained on a small radar corpus with a held-out 175-sample
      test set -- the regime where standard deep models overfit.
  results:
    - >-
      94.3% accuracy (AUC 0.969) distinguishing normal breathing from apnea events on
      non-contact radar.
    - >-
      Outperforms the non-augmented CNN-LSTM (82.3%), LSTM-only (88.9%), CNN-only (86.2%),
      and traditional ML such as SVM / Random Forest (82-85%).
    - >-
      Ablation: removing DTW from SMOTE costs ~5.2% accuracy (94.3% to 89.1%); using
      CNN-only or LSTM-only drops accuracy by 8.1% and 5.4% respectively.
  abstract: >-
    We propose a CNN-LSTM hybrid architecture with DTW-based SMOTE data augmentation for
    UWB radar respiratory monitoring, achieving 94.3% accuracy with minimal training data.
    This approach addresses the challenge of limited labeled datasets in medical monitoring
    applications. Our system demonstrates robust performance in distinguishing normal
    breathing from apnea events using non-contact ultra-wideband (UWB) radar technology.
    The integration of Dynamic Time Warping (DTW) with Synthetic Minority Over-sampling
    Technique (SMOTE) enables effective data augmentation for time-series respiratory
    signals, while the CNN-LSTM architecture efficiently captures both spatial and temporal
    patterns in the radar data. Experimental results show that our method significantly
    outperforms traditional machine learning approaches and standard deep learning models
    when training data is scarce, making it particularly suitable for real-world medical
    monitoring scenarios where collecting large labeled datasets is challenging and
    expensive.
  citation: >-
    Ju O Kim and Deokwoo Lee, "Overcoming Data Scarcity in Non-Contact Respiratory
    Monitoring: A DTW-Enhanced CNN-LSTM Approach," Electronics (MDPI), vol. 14, no. 20, p.
    4120, October 2025. DOI: 10.3390/electronics14204120. Impact Factor: 2.9 (SCIE).
  pipeline:
    - { label: 'UWB radar', sub: 'Xethru X4M300' }
    - { label: 'Bandpass', sub: '0.1-1 Hz' }
    - { label: 'DTW-SMOTE-TS', sub: 'rhythm-preserving', key: true }
    - { label: 'CNN-LSTM', sub: '~104.6K params' }
    - { label: 'Decision', sub: 'normal / apnea' }
  figures:
    - src: publications/electronics2025/electronics2025_cnnlstm.jpg
      title: 'CNN-LSTM architecture'
      section: approach
      alt: CNN-LSTM hybrid architecture
      caption: 'CNN-LSTM: three 1-D conv blocks (32 -> 64 -> 128) and two stacked LSTMs (64 -> 32) with a dense softmax head (104,578 parameters).'
    - src: publications/electronics2025/electronics2025_augmentation.jpg
      title: 'Augmentation techniques'
      section: approach
      alt: Data augmentation techniques
      caption: 'Augmentation on respiration signals: (a) original, (b) time-shift, (c) amplitude scale, (d) noise, (e) DTW alignment, and (f) the DTW-SMOTE-TS synthetic sample.'
    - src: publications/electronics2025/electronics2025_concept.svg
      section: approach
      alt: 'Why DTW-SMOTE preserves breathing rhythm where Euclidean SMOTE flattens it'
      caption: 'Why DTW beats Euclidean SMOTE: plain SMOTE averages time-misaligned cycles into a flattened cadence; DTW aligns them first, keeping a realistic rhythm - the source of the +5.2-point gain.'
    - src: publications/electronics2025/electronics2025_ladder.svg
      section: results
      featured: true
      alt: 'Augmentation ladder - test accuracy with no / basic / full DTW-SMOTE-TS augmentation'
      caption: 'The thesis in one chart: no augmentation 82.3%, plain SMOTE 89.1%, DTW-SMOTE-TS 94.3% - a +12-point gain over the baseline.'
    - src: publications/electronics2025/electronics2025_confusion.jpg
      title: 'Confusion matrix'
      section: lead
      alt: Confusion matrix
      caption: 'Held-out test set (175 samples): 121/125 normal and 44/50 apnea correct - 94.3% accuracy.'
    - src: publications/electronics2025/electronics2025_roc.jpg
      title: 'ROC and AUC comparison'
      section: results
      featured: true
      alt: ROC, precision-recall and AUC comparison
      caption: 'Model comparison (ROC, PR and AUC): the proposed CNN-LSTM (marked *) ranks highest across variants; headline AUC 0.969 (five-fold mean).'
    - src: publications/electronics2025/electronics2025_ablation.jpg
      title: 'Architecture ablation'
      section: results
      alt: Architecture ablation study
      caption: 'Ablation over CNN blocks, LSTM width, dropout and BatchNorm: the chosen config (3 blocks, medium LSTM, 0.3 dropout, BatchNorm) reaches 94.3%.'
  acknowledgements: This research was supported by the Basic Science Research Program through the National Research Foundation of Korea (NRF) funded by the Ministry of Education. We thank the anonymous reviewers for their valuable feedback and suggestions.
