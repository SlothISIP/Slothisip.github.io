# Single source for all publications. Detail pubs carry abstract/figures/acknowledgements; markers resolved.
- slug: applsci2026
  title: 'FFT-Free Neural Operators for Helmholtz Scattering via Adaptive Coefficient Modulation'
  authors: Ju O Kim, Deokwoo Lee
  venue: Applied Sciences (MDPI)
  year: 2026
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/2076-3417/16/12/5997
  bib: KimAPPLSCI2026
  highlight: false
  stats:
    - value: '19.6%'
      label: 'OOD generalization gap'
      sub: '2.6x lower than FNO'
    - value: '4.6-16.4x'
      label: 'faster inference'
      sub: 'vs FNO / MscaleFNO (FFT-free)'
    - value: '~1.05M'
      label: 'parameters'
      sub: 'param-matched, 5 seeds'
  tldr: >-
    A physics-informed neural operator (HNO) that solves 2-D Helmholtz wave-scattering
    roughly 5-16x faster than Fourier Neural Operators (FNO and MscaleFNO) and generalizes
    far better to unseen high-contrast media -- by re-weighting a fixed, wave-tailored
    basis for each input medium instead of spending a fixed budget of Fourier modes.
  problem: >-
    Fourier Neural Operators (FNO) must spread a fixed budget of Fourier modes uniformly
    across the spectrum, so they saturate and degrade on high-contrast media with sharp
    material interfaces -- exactly the wave-scattering regime that matters. The question
    is whether an FFT-free operator can adapt its basis to each input medium instead.
  approach:
    - >-
      FFT-free branch-trunk operator in the DeepONet family: a hybrid SIREN +
      learnable-Fourier trunk captures local smoothness and global periodicity without any
      global transform.
    - >-
      A dual-path, rank-32 hypernetwork branch emits a bounded multiplicative gate on the
      per-mode coefficients, so the operator re-weights a fixed hybrid basis per input
      medium rather than adding spectral modes.
    - >-
      Evaluated parameter-matched (~1.05M parameters, 5 random seeds) against vanilla
      DeepONet, FNO, and MscaleFNO on 2-D Helmholtz scattering in high-contrast
      inhomogeneous media.
  results:
    - >-
      19.6% out-of-distribution generalization gap -- 2.6x lower than FNO (50.6%, p =
      1.7x10^-3, Cohen's d = 5.1), 5.1x lower than vanilla DeepONet (99.9%), and 6.0x lower
      than MscaleFNO (117.4%); MscaleFNO worsens with branch capacity (148.0% at 4.2x more
      parameters), ruling out capacity starvation.
    - >-
      Being FFT-free, HNO runs 4.6x / 16.4x faster at inference than FNO / MscaleFNO and
      64-245x faster than a multi-threaded FD-PML direct solver.
    - >-
      An architecture ablation attributes essentially all of the OOD gain to the hybrid
      wave-tailored trunk; the bounded coefficient gate is an accuracy-neutral stability
      guard, not the accuracy driver.
    - >-
      Reported honestly: absolute accuracy on extreme-contrast (15:1) OOD samples is
      limited (relative L2 ~ 1.04), so HNO is positioned as a fast many-query surrogate or
      a warm start for refinement loops, not a solver replacement; it also underperforms
      FNO on the elliptic Darcy Flow benchmark (229.8% vs. 70.6% gap), confirming
      specialization for wave / hyperbolic equations.
  abstract: >-
    We introduce the Helmholtz Neural Operator (HNO), a physics-informed, FFT-free
    branch-trunk operator in the DeepONet family for the 2D Helmholtz wave-scattering
    problem on high-contrast inhomogeneous media. HNO pairs a hybrid SIREN +
    learnable-Fourier trunk (local smoothness plus global periodicity) with a dual-path,
    rank-32 hypernetwork branch that emits a bounded multiplicative gate on the per-mode
    coefficients, so the operator adapts to each input medium by re-weighting a fixed
    hybrid basis rather than adding spectral modes. This targets the mode-saturation
    failure of Fourier Neural Operators (FNO), whose fixed Fourier bases must spend modes
    uniformly across the spectrum to resolve sharp material interfaces and therefore show
    diminishing returns on high-contrast media.
  citation: >-
    Ju O Kim and Deokwoo Lee, "FFT-Free Neural Operators for Helmholtz Scattering via
    Adaptive Coefficient Modulation," Applied Sciences (MDPI), vol. 16, no. 12, article
    5997, 2026. DOI: 10.3390/app16125997. Open Access (CC BY).
  figures:
    - src: publications/applsci2026/applsci2026_flow.svg
      section: lead
      alt: 'HNO method overview - FFT-free branch-trunk operator that re-weights a fixed wave-tailored basis per input medium'
      caption: 'How HNO works: a spatial encoder reads the input medium n2(x); a rank-32 hypernetwork branch emits a bounded per-mode gate dphi that re-weights a fixed SIREN + learnable-Fourier basis (no added Fourier modes, no global transform), and the gated coefficients reconstruct the wave field u-hat(x). The two highlighted blocks are the paper''s novelty: the dual-path branch + bounded gate, and the re-weighting of a fixed basis.'
    - src: publications/applsci2026/applsci2026_architecture.jpg
      section: approach
      alt: HNO architecture overview
      caption: 'Helmholtz Neural Operator (HNO) architecture (Abstract section header image). The SpatialFeatureEncoder maps the input medium n²(x) to a pooled context vector z and a spatial feature tensor S; the dual-path EnhancedModulator combines a rank-32 LoRA global path with a 1x1-convolution spatial path into a bounded per-mode multiplicative gate Δφ ∈ [-0.5, 0.5]; and the HybridBasisNetwork (SIREN + learnable Fourier, K = 64) supplies the trunk basis evaluated at coordinates x. The wave field is reconstructed as û = Σ_k α_k(n²)·φ_k(x)·(1 + Δφ_k). The architecture is FFT-free -- spectral structure is captured by learnable Fourier features rather than by a global transform (1,047,440 parameters total).'
    - src: publications/applsci2026/applsci2026_dataset.jpg
      section: problem
      alt: Helmholtz dataset visualization
      caption: 'Dataset visualization. Top row: input medium n²(x) and wave-field magnitude |u(x)|; bottom row: real and imaginary parts of the field. Level 1 (a,b,e,f) is a simple single-scatterer geometry (displayed sample ~2.3:1 contrast, dataset maximum 3:1); Level 4 (c,d,g,h) is a high-contrast multiple-scatterer regime (displayed sample ~12:1, dataset maximum 15:1). The red diamond S marks the point-source location. Models train only on random-blob Level 3 media and are evaluated out-of-distribution on Level 4, so the rising geometric and spectral complexity from Level 1 to Level 4 is exactly where fixed Fourier bases (FNO) struggle.'
    - src: publications/applsci2026/applsci2026_oodgap.jpg
      section: results
      alt: Parameter-matched OOD generalization gap
      caption: 'Parameter-matched comparison of the out-of-distribution generalization gap across DeepONet, FNO, MscaleFNO, and HNO (~1.05M parameters each, 5 seeds). HNO attains a 19.6% gap -- 2.6x better than FNO (p = 1.7x10^-3), 5.1x better than vanilla DeepONet (p = 8.2x10^-3), and 6.0x better than MscaleFNO (p = 2.4x10^-6). Adding parallel frequency-scaled branches (MscaleFNO) more than doubles the gap relative to FNO, and a 4.2x-larger MscaleFNO worsens further to 148.0%, confirming the collapse is architectural rather than capacity-related.'
    - src: publications/applsci2026/applsci2026_qualitative.jpg
      section: results
      alt: Qualitative wave-field comparison (HNO vs FNO)
      caption: 'Qualitative comparison across difficulty (seed-42 models). Rows: an easy in-distribution Level 3 medium, a moderate-contrast Level 4 medium, and a high-contrast Level 4 failure case. Columns: input medium n², ground-truth |u|, HNO |û|, and FNO |û| (relative L² annotated). HNO degrades gracefully (0.74 / 1.14 / 1.18) while FNO collapses on the high-contrast case (0.81 / 1.13 / 1.64); FNO error concentrates at material interfaces -- the mode-saturation signature -- whereas HNO stays more uniform through medium-conditioned coefficient modulation.'
    - src: publications/applsci2026/applsci2026_frequency.jpg
      section: results
      alt: Frequency robustness across wavenumber
      caption: 'Frequency robustness: generalization gap across wavenumber k0. Both models train at k0 = 20 (dashed line); HNO (blue) holds lower, more consistent gaps than the FNO baseline (red) across the tested k0 in [10, 30] -- about 1.8x better average robustness with 56% lower variance (29.9% vs. 55.2% mean gap). The behavior is a property of the fixed-spectral-basis architecture rather than of capacity: the parameter-matched FNO-5m5L sweep widens the margin to 2.2x.'
    - src: publications/applsci2026/applsci2026_ablation.jpg
      section: results
      alt: Architecture ablation (basis type and modulator rank)
      caption: 'Architecture ablation (3 seeds). (a) Basis type: the hybrid SIREN + Fourier trunk (19.9% gap) is 4.6x lower than SIREN-only and 2.2x lower than Fourier-only, identifying the wave-tailored trunk as the load-bearing component. (b) Modulator rank: rank 32 is the critical operating point, with both lower (8, 16) and higher (64) ranks degrading substantially. A five-seed re-run and a modulation-presence ablation attribute essentially all of the OOD improvement to the hybrid trunk, with the bounded coefficient gate acting as an accuracy-neutral stability mechanism.'
  acknowledgements: This work was supported by the Basic Science Research Program through the National Research Foundation of Korea (NRF) funded by the Ministry of Education (No. 2022R1I1A3069352). We thank the academic editors and the anonymous reviewers for their valuable feedback.
- slug: electronics2025
  title: 'Overcoming Data Scarcity in Non-Contact Respiratory Monitoring: A DTW-Enhanced CNN-LSTM Approach'
  authors: Ju O Kim, Deokwoo Lee
  venue: Electronics (MDPI)
  year: 2025
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/2079-9292/14/20/4120
  bib: KimELECTRONICS2025
  highlight: true
  stats:
    - value: '94.3%'
      label: 'accuracy'
      sub: 'normal vs apnea (AUC 0.969)'
    - value: '~104.6K'
      label: 'parameters'
      sub: 'compact CNN-LSTM'
    - value: '+5.2%'
      label: 'from DTW augmentation'
      sub: '94.3% vs 89.1% without DTW'
  tldr: >-
    A compact CNN-LSTM that detects apnea events from non-contact UWB radar, using a
    DTW-based augmentation that preserves breathing rhythm to reach 94.3% accuracy despite
    scarce labeled training data.
  problem: >-
    Medical time-series such as respiration are expensive to label, so deep models usually
    starve for data. Standard SMOTE augmentation relies on Euclidean distance, which
    distorts the timing of breathing cycles -- can rhythm-aware augmentation make a compact
    CNN-LSTM viable on a small radar dataset?
  approach:
    - >-
      Replace Euclidean distance in SMOTE with Dynamic Time Warping so synthetic
      respiration samples preserve realistic breathing cadence (DTW-SMOTE-TS).
    - >-
      A hybrid CNN-LSTM: 1-D convolutional blocks extract local waveform morphology and
      stacked LSTM layers model temporal dynamics (~104.6K parameters).
    - >-
      Fully non-contact sensing with a UWB radar (Xethru X4M300), with no body-worn
      electrodes.
  results:
    - >-
      94.3% accuracy (AUC 0.969) distinguishing normal breathing from apnea events on
      non-contact radar.
    - >-
      Outperforms the non-augmented CNN-LSTM (82.3%), LSTM-only (88.9%), CNN-only (86.2%),
      and traditional ML such as SVM / Random Forest (82-85%).
    - >-
      Ablation: removing DTW from SMOTE costs ~5.2% accuracy (94.3% to 89.1%); using
      CNN-only or LSTM-only drops accuracy by 8.1% and 5.4% respectively.
  abstract: >-
    We propose a CNN-LSTM hybrid architecture with DTW-based SMOTE data augmentation for
    UWB radar respiratory monitoring, achieving 94.3% accuracy with minimal training data.
    This approach addresses the challenge of limited labeled datasets in medical monitoring
    applications. Our system demonstrates robust performance in distinguishing normal
    breathing from apnea events using non-contact ultra-wideband (UWB) radar technology.
    The integration of Dynamic Time Warping (DTW) with Synthetic Minority Over-sampling
    Technique (SMOTE) enables effective data augmentation for time-series respiratory
    signals, while the CNN-LSTM architecture efficiently captures both spatial and temporal
    patterns in the radar data. Experimental results show that our method significantly
    outperforms traditional machine learning approaches and standard deep learning models
    when training data is scarce, making it particularly suitable for real-world medical
    monitoring scenarios where collecting large labeled datasets is challenging and
    expensive.
  citation: >-
    Ju O Kim and Deokwoo Lee, "Overcoming Data Scarcity in Non-Contact Respiratory
    Monitoring: A DTW-Enhanced CNN-LSTM Approach," Electronics (MDPI), vol. 14, no. 20, p.
    4120, October 2025. DOI: 10.3390/electronics14204120. Impact Factor: 2.9 (SCIE).
  figures:
    - src: publications/electronics2025/electronics2025_flow.svg
      section: lead
      alt: 'DTW-SMOTE CNN-LSTM apnea-detection pipeline overview'
      caption: 'How the system works: a UWB radar captures chest motion, a 0.1-1 Hz bandpass isolates respiration, and DTW-SMOTE-TS augmentation (highlighted) synthesises minority apnea samples while preserving breathing cadence - the paper''s key idea - before a compact CNN-LSTM classifies normal vs apnea.'
    - src: publications/electronics2025/electronics2025_system.jpg
      section: problem
      alt: System architecture overview
      caption: 'System architecture overview: a UWB radar (Xethru X4M300, 10 Hz, ~600 samples/min) captures chest-surface motion; signals are bandpass-filtered (0.1-1 Hz) and augmented with DTW-SMOTE-TS, then classified by a CNN-LSTM network into normal vs. abnormal breathing.'
    - src: publications/electronics2025/electronics2025_cnnlstm.jpg
      section: approach
      alt: CNN-LSTM hybrid architecture
      caption: 'CNN-LSTM hybrid architecture: three 1-D convolutional blocks (32 -> 64 -> 128 filters) extract local signal morphology, two stacked LSTM layers (64 -> 32 units) model temporal dynamics, and a dense softmax head produces the normal/abnormal decision (~104.6K parameters).'
    - src: publications/electronics2025/electronics2025_augmentation.jpg
      section: approach
      alt: Data augmentation techniques
      caption: 'Data augmentation on respiratory signals: (a) original signal, (b) time shifting, (c) amplitude scaling, (d) Gaussian-noise addition, (e) DTW alignment, and (f) the resulting DTW-SMOTE-TS synthetic sample generated between two parent signals.'
    - src: publications/electronics2025/electronics2025_confusion.jpg
      section: results
      alt: Confusion matrix
      caption: 'Confusion matrix on the held-out test set (175 samples): 121/125 normal and 44/50 abnormal cases classified correctly -- 94.3% overall accuracy (normal precision 0.953 / recall 0.968; abnormal precision 0.917 / recall 0.880).'
    - src: publications/electronics2025/electronics2025_roc.jpg
      section: results
      alt: ROC, precision-recall and AUC comparison
      caption: 'Model comparison: (a) ROC curves, (b) precision-recall curves, and (c) AUC scores across model variants. The proposed CNN-LSTM attains the highest AUC (0.974), ahead of CNN-only, Bi-LSTM, LSTM-only, 1D-ResNet, and GRU baselines.'
    - src: publications/electronics2025/electronics2025_ablation.jpg
      section: results
      alt: Architecture ablation study
      caption: 'Architecture ablation -- accuracy versus (a) number of CNN blocks, (b) LSTM unit width, (c) dropout rate, and (d) batch normalization. The chosen configuration (3 blocks, medium LSTM, 0.3 dropout, with BatchNorm) reaches 94.3%.'
  acknowledgements: This research was supported by the Basic Science Research Program through the National Research Foundation of Korea (NRF) funded by the Ministry of Education. We thank the anonymous reviewers for their valuable feedback and suggestions.
- slug: springer2024
  title: Calibrating a Three-Viewpoints Thermal Camera with Few Correspondences
  authors: Ju O Kim, Jieun Kim, Deokwoo Lee
  venue: Journal of Signal Processing Systems (Springer)
  year: 2024
  badge: sci
  detail: true
  paper_url: https://link.springer.com/article/10.1007/s11265-023-01837-z
  bib: KimSPRINGER2024
  highlight: false
  stats:
    - value: '<0.8 px'
      label: 'reprojection error'
      sub: '~0.58-0.66 px in practice'
    - value: '3-5'
      label: 'correspondences needed'
      sub: 'vs 15-20 for Zhang''s method'
    - value: '>180 deg'
      label: 'view baseline'
      sub: 'minimal inter-view overlap'
  tldr: >-
    A vanishing-point calibration method for a wide-baseline (>180-degree) three-viewpoint
    thermal camera that reaches sub-0.8-pixel accuracy from just 3-5 correspondences --
    where feature-hungry classical calibration fails on near-featureless thermal imagery.
  problem: >-
    Thermal cameras lack the rich texture that standard calibration relies on, and a
    three-view rig separated by more than 180 degrees has almost no overlap between views,
    so methods like Zhang's or structure-from-motion need dense correspondences that simply
    do not exist here.
  approach:
    - >-
      A three-stage pipeline: vanishing-point detection, geometric-constraint
      establishment, and multi-view calibration optimization.
    - >-
      RANSAC-based line fitting detects dominant line segments, clusters them by
      orientation, and intersects them to recover vanishing points along the principal
      scene directions (horizontal, vertical, depth).
    - >-
      VDSR super-resolution enhances the low-quality thermal checkerboard images before
      corner detection; the method operates with as few as three to five correspondences
      per image pair.
  results:
    - >-
      Mean reprojection error below 0.8 pixels across all three viewpoints (about 0.58-0.66
      pixels in practice).
    - >-
      Needs only 3-5 correspondences per view -- versus more than 15-20 for Zhang's method
      or the Bouguet toolbox, and dense features for COLMAP -- while supporting >180-degree
      wide baselines those methods handle poorly.
  abstract: >-
    We propose vanishing point-based calibration for a three-viewpoint thermal camera
    system with greater than 180-degree separation and minimal overlap between views. This
    method enables accurate calibration with limited feature correspondences. The proposed
    approach is particularly suited for thermal imaging systems where traditional
    calibration methods struggle due to the lack of distinctive features and minimal
    overlap between camera viewpoints. Our vanishing point-based method achieves reliable
    calibration by exploiting geometric constraints inherent in the camera configuration,
    making it practical for wide-baseline multi-view thermal camera systems used in
    surveillance and monitoring applications.
  citation: >-
    Ju O Kim, Jieun Kim, and Deokwoo Lee, "Calibrating a Three-Viewpoints Thermal Camera
    with Few Correspondences," Journal of Signal Processing Systems (Springer), vol. 96, no.
    3, pp. 191-202, 2024. DOI: 10.1007/s11265-023-01837-z. Impact Factor: 1.8 (SCI).
  figures:
    - src: publications/springer2024/springer2024_flow.svg
      section: lead
      alt: 'Vanishing-point thermal-camera calibration pipeline overview'
      caption: 'How calibration works: VDSR super-resolution sharpens the low-texture thermal checkerboard, RANSAC fits dominant lines, and their intersection yields vanishing points (highlighted) - the geometric constraint that replaces the dense feature correspondences a >180-degree, low-overlap three-view rig cannot provide - feeding a multi-view optimization to sub-0.8 px error.'
    - src: publications/springer2024/springer2024_hardware.jpg
      section: problem
      alt: Three-viewpoint thermal camera hardware
      caption: 'Three-viewpoint thermal camera hardware: (a) the fabricated wide-baseline rig and (b, c) its CAD model, with viewpoints separated by more than 180 degrees and minimal inter-view overlap.'
    - src: publications/springer2024/springer2024_flow.jpg
      section: approach
      alt: Calibration pipeline flowchart
      caption: 'Calibration pipeline: a captured checkerboard image is enhanced by VDSR super-resolution; intrinsic parameters follow from corner detection, while extrinsic parameters follow from line detection and vanishing-point extraction.'
    - src: publications/springer2024/springer2024_vp.jpg
      section: approach
      alt: Vanishing-point principle
      caption: 'Vanishing-point principle: parallel lines in the real world (A, B, C) project to a common vanishing point (VP) in the image, supplying the geometric constraint used to relate the camera viewpoints.'
    - src: publications/springer2024/springer2024_vp_detection.jpg
      section: approach
      alt: Vanishing-point detection
      caption: 'Vanishing-point detection: dominant line segments are fit on the thermal checkerboard (a) and intersected (b); the intersection of the fitted lines yields the vanishing point used as a calibration constraint.'
    - src: publications/springer2024/springer2024_reprojection.jpg
      section: results
      alt: Reprojection error per viewpoint
      caption: 'Reprojection error per viewpoint (a, b, c): the mean reprojection error stays below ~0.66 pixels across all three thermal camera views, confirming accurate calibration from only a few correspondences.'
  acknowledgements: This work was supported by the National Research Foundation of Korea (NRF) grant funded by the Korean government. We thank the reviewers for their valuable feedback and suggestions that helped improve this work.
- slug: sensors2020
  title: Detection of Abnormal Respiration from Multiple-Input Respiratory Signals
  authors: Ju O Kim, Deokwoo Lee
  venue: SENSORS (MDPI)
  year: 2020
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/1424-8220/20/10/2977
  bib: KimSENSORS2020
  highlight: false
  stats:
    - value: '67% -> 93%'
      label: 'accuracy'
      sub: 'single -> triple-input fusion'
    - value: 'Z-domain'
      label: 'pole-zero decision rule'
      sub: 'normal vs apnea in distinct regions'
  tldr: >-
    A non-contact UWB-radar method that detects abnormal breathing (apnea) from the
    pole-zero signature of respiration in the Z-domain, lifting accuracy from 67% with a
    single input to 93% by fusing multiple acquisitions.
  problem: >-
    Reliable non-contact apnea detection from a single radar trace is noisy and
    error-prone. The question is whether combining a Z-domain (pole-zero) view of the
    signal with multi-input fusion can make abnormal-respiration detection robust.
  approach:
    - >-
      Z-domain analysis: transform the respiration signals and read the pole-zero positions
      of the B(z)/A(z) ratio to separate normal from abnormal status.
    - >-
      A custom filter bank combines 0.1-0.5 Hz bandpass filtering with adaptive high-pass
      filtering of varying cutoff, exposing apnea events as transient bursts.
    - >-
      Multi-input fusion sums several acquisitions from a single Novelda X4 UWB sensor
      (30-50 cm from the chest) to suppress noise.
  results:
    - >-
      Detection accuracy improves from 67% with a single input to 93% with triple inputs.
    - >-
      In the Z-domain, normal, shallow, and apnea breathing occupy distinct regions of the
      pole-zero representation, enabling simple decision rules.
  abstract: >-
    We propose Z-domain and filter-based approaches for detecting abnormal respiration from
    single and multiple UWB radar signals with 93% accuracy. The method combines
    time-domain and frequency-domain analysis for robust detection. Ultra-wideband (UWB)
    radar technology has emerged as a promising non-contact method for respiratory
    monitoring. This paper presents a novel approach that processes multiple respiratory
    signals simultaneously using advanced signal processing techniques. By employing
    Z-domain transformation and sophisticated filtering methods, our system can effectively
    distinguish between normal and abnormal breathing patterns, including apnea events, with
    high accuracy. The proposed method demonstrates robust performance across various
    experimental conditions and shows potential for real-world applications in healthcare
    monitoring and sleep disorder detection.
  citation: >-
    Ju O Kim and Deokwoo Lee, "Detection of Abnormal Respiration from Multiple-Input
    Respiratory Signals," Sensors (MDPI), vol. 20, no. 10, p. 2977, 2020. DOI:
    10.3390/s20102977. Impact Factor: 3.9 (SCIE).
  figures:
    - src: publications/sensors2020/sensors2020_flow.svg
      section: lead
      alt: 'Z-domain multi-input respiration / apnea detection pipeline overview'
      caption: 'How detection works: a UWB radar feeds a filter bank (0.1-0.5 Hz bandpass + adaptive high-pass); a Z-domain pole-zero analysis of B(z)/A(z) (highlighted) places normal, shallow and apnea breathing in distinct regions, and summing multiple acquisitions lifts accuracy from 67% (single input) to 93% (triple input).'
    - src: publications/sensors2020/sensors2020_respiration.jpg
      section: problem
      alt: Experiment setup
      caption: 'Experiment setup for non-contact respiratory monitoring: a UWB radar module captures chest-surface motion while the recorded respiration signal is displayed on the acquisition PC.'
    - src: publications/sensors2020/sensors2020_flowchart.jpg
      section: approach
      alt: Overall processing pipeline
      caption: 'Overall processing pipeline: respiration signals are acquired in the time domain (single- and multiple-input), analyzed in the Z-domain or through a tunable high-pass filter, and combined to decide whether abnormal respiration (apnea) is present.'
    - src: publications/sensors2020/sensors2020_apnea.jpg
      section: problem
      alt: Abnormal (apnea) respiration examples
      caption: 'Two examples of abnormal (apnea) respiration measured by the UWB radar: regular breathing oscillations are interrupted by flat apnea intervals where chest-surface motion stops.'
    - src: publications/sensors2020/sensors2020_zdomain.jpg
      section: results
      alt: Z-domain pole-zero classification
      caption: 'Z-domain classification: pole-zero plots of the transfer ratios B(z)/A(z) on the complex z-plane. Normal and abnormal (apnea) respiration yield distinct pole-zero distributions relative to the unit circle, giving a simple decision rule.'
    - src: publications/sensors2020/sensors2020_filter.jpg
      section: results
      alt: High-pass filtered responses (triple input)
      caption: 'High-pass-filtered responses for three combined inputs across breathing combinations, from (a) all-normal to (d) all-apnea. Apnea events appear as sharp transient bursts whose count grows with apnea content, enabling detection from the filtered peaks.'
  acknowledgements: This research was supported by Keimyung University. We thank the reviewers for their valuable feedback and suggestions.
