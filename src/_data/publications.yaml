  thumb: publications/springer2024/springer2024_thumb.jpg
  stats:
    - value: '<0.8 px'
      label: 'reprojection error'
      sub: '~0.58-0.66 px in practice'
    - value: '~5'
      label: '2D-3D point pairs'
      sub: 'no feature matching (vanishing points)'
    - value: '>180 deg'
      label: 'view baseline'
      sub: 'minimal inter-view overlap'
  tldr: >-
    A vanishing-point calibration method for a wide-baseline (>180-degree) three-viewpoint
    thermal camera that reaches sub-0.8-pixel accuracy without any correspondence matching --
    where the non-overlapping views and near-featureless thermal imagery make classical
    feature-matching calibration infeasible.
  problem: >-
    Thermal cameras lack the rich texture that standard calibration relies on, and a
    three-view rig separated by more than 180 degrees has almost no overlap between views,
    so methods like Zhang's or structure-from-motion need dense correspondences that simply
    do not exist here.
  approach:
    - >-
      A three-stage pipeline: vanishing-point detection, geometric-constraint
      establishment, and multi-view calibration optimization.
    - >-
      Line fitting detects dominant line segments, clusters them by
      orientation, and intersects them to recover vanishing points along the principal
      scene directions (horizontal, vertical, depth).
    - >-
      VDSR super-resolution enhances the low-quality thermal checkerboard images before
      corner detection; the intrinsics are recovered from as few as five 2D-3D point pairs
      (optimized with the Levenberg-Marquardt algorithm), with no correspondence matching
      between views.
  results:
    - >-
      Mean reprojection error below 0.8 pixels across all three viewpoints (about 0.58-0.66
      pixels in practice).
    - >-
      Calibrates the three views from vanishing points with no correspondence matching
      (only ~5 2D-3D point pairs for the intrinsics), on a rig whose >180-degree (about
      240-degree) inter-view rotation and minimal overlap make stereo / SfM feature
      matching infeasible.
  abstract: >-
    We propose vanishing point-based calibration for a three-viewpoint thermal camera
    system with greater than 180-degree separation and minimal overlap between views. This
    method enables accurate calibration with limited feature correspondences. The proposed
    approach is particularly suited for thermal imaging systems where traditional
    calibration methods struggle due to the lack of distinctive features and minimal
    overlap between camera viewpoints. Our vanishing point-based method achieves reliable
    calibration by exploiting geometric constraints inherent in the camera configuration,
    making it practical for wide-baseline multi-view thermal camera systems used in
    surveillance and monitoring applications.
  citation: >-
    Ju O Kim, Jieun Kim, and Deokwoo Lee, "Calibrating a Three-Viewpoints Thermal Camera
    with Few Correspondences," Journal of Signal Processing Systems (Springer), vol. 96, no.
    3, pp. 191-202, 2024. DOI: 10.1007/s11265-023-01837-z. Impact Factor: 1.8 (SCI).
  pipeline:
    - { label: 'Thermal board', sub: 'low-texture' }
    - { label: 'VDSR', sub: 'super-resolution' }
    - { label: 'Line fit', sub: 'dominant lines' }
    - { label: 'Vanishing pts', sub: 'geometric constraint', key: true }
    - { label: 'Multi-view calib', sub: '<0.8 px' }
  figures:
    - src: publications/springer2024/springer2024_sightlines.svg
      section: problem
      alt: 'Top-down sightlines of a >180-degree three-view rig with minimal overlap'
      caption: 'Why a wide-baseline rig starves classical calibration: with views spanning about 240 degrees, each scene is captured by only one view - leaving no shared features for Zhang or structure-from-motion to match. This method uses vanishing points instead.'
    - src: publications/springer2024/springer2024_hardware.jpg
      title: 'Three-viewpoint thermal rig'
      section: lead
      alt: Three-viewpoint thermal camera hardware
      caption: 'Three-viewpoint thermal rig: (a) the fabricated wide-baseline hardware and (b, c) its CAD model, viewpoints separated by more than 180 degrees.'
    - src: publications/springer2024/springer2024_flow.jpg
      title: 'Calibration pipeline'
      section: approach
      alt: Calibration pipeline flowchart
      caption: 'Calibration pipeline: intrinsics come from corner detection on the VDSR-enhanced checkerboard, extrinsics from line detection and vanishing points - succeeding from only a few correspondences.'
    - src: publications/springer2024/springer2024_vp.jpg
      title: 'Vanishing-point principle'
      section: approach
      alt: Vanishing-point principle
      caption: 'Vanishing-point principle: real-world parallel lines (A, B, C) project to a common vanishing point (VP), the geometric constraint that relates the viewpoints.'
    - src: publications/springer2024/springer2024_vp_detection.jpg
      title: 'Vanishing-point detection'
      section: approach
      alt: Vanishing-point detection
      caption: 'Vanishing-point detection: dominant lines are fit on the thermal checkerboard (a) and intersected (b) to yield the vanishing point.'
    - src: publications/springer2024/springer2024_compare.svg
      section: results
      featured: true
      alt: 'Capability comparison: vanishing-point calibration vs correspondence-based stereo / SfM / Zhang'
      caption: 'Stereo, structure-from-motion and Zhang-style calibration all need overlapping views and matched features - absent on this rig. This method recovers the geometry from vanishing points at under 0.8 px error.'
    - src: publications/springer2024/springer2024_reprojection.jpg
      title: 'Reprojection error per viewpoint'
      section: results
      featured: true
      alt: Reprojection error per viewpoint
      caption: 'Reprojection error per viewpoint (a, b, c): below ~0.66 px across all three thermal views.'
    - src: publications/springer2024/springer2024_rotation.svg
      section: results
      featured: true
      alt: 'Average rotation error vs prior calibration work (Table 4): sub-degree without using correspondences'
      caption: 'Rotation accuracy vs prior work (Table 4): 0.43-degree average error - sub-degree and, unlike the methods compared, with no correspondence matching.'
  acknowledgements: This work was supported by the National Research Foundation of Korea (NRF) grant funded by the Korean government. We thank the reviewers for their valuable feedback and suggestions that helped improve this work.
- slug: sensors2020
  title: Detection of Abnormal Respiration from Multiple-Input Respiratory Signals
  authors: Ju O Kim, Deokwoo Lee
  venue: SENSORS (MDPI)
  year: 2020
  badge: scie
  detail: true
  paper_url: https://www.mdpi.com/1424-8220/20/10/2977
  bib: KimSENSORS2020
  highlight: false
  thumb: publications/sensors2020/sensors2020_thumb.jpg
  compare:
    title: 'High-pass-filtered radar response: normal vs apnea'
    aria: 'Toggle between an all-normal and an all-apnea filtered radar response'
    before: { src: publications/sensors2020/sensors2020_ba_before.jpg, label: 'Normal', alt: 'All-normal filtered radar response stays flat' }
    after: { src: publications/sensors2020/sensors2020_ba_after.jpg, label: 'Apnea', alt: 'All-apnea filtered radar response erupts into transient bursts' }
    caption: 'Regular breathing keeps the high-pass-filtered response flat; apnea erupts into sharp transient bursts whose count grows with apnea content — the signature the detector keys on. Hover or tap to swap normal ⇄ apnea.'
  stats:
    - value: '67% -> 93%'
      label: 'accuracy'
      sub: 'single -> triple-input fusion'
    - value: 'Z-domain'
      label: 'pole-zero decision rule'
      sub: 'normal vs apnea in distinct regions'
  tldr: >-
    A non-contact UWB-radar method that detects abnormal breathing (apnea) from the
    pole-zero signature of respiration in the Z-domain, lifting accuracy from 67% with a
    single input to 93% by fusing multiple acquisitions.
  problem: >-
    Reliable non-contact apnea detection from a single radar trace is noisy and
    error-prone. The question is whether combining a Z-domain (pole-zero) view of the
    signal with multi-input fusion can make abnormal-respiration detection robust.
  approach:
    - >-
      Z-domain analysis: transform the respiration signals and read the pole-zero positions
      of the B(z)/A(z) ratio to separate normal from abnormal status.
    - >-
      A custom filter bank combines 0.1-0.5 Hz bandpass filtering with adaptive high-pass
      filtering of varying cutoff, exposing apnea events as transient bursts.
    - >-
      Multi-input fusion sums several acquisitions from a single Novelda X4 UWB sensor
      (30-50 cm from the chest) to suppress noise.
  results:
    - >-
      Detection accuracy improves from 67% with a single input to 93% with triple inputs.
    - >-
      In the Z-domain, normal and apnea (abnormal) breathing occupy distinct regions of the
      pole-zero representation, enabling simple decision rules.
  abstract: >-
    We propose Z-domain and filter-based approaches for detecting abnormal respiration from
    single and multiple UWB radar signals with 93% accuracy. The method combines
    time-domain and frequency-domain analysis for robust detection. Ultra-wideband (UWB)
    radar technology has emerged as a promising non-contact method for respiratory
    monitoring. This paper presents a novel approach that processes multiple respiratory
    signals simultaneously using advanced signal processing techniques. By employing
    Z-domain transformation and sophisticated filtering methods, our system can effectively
    distinguish between normal and abnormal breathing patterns, including apnea events, with
    high accuracy. The proposed method demonstrates robust performance across various
    experimental conditions and shows potential for real-world applications in healthcare
    monitoring and sleep disorder detection.
  citation: >-
    Ju O Kim and Deokwoo Lee, "Detection of Abnormal Respiration from Multiple-Input
    Respiratory Signals," Sensors (MDPI), vol. 20, no. 10, p. 2977, 2020. DOI:
    10.3390/s20102977. Impact Factor: 3.9 (SCIE).
  pipeline:
    - { label: 'UWB radar', sub: 'Novelda X4' }
    - { label: 'Filter bank', sub: 'BP + adaptive HPF' }
    - { label: 'Z-domain', sub: 'pole-zero rule', key: true }
    - { label: 'Multi-input fusion', sub: 'sum acquisitions' }
    - { label: 'Decision', sub: '67% to 93%' }
  figures:
    - src: publications/sensors2020/sensors2020_flowchart.jpg
      title: 'Processing pipeline'
      section: approach
      alt: Overall processing pipeline
      caption: 'Processing pipeline: a single-input path reads Z-domain pole-zero positions; a multi-input path sums acquisitions through a tunable high-pass filter - together lifting accuracy from 67% to 93%.'
    - src: publications/sensors2020/sensors2020_apnea.jpg
      title: 'Apnea in the radar signal'
      section: problem
      alt: Abnormal (apnea) respiration examples
      caption: 'Two apnea examples from the UWB radar: regular breathing oscillations are interrupted by flat intervals where chest motion stops.'
    - src: publications/sensors2020/sensors2020_fusion.svg
      section: results
      featured: true
      alt: 'Detection accuracy rises from 67% (single input) to 93% (triple-input fusion)'
      caption: 'The payoff of multi-input fusion: a single acquisition detects apnea at 67%; summing two-to-three lifts it to 93%, a +26-point gain.'
    - src: publications/sensors2020/sensors2020_zdomain_uc.jpg
      title: 'Z-domain pole-zero classification'
      section: lead
      alt: Z-domain pole-zero classification (unit-circle panels)
      caption: 'Z-domain classification: in the pole-zero plots of B1(z)/A1(z) and B1(z)/A0(z), zeros trace the unit circle and poles cluster near the origin - the decision rule reads their positions to tell normal from apnea.'
    - src: publications/sensors2020/sensors2020_filter.jpg
      title: 'High-pass filtered responses'
      section: results
      featured: true
      alt: High-pass filtered responses (triple input)
      caption: 'High-pass-filtered responses for three combined inputs, from (a) all-normal to (d) all-apnea: apnea appears as sharp transient bursts whose count grows with apnea content.'
  acknowledgements: This research was supported by Keimyung University. We thank the reviewers for their valuable feedback and suggestions.
