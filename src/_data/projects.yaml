# Single source for all projects. Bodies+figures verified vs repos & finalized per owner rules:
# Public portfolio data with non-confidential scope labels and evidence framing.
# no unproven field results, solo/main-developer authorship. Zero unresolved markers.
- slug: multi-agent
  title: Multi-Agent Manufacturing QC
  scope: R&D prototype · open/synthetic data
  tagline: 'An on-prem multi-agent QC system on one rule — the LLM orchestrates but never guards. Eleven agents cross-examine ML-tool evidence; a deterministic guardrail and a human-in-the-loop catch disagreement. Runs locally on Ollama + RTX 3060.'
  thumb: thumbs/multi_agent_thumb.png
  tier: rich
  home: true
  order: 3
  tldr: 'An R&D system on one principle — the LLM orchestrates but never guards. Eleven LLM-driven agents inspect casting images and equipment-sensor data through a two-tier pipeline (a deterministic Fast Path for clear cases, a Goal-Driven ReAct loop for the rest); a rule-based guardrail — not another LLM — catches cross-agent contradictions and routes disagreement through a 2-round deliberation, escalating unresolved cases to a human, all on-prem on Ollama + RTX 3060 (one env var swaps to Claude or Gemini). Scope is stated up front: a single-machine architecture demo validated entirely on synthetic and open datasets — the engineering target is the orchestration, guardrails, and human-in-the-loop trace, not the underlying ML models.'
  stats:
    - value: '11'
      label: LLM agents
      sub: two-tier pipeline, one guardrail
    - value: '1,150'
      label: passing tests
      sub: 1,168 collected
    - value: '~18k'
      label: lines of code
      sub: ~15k Python · ~3k TypeScript
    - value: $0
      label: recurring API cost
      sub: on-prem Ollama default
  problem: 'Manufacturing QC sits between two unsatisfying extremes: rule-based systems that go brittle as defect modes multiply, and end-to-end ML models that produce verdicts an operator cannot audit. What a real line needs is in between: a system that uses multiple narrow ML tools (PatchCore, AnomalyCLIP, XGBoost RUL) but treats their outputs as evidence to be cross-examined, not ground truth, and that escalates instead of silently choosing a tiebreaker when the tools disagree. That is the gap this project fills.'
  contributions:
    - 'Built end-to-end as the sole developer: the 11-agent orchestration, the guardrail and deliberation layers, the LLM-provider abstraction, the ML-tool wiring, and the React/TypeScript dashboard (the design choices behind each are below).'
    - 'ML-tool wiring as evidence, not verdicts: PatchCore / AnomalyCLIP / Grounded-SAM2 for vision and XGBoost / Chronos for RUL, each wrapped as a tool whose output the agents cross-examine rather than trust.'
    - Reviewable trace surfaced through a dashboard (ReAct Timeline, Cross-Agent Graph, Guardrail Log, Deliberation Trace, HITL queue, Metrics) so every verdict can be audited end to end.
  design_decisions:
    - id: guardrail
      title: LLM is the orchestrator, never the guardrail
      detail: 'Guardrail violations (physical_inconsistency, cross_agent_contradiction, low_confidence, tool_anomaly, cost_time_exceeded) are evaluated by deterministic Python rules in shared/guardrail.py. An LLM judging an LLM has no error floor; a rule does. Keeping the safety net separate from the agent layer is non-negotiable. The same principle shapes the feedback loop: the Learning agent observes HITL approvals/rejections and suggests threshold deltas via analyze_hitl_history + suggest_threshold_adjustment, but the suggestion is never auto-applied. There is no DB write, no config write, no consumer that mutates state from a model output. An operator manually applies the change, which then takes effect in the next inspection''s guardrail evaluation. The loop is half-closed on purpose: parameters adapt, rules and write-paths stay human-authored. Verified by grep: suggest_threshold_adjustment is referenced in only 6 files, all of them tests / stub / the tuner itself / the agent registry, with no consumer applying the suggestion.'
    - id: two-tier
      title: 'Two-tier speed: Fast Path before ReAct'
      detail: When an ML tool returns a confident result (PatchCore score > 0.9 or < 0.2, sensor |z-score| < 2), the agent skips the LLM entirely and returns the deterministic verdict in milliseconds. The expensive ReAct loop only fires when tools alone don't resolve the case. This collapses the median latency of clear cases without giving up the long-tail reasoning. The cheap path runs first by design, not as a fallback.
    - id: disagreement
      title: Disagreement is a first-class state, not a failure
      detail: 'When Recognition reports DEFECT and Prediction reports NORMAL, the system does NOT pick a tiebreaker. It enters a 2-round Deliberation Protocol: Round 1 each agent re-states a position with evidence; Round 2 each rebuts the other''s claims; a synthesis node decides if there is consensus or escalates to HITL. The dashboard shows the full trace.'
    - title: On-prem first
      detail: Default config is Ollama running qwen2.5:7b locally on a 12 GB GPU, so inspection data never leaves the machine. The same code path swaps to Claude or Gemini by changing one env var (LLM_PROVIDER=claude|gemini|ollama). Data sovereignty is the constraint manufacturers in this domain raise most often, so positioning it as the default rather than the option was deliberate.
    - title: Goal in the prompt, not how-to
      detail: 'Every system prompt across all 11 agents follows the same skeleton: Domain -> Goal -> Available tools -> Constraints -> JSON output. Notably absent: instructions like ''if score > 0.5 then call SAM2'', ''first call A then call B'', or ''if confidence > 0.9 return early''. The LLM picks tools, sequence, and stop point, guided only by the goal text, the constraint list, and the tool results it observes. When the toolchain shifts (PatchCore -> FastFlow), only the Available tools block changes; the orchestration logic stays untouched. One mild exception: the Automation agent carries a single soft-ordering constraint (CRITICAL priority actions require HITL approval before execution).'
