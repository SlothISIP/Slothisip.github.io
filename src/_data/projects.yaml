- slug: causal-rca
  title: Causal RCA Platform
  scope: Research prototype · open/synthetic data
  tagline: 'Correlation tells you which variables move together; causation tells you which one to fix. This research platform learns the process causal graph via ensemble discovery (PC, GES, NOTEARS, FCI), then ranks root causes by |ATE| x edge_confidence x bootstrap_stability.'
  thumb: thumbs/causal_rca_thumb.png
  tier: rich
  home: true
  order: 5
  tldr: 'Most defect analytics stops at correlation; this research platform learns the causal graph instead, so root causes are separated from co-symptoms and what-if changes can be screened with do-calculus before touching the line. Four discovery algorithms (PC, GES, NOTEARS, FCI) vote into a 12-node / 7-edge DAG, DoWhy ATE with refutation tests guards the effects, and causes rank by |ATE| x edge_confidence x bootstrap_stability. Research prototype validated on a synthetic injection-molding dataset plus open SECOM/TEP benchmarks; no real-factory numbers are claimed.'
  stats:
    - value: '4'
      label: discovery algorithms
      sub: PC · GES · NOTEARS · FCI, ensemble-voted
    - value: '12 / 7'
      label: nodes / edges
      sub: consensus DAG after stability filtering
    - value: '45+'
      label: API endpoints
      sub: FastAPI, API-key auth + RBAC
    - value: '700+'
      label: tests
      sub: unit and integration
  problem: Manufacturing process analytics typically stops at correlation-based defect detection, which tells you which variables move together but not which ones actually cause defects. That leaves operators unable to know which process change will fix a defect versus which is merely a co-symptom, and any what-if change has to be reasoned about without a model of cause and effect. The platform addresses this by learning the causal graph of the process and quantifying cause-effect strength, so root causes can be ranked and interventions can be screened against a causal model before being applied. The validation target is a synthetic injection-molding dataset with 12 variables organized into 3 tiers (process parameters -> intermediate states -> defects) and 13 ground-truth causal edges, plus the open SECOM and TEP benchmarks; real-factory numbers are explicitly not claimed.
  contributions:
    - 'Causal core, built end-to-end as main developer: four discovery algorithms (PC, GES, FCI via causal-learn, custom NOTEARS) behind a unified runner with weighted ensemble voting and joblib-parallel bootstrap edge stability, feeding a DoWhy ATE estimator guarded by three refutation tests (placebo, random common cause, data subset) and a do-calculus intervention simulator.'
    - 'RCA engine and analytics: composite scoring |ATE| x edge_confidence x bootstrap_stability extended with mediation, multi-hop path, conditional, and counterfactual RCA; temporal discovery (Granger, window-based GES, regime detection); and a JSON-backed model registry with a 4-stage lifecycle, data/concept-drift detection (KS + PSI), and A/B comparison.'
    - 'Full delivery stack: FastAPI backend (45+ endpoints, API-key auth + RBAC), a React 18 + TypeScript + MUI 6 SPA (12 pages, D3.js causal-graph viz, EN/KO, SSE-streamed local-Ollama chat grounded by ~1500-token context injection), 9 phase-based orchestrators, 700+ tests, and Docker Compose + GitHub Actions CI/CD.'
  design_decisions:
    - title: Learn causality, not correlation
      detail: Rather than stopping at correlation-based defect detection, the platform learns the causal graph of the process via causal discovery (PC, GES, NOTEARS, FCI) so that root causes are distinguished from co-symptoms and interventions can be reasoned about with do-calculus.
    - title: Ensemble discovery with bootstrap edge stability
      detail: No single discovery algorithm is trusted alone. Four algorithms (PC, GES, FCI via causal-learn, and a custom NOTEARS) run behind a unified runner, then weighted ensemble voting plus bootstrap-based edge stability (joblib-parallelized) decide which edges survive into the final DAG, reducing dependence on any one method's assumptions.
    - title: Guard inferred effects with refutation tests
      detail: Effect estimation uses DoWhy ATE with three refutation tests (placebo treatment, random common cause, data subset). Effects that do not survive refutation are treated as suspect, guarding against spurious cause-effect claims.
    - title: Transparent composite RCA scoring
      detail: Root causes are ranked by score = |ATE| x edge_confidence x bootstrap_stability, and every row exposes the underlying ATE, edge confidence, composite score, and bootstrap stability separately so the ranking never becomes a black box. An operator can see, for target Shrinkage, that Cooling Time outranks Mold Temp because its absolute effect is larger while its edge is as confident (82%) and as stable (100%) as Mold Temp's.
    - title: Extend beyond plain RCA
      detail: The RCA engine adds mediation analysis (decomposing total effect into direct vs. indirect paths), multi-hop path analysis, conditional RCA (conditioning on a covariate), and counterfactual RCA, exposed through an Advanced Root Cause Analysis panel.
    - title: Screen interventions against the causal model
      detail: 'A What-If page simulates do-interventions on the learned graph: the user picks an intervention variable, sets a counterfactual value, picks a downstream target, and the system returns the expected outcome and the delta from baseline (e.g., forcing Mold Temp = 45 yields expected Shrinkage -6.15 vs baseline -0.001). This lets a user screen candidate process changes against the causal model before applying them, and stacks on a parameter-sweep utility for continuous variable scans.'
    - title: Phase-based orchestration
      detail: The pipeline is organized into 9 phase-based orchestrators sharing a common base class, spanning data ingestion through discovery, inference, RCA, and delivery, which keeps each stage independently testable and composable.
    - title: Multi-process registry
      detail: 'The platform manages multiple process types in parallel rather than a single hardcoded process. Three built-in processes ship: injection_molding (12 vars, 13 edges; defects Dim Defect / Flow Mark), extrusion (10 vars, 10 edges; defects Dimensional Accuracy / Tensile Strength), and cnc_machining (10 vars, 10 edges; defects Dimensional Tolerance / Tool Life).'
    - title: MLOps lifecycle and drift detection
      detail: A JSON-backed model registry tracks a 4-stage lifecycle (candidate -> staging -> production -> archived), with data-drift detection (KS test + PSI), concept-drift detection (edge- and ATE-comparison), and an A/B comparison engine with a recommendation heuristic to decide which model to promote.
