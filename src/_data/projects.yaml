      detail: A local Ollama model (qwen2.5:3b default) is integrated with SSE streaming. A context-injection prompt summarizes the current causal graph and RCA results into ~1500 tokens so the assistant answers natural-language questions while staying grounded in the actual model state rather than hallucinating.
