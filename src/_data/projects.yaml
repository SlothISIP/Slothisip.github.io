- slug: apex-ml
  title: APEX-ML - Open Benchmark
  scope: Open-data benchmark · no company/client data
  tagline: 'Screen cheap, then spend GPU compute only on survivors. A GPU-native AutoML platform whose 3-phase pipeline (Rapid Screening, Optuna TPE tuning, genetic-algorithm ensemble) explores ~85 algorithms for imbalanced tabular classification, benchmarked on the public Credit Card Fraud dataset.'
  thumb: thumbs/apex_ml_thumb.png
  tier: enhanced
  home: true
  order: 9
  tldr: 'Unlike general-purpose AutoML (Auto-sklearn, TPOT) that tunes the full candidate set, APEX-ML screens ~85 algorithms cheaply on a 10% sample, then spends Optuna TPE and genetic-algorithm compute only on the survivors — a 3-phase funnel for imbalanced tabular classification on Ray-distributed GPUs. The public Credit Card Fraud dataset (284,807 samples, 0.17% positives) is used as an integration and throughput benchmark; raw accuracy is not presented as evidence of model quality at that imbalance. Scope is stated up front: this open-data project shares its name and approach with an AutoML platform I built at JS SYSTEM, but no company data, results, or client work are reproduced here — it was built and validated solo on open/public datasets, not deployed at any client.'
  stats:
    - value: '284,807'
      label: benchmark samples
      sub: Credit Card Fraud dataset
    - value: '0.17%'
      label: positive class
      sub: extreme imbalance
    - value: '3'
      label: pipeline phases
      sub: screen · tune · ensemble
    - value: '23'
      label: committed core tests
      sub: repository-verified suite
  problem: General-purpose AutoML tools (Auto-sklearn, TPOT) are slow and not GPU-native, and building strong models for imbalanced tabular classification (e.g. fraud or defect detection) takes substantial manual ML effort. The goal of this personal R&D project was a GPU-native AutoML platform that exhaustively explores a large algorithm space efficiently and is purpose-built for imbalanced classification. It shares its name and approach with an AutoML platform I built at JS SYSTEM, but no company data, results, or client work are reproduced here — it is a solo-built engineering project validated on open/public datasets, not deployed at any client.
  contributions:
    - 'Built end-to-end as the sole developer: the complete 3-phase pipeline (Rapid Screening -> Focused Optimization -> Self-Evolution), the FastAPI backend (port 8010), and the FastAPI-served HTML/vanilla-JS/Plotly.js dashboard for real-time pipeline monitoring (no React/Vue/Angular framework).'
    - 'Implemented and integrated ~85 ML algorithms (81 classification-capable) across roughly 15 categories — Tree-Based, Traditional ML, Neural Networks, Deep Tabular, Foundation Models, Ensemble, GNN, Meta-Learning, Quantum-Inspired, Self-Supervised, Time Series, Clustering, and SOTA 2024-2025 — with custom meta-learning warm-start configurations.'
    - 'Engineered the GPU layer and validation: distributed GPU scheduling via Ray (backend/distributed/, @ray.remote num_gpus tasks, RayClusterManager, checkpoint-based fault tolerance) and Optuna TPE Bayesian tuning, validated end-to-end on open/public datasets (Credit Card Fraud, diabetes, titanic, wine-quality, breast-cancer, iris) with a committed 23-test core suite (tests/test_core.py).'
  design_decisions:
    - title: 3-Phase progressive pipeline over single-phase AutoML
      detail: 'Context: general-purpose AutoML tools (Auto-sklearn, TPOT) are slow because they tune the full candidate set. Options weighed: single-phase exhaustive search vs. multi-phase progressive refinement. Decision: a 3-phase pipeline — Phase 1 Rapid Screening evaluates candidates on a 10% data sample to eliminate weak algorithms, Phase 2 Focused Optimization concentrates Optuna TPE Bayesian tuning on the surviving top candidates, Phase 3 Self-Evolution evolves and stacks the best models via a genetic algorithm (crossover/mutation). Per the repo''s user guide the phases run Phase 1 ~5-15 min, Phase 2 ~15-45 min, Phase 3 ~10-30 min, with Fast mode (15 algorithms) ~5-15 min, Normal (30) ~15-45 min, and Production (all ~85) 1-6 hours; the public Credit Card Fraud benchmark (284,807 samples) ran ~6 hours end-to-end.'
    - title: Ray cluster over Dask / Apache Spark for distributed GPU scheduling
      detail: 'Context: needed distributed GPU scheduling to evaluate the algorithm set in parallel. Options weighed: Ray, Dask, Apache Spark. Decision: Ray, because it provides native GPU task scheduling and integrates seamlessly with Optuna for distributed hyperparameter tuning, whereas Spark lacks GPU-native support. The Ray-based distributed layer (backend/distributed/) implements checkpoint-based fault tolerance and multi-node cluster execution (distributed_algorithm_trainer.py with @ray.remote num_gpus=0.25, RayClusterManager, and node-failure tracking in distributed_monitoring.py).'
    - title: Optuna with Tree-structured Parzen Estimator (TPE) for Phase 2 hyperparameter optimization
      detail: Phase 2 (Focused Optimization) employs Optuna-based Bayesian optimization with the TPE sampler (backend/algorithms/gpu_algorithm_optimizer.py imports optuna.samplers.TPESampler) to tune hyperparameters only on the top-performing algorithms surviving Phase 1, concentrating compute where it yields the most gain rather than tuning all candidates. The dashboard visualizes the optimization landscape, acquisition function, and convergence trajectory.
    - title: GPU-native full-CUDA pipeline with a 70-80% utilization target on consumer GPUs
      detail: The pipeline runs on CUDA with dynamic batch scheduling and memory-pressure management. The optimizer code sets an explicit GPU-utilization target (backend/algorithms/gpu_algorithm_optimizer.py:95, target_gpu_utilization = 70.0, aiming for 70-80%) so algorithm screening saturates the GPU rather than leaving it idle; the documentation cites a 60-80% utilization range as the design target on an RTX 4090.
    - title: 'Phase 3 Self-Evolution: genetic-algorithm ensemble construction'
      detail: 'Rather than shipping the single best model, Phase 3 runs a SelfEvolutionEngine that evolves the best models through crossover and mutation and stacks them into an optimized ensemble with dynamic weighting (backend/pipline/main_pipeline.py: ''Phase 3: Self-Evolution (genetic algorithm)''; advanced ensemble methods include Caruana, Stacking, and Blending), reporting accuracy, F1, precision, and recall per the configured metrics.'
    - title: Domain specialization for imbalanced tabular classification
      detail: Unlike general-purpose AutoML, APEX-ML is purpose-built for imbalanced classification. The public Credit Card Fraud benchmark has only 0.17% positives, which is why the pipeline is configured to emphasize F1, precision, and recall rather than treating raw accuracy as a sufficient quality measure.
  foothold:
    - claim: ~85 registered algorithms (canonical '85 Unique') across roughly 15 categories; 81 of them are classification-capable.
      evidence: 'The repo''s project-overview doc, ''Algorithm System (85 Unique)'' with ''Classification capable: 81'', ''Regression capable: 46'', ''Categories (15)''; docs/configuration/algorithms.md, docs/USER_GUIDE.md, docs/END_TO_END_TEST_PLAN.md all state 85 algorithms. backend/models/algorithm_factory.py registers the algorithm set via self.algorithms[...] entries (with conditionally-registered XGBoost/LightGBM/CatBoost). NOTE: README badge/body say 81 (the classification-capable subset) and docs/ARCHITECTURE.md says 84 — an internal documentation inconsistency.'
    - claim: Completed a full 3-phase run on the public Credit Card Fraud benchmark (284,807 samples, 0.17% positives).
      evidence: 'docs/README.md:119-147 documents the Credit Card Fraud run (284,807 samples, 0.17% fraud, ~6 hours, 8.1 GB); docs/USER_GUIDE.md:1215-1216 records the Phase 1 run. Because raw accuracy is weak evidence at this class ratio and the source CSV is not committed, the portfolio treats this as an integration/throughput benchmark rather than a comparative model-quality result.'
    - claim: Validated on open/public datasets only.
      evidence: 'Committed datasets are all public: data/diabetes.csv, data/titanic.csv, data/winequality-red.csv, data/winequality-white.csv, data/wine_quality_combined.csv, test_data/breast_cancer.csv, test_data/iris.csv, test_data/sklearn_wine.csv; the flagship Credit Card Fraud benchmark is the well-known public Kaggle dataset. No proprietary or client data is present.'
    - claim: Per-phase / per-mode runtimes from the repo's user guide.
      evidence: 'docs/USER_GUIDE.md:71-95: Phase 1 Rapid Screening 5-15 min, Phase 2 Focused Optimization 15-45 min, Phase 3 Self-Evolution 10-30 min; modes Fast (15 algs) 5-15 min, Normal (30) 15-45 min, Production (~85) 1-6 hours. The flagship Credit Card Fraud run (284,807 samples) took ~6 hours end-to-end (docs/README.md:147).'
    - claim: Optuna Bayesian optimization uses the Tree-structured Parzen Estimator (TPE) sampler.
      evidence: 'Confirmed: backend/algorithms/gpu_algorithm_optimizer.py:263 ''from optuna.samplers import TPESampler'' and :268 ''sampler=TPESampler(...)''; requirements.txt ''optuna>=3.5.0''.'
    - claim: 70-80% GPU-utilization target set in the optimizer code.
      evidence: 'Confirmed: backend/algorithms/gpu_algorithm_optimizer.py:95 ''target_gpu_utilization: float = 70.0  # Aim for 70-80% GPU utilization''; the 60-80% range is documented as the design target in docs/README.md and backend/algorithms/GPU_INTEGRATION_SUMMARY.md. Stated as a target; no profiler/nvidia-smi capture is committed.'
    - claim: Ray cluster supports fault tolerance and multi-node scheduling.
      evidence: 'Confirmed in code: backend/distributed/ (distributed_algorithm_trainer.py @ray.remote num_gpus=0.25 with checkpointing for fault tolerance; RayClusterManager; distributed_monitoring.py tracks cluster_nodes / node_failure_threshold); requirements.txt ''ray[default]>=2.10.0''.'
