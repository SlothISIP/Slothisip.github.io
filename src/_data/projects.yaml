- slug: full-factory
  title: Full AI Factory — Camera-First Manufacturing Platform
  scope: R&D prototype · synthetic data
  tagline: 'Camera-First as a product mode, not a fallback: replace each missing PLC sensor with a camera-derived signal so both modes emit identical downstream events. 14 logical agents (8 classes × line_id) under a LangGraph fan-out / Coordinator fan-in, with architectural invariants enforced at pre-commit time.'
  thumb: thumbs/full_factory_thumb.png
  tier: rich
  home: true
  order: 4
  tldr: 'A 7-line factory platform on one thesis — when a legacy plant has no PLC sensors, replace each with a camera signal so both modes emit identical downstream events and the 19 backend modules and 14 agents never branch on factory mode. Those 14 logical agents (8 classes × line_id) run under a LangGraph 4-way fan-out -> Coordinator fan-in, with architectural invariants enforced by a pre-commit arch_check.sh. Scope is stated up front: a single-machine R&D demo on synthetic data calibrated against open datasets, not deployed in any factory, with demo-grade auth pending a documented JWT/OAuth swap.'
  stats:
    - value: '14'
      label: logical agents
      sub: 8 classes × line_id
    - value: '156'
      label: REST endpoints
      sub: 19 backend modules
    - value: '189/189'
      label: frontend tests pass
      sub: pytest backend/sim/ai/agent also pass
    - value: '35/35'
      label: live health checks
      sub: infra + app + module endpoints
  problem: 'Most "smart factory" platforms assume a brownfield retrofit: install dozens of new PLC-connected sensors, integrate them into the historian, build dashboards on top. That assumption fails on the line that needs help most — the small or aging auto-parts plant where every retrofit is a capex fight, where process changes are frequent enough that a fixed sensor topology gets stale within months, and where shop-floor paperwork still flows through clipboards and signed copies. The architectural question is whether you can replace each sensor signal with a camera-derived signal cheaply enough that the rest of the stack — MES, ERP, SPC, QMS, WMS, APS, CMMS, predictive maintenance, agent orchestration — doesn''t have to know which mode is active. That''s the gap this project investigates.'
  contributions:
    - 'Built solo, end-to-end as the main developer — full stack (React/R3F UI, FastAPI backend, AI engine, LangGraph agents, simulator) plus the architecture-enforcement tooling, including Camera-First as a runtime-switchable mode (Mode B) that publishes the same Redis Streams topics and schema as Full Sensor mode (Mode A), so the 19 backend modules and 14 agents never branch on factoryMode.'
    - 'A 14-logical-agent system built from 8 classes via line_id parametrization, orchestrated by a LangGraph 4-way fan-out -> Coordinator fan-in: every LLM verdict carries a confidence score, and timeout / exception / low-confidence (below the 0.3 default threshold) all converge on the same hand-authored Python rule-based codepath — no LLM-as-judge anywhere. The fan-in Coordinator also authors the Korean shop-floor documents (work log, daily report, handoff) in one synthesis step, so the paperwork never diverges from what the system understood.'
    - 'Architectural invariants (Redis-Streams-only inter-module comms, 10 WS channels, audit_log on every CUD, source field on TimescaleDB inserts, ko/en i18n key parity) enforced by a 130-line pre-commit arch_check.sh hook running in <1s on every Edit/Write, with four physics-based degradation scenarios and open-dataset-calibrated line parameters (NASA C-MAPSS, Kaggle CNC tool-wear, RIAWELC/WDXI, MVTec AD) for repeatable end-to-end demonstration.'
  design_decisions:
    - id: camera-first
      title: 1. Camera-First is a product mode, not a fallback.
      detail: 'Mode A (Full Sensor) and Mode B (Camera-First) are first-class, runtime-switchable factory modes. The contract is that both publish the same Redis Streams topics with the same schema — sensor:{lineId}, event:production:{lineId}, event:quality:{lineId}, camera:{lineId} are interchangeable from a consumer''s perspective. The 19 backend modules and 14 agents do not branch on factoryMode; they treat any incoming event as ground truth and only the simulator + camera pipeline differ. This means Mode B doesn''t just "degrade gracefully" — it produces the exact same operational picture the rest of the platform consumes. Mode switch is a single API call: POST /api/v1/integration/factory-mode with {"mode":"A"} or {"mode":"B"}.'
    - title: 2. line_id parametrization, not class duplication.
      detail: Seven production lines could have been seven monitor classes. They are not. A single LineMonitorAgent class is invoked seven times per agent-loop tick (~30 s interval), once per line_id, via a Redis Streams dispatcher. Results land in a single agent:response:line_monitor stream with line_id as a discriminator field. The invariant is enforced in three places — backend/app/main.py:ACTIVE_LINE_CODES, backend/app/modules/integration/agent_loop.py:DEFAULT_LINE_CODES, and the simulator publish loop — and called out explicitly in the project rules. Adding L8 means changing three constants, not authoring an L8MonitorAgent class. This is the kind of decision that looks small until you imagine maintaining seven near-identical agent files.
    - title: 3. Confidence is the routing key, not LLM accuracy.
      detail: 'Every BaseAgent.run() call wraps the LLM verdict in an AgentResult with an explicit confidence float and provider tag. A deterministic helper needs_rule_fallback() in agent/agents/base_agent.py evaluates: (a) provider == "fallback" — the LLM call already failed mechanically (all providers exhausted); (b) confidence < settings.confidence_threshold (default 0.3). Either condition routes the case to that agent''s _fallback() implementation — a hand-authored Python classifier in agent/fallback/rules.py — and the result is re-wrapped with provider="rule_fallback" and an explicit fallback_reason. The same path catches LLM timeouts and exceptions: timeout, exception, and low-confidence all converge on the same deterministic codepath. There is no LLM-as-judge anywhere in the orchestration; the only thing an LLM can do is propose a verdict that a Python rule then accepts or replaces.'
    - title: 4. Inter-module communication is Redis Streams only — enforced at hook time.
      detail: 'Backend modules (backend/app/modules/{mes,erp,spc,qms,wms,aps,cmms,energy,safety,...}) cannot import each other directly. The sole permitted cross-module channel is the Redis Streams event bus. A scripts/arch_check.sh script — wired to run automatically on every file edit — greps for cross-module imports, verifies the WS channel set is exactly the 10 documented channels, checks audit_log coverage on every CUD, checks source-field presence on TimescaleDB inserts (sensor_data / spc_measurements), and checks both hardcoded-Korean-literal absence and ko<->en i18n key-count parity. Five rules, 130 lines of bash, runs in <1 s on every file change. (The Zustand 7-store ceiling is a documented project rule but is enforced by convention, not by this script.) Documented exceptions live in docs/ARCH_EXCEPTIONS.md with explicit # arch-allow markers in code — four entries, each with a written rationale.'
    - title: 5. The Coordinator is the document author.
      detail: 'In most multi-agent designs, document generation is a separate concern bolted onto the orchestrator. Here it is the Coordinator''s natural fan-in output. After the LangGraph 4-way fan-out (Quality / Maintenance / Planning / Energy) joins, the Coordinator flattens each domain''s (severity, summary) into the next AgentInput.context and synthesizes work log, daily report, and handoff document directly. The Document agent then handles routing, approval workflow, e-signature, and CAPA registration — but it inherits a fully-authored payload from the Coordinator rather than re-summarizing the agent traces itself. This means the operator never sees a difference between "what the system understood" and "what the paperwork says": there is exactly one synthesis step, and it produces both the operational alert and the document.'
    - id: heater-flow
      title: End-to-End Flow — Heater Degradation Scenario (physics-based, not random noise)
      detail: 'A single L1 anomaly traverses all five layers. simulator/scenarios/heater_degradation.py applies a quadratic drift curve to L1 Zone 1 (nozzle) over 72 simulated hours: degradation = (elapsed_h / 72)^2, accelerating slowly. After hour 48, the model adds a sympathetic compensation on Zones 2-3 (operators on real injection lines do this reflexively), and yield decays in three steps: 99.5% -> 94% -> 90%. Severity transitions through NORMAL -> INFO -> WARNING -> CRITICAL in lockstep with the curve. The seven-stage flow runs simulator -> SPC Westgard rule -> LineMonitor (with confidence-routed fallback) -> LangGraph 4-way fan-out -> Coordinator fan-in -> Document agent -> WS-pushed UI updates across four channels. The other three scenarios (die_wear on L2, electrode_wear on L5, safety_intrusion across all lines) follow the same pattern: a real degradation mode rendered as a parameterizable curve, not stochastic ground-truth labels.'
