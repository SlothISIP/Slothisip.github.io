- slug: production-scheduler
  title: AI Production Scheduler
  scope: Applied engineering · public-safe summary
  tagline: 'Developed and validated a production-scale scheduling system for manufacturing workflows, outperforming a legacy planning baseline while satisfying all hard constraints.'
  thumb: projects/production-scheduler/public_safe_overview.svg
  tier: enhanced
  home: true
  order: 1
  tldr: 'Developed and validated a production-scale scheduling system for manufacturing workflows, outperforming a legacy planning baseline while satisfying all hard constraints.'
  problem: 'Manufacturing scheduling must convert changing production demand into a feasible plan while respecting hard operational constraints and balancing competing efficiency objectives. The engineering challenge was to improve planning quality without allowing an optimization gain to invalidate the schedule.'
  contributions:
    - 'Developed the scheduling workflow end to end, including input validation, constraint handling, optimization, schedule generation, and an operational monitoring interface.'
    - 'Evaluated heuristic and exact optimization approaches, selecting methods according to workload scale and response-time requirements.'
    - 'Validated the system against a legacy planning baseline while treating hard-constraint feasibility as a release gate.'
  design_decisions:
    - title: Feasibility before objective improvement
      detail: 'Hard operational constraints are checked before any candidate schedule can be accepted, so an apparent optimization gain cannot produce an unusable plan.'
    - title: Method selection by workload
      detail: 'The system chooses between fast heuristic search and exact optimization according to problem scale and the available response-time budget instead of forcing one solver onto every case.'
