      evidence: results/FULL_MODE_FINAL_REPORT.md 'MIMII (18,019 wav files)'; results/sota_final_results_20251225.md dataset stats (e.g. Fan 4,075 normal test); archive/research/DATASET_COMPLETION_REPORT.md per-machine 4k-5.5k wav files. MIMII / DCASE 2020 Task 2 are public benchmark datasets.
