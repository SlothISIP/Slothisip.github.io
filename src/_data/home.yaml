# Home-page narrative content (inline org/advisor links restored; award split into its own field).
bio: I'm an AI Research Engineer at <a href="https://js-system.co.kr/">JS SYSTEM</a>'s R&D Division, working at the intersection of physics-informed machine learning and industrial systems. My research spans neural operators, acoustic tomography, and physics-informed Bayesian optimization; my engineering work spans multimodal sensing, anomaly detection, production scheduling, and on-prem AI systems with deterministic safeguards. I received my Master of Engineering in Computer Engineering (Artificial Intelligence) from <a href="https://www.kmu.ac.kr/">Keimyung University</a> in 2025 and am now pursuing a Ph.D. there under <a href="https://sites.google.com/view/dwoolee/deokwoo-lee">Prof. Deokwoo Lee</a>. I am first author of five SCI/SCIE journal papers.
