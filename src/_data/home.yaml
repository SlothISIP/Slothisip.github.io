experience:
  - role: AI Research Engineer, R&D Division
    org: <a href="https://js-system.co.kr/">JS SYSTEM</a> (Manufacturing AI Solutions)
    period: Feb 2025 - Present
    detail: 'Develop end-to-end AI systems spanning model development, data pipelines, APIs, deployment, and technical coordination. Developed an AutoML workflow combining model screening, hyperparameter optimization, and ensemble construction. Built acoustic anomaly-detection and on-prem multi-agent systems with deterministic guardrails and human-in-the-loop control.'
  - role: Researcher, R&D Department
    org: Seongwoo Instruments
    period: Feb 2023 - Mar 2024
    detail: 'Built a real-time micro-seismic monitoring system for superconducting seismic-wave detection under a government-funded national R&D program, in international collaboration with the University of Maryland (UMD) Physics Lab, including a 6-month on-site assignment at UMD, USA. Designed digital filters for extreme-sensitivity superconducting sensors, developed SVM and Random Forest classifiers for seismic-vs-noise discrimination, and built a high-throughput real-time data-streaming pipeline on a hybrid MATLAB-Python framework.'
  - role: Commissioned Researcher
    org: <a href="https://www.dgist.ac.kr/">DGIST</a> (Daegu Gyeongbuk Institute of Science and Technology)
    period: Mar 2020 - Dec 2021
    detail: Developed vanishing-point-based calibration for a three-viewpoint thermal camera with wide-baseline (>180° / ~240°) view separation. Reduced reprojection error to 0.58-0.66 pixels without correspondence matching. Research published in the SCI-indexed Journal of Signal Processing Systems (Springer).
  - role: Graduate Researcher, NRF Research Project
    org: <a href="https://www.kmu.ac.kr/">Keimyung University</a>, Daegu, South Korea
    period: 2020 - 2022
    detail: 'Deep-learning-based depth-camera calibration: designed a DNN architecture for distortion correction that overcomes the limits of traditional geometric models for UAV/AMR perception, with training pipelines built on real-world datasets spanning varied weather and lighting conditions.'
